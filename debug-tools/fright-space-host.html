<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fright Space test host</title>
<style>body { margin: 0; background: #000; } iframe { width: 100%; height: 100vh; border: 0; display: block; }</style>
</head>
<body>
<!--
  Test host for debug-tools/fright-space-journey.mjs. It stands in for index.html's game panel:
  the same iframe sandbox and permissions, the same student-id query the portal appends, so the
  journey runs the game exactly as a student opens it. Nothing here signs in.
-->
<iframe id="game-iframe"
        allow="autoplay; fullscreen; accelerometer; gyroscope"
        sandbox="allow-same-origin allow-scripts allow-forms allow-pointer-lock allow-modals"></iframe>
<script>
  // the student-id query the portal appends, plus anything this page was given (?set=FS_DEBUG=1)
  document.getElementById("game-iframe").src = "../games/fright-space/web/fright-space.html?userId=journey-student"
    + (location.search ? "&" + location.search.slice(1) : "");
</script>
</body>
</html>
