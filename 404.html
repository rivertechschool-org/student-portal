<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · River Tech</title>
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <style>
    /* Self-contained on purpose. A 404 is exactly the moment a stylesheet
       path is likely to be wrong too, so this page depends on nothing. */
    :root {
      --bg: #0f1216; --card: #151a21; --text: #e6edf3; --muted: #97a2b0;
      --accent: #6aa9ff; --accent-2: #8bffb0; --border: #2a3140;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 32px; max-width: 560px; width: 100%;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .code { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px; }
    p { margin: 0 0 14px; color: var(--text); }
    .muted { color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    a.btn {
      display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none;
      border: 1px solid var(--border); color: var(--text); background: transparent;
    }
    a.btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1017; font-weight: 600; }
    a.btn:hover { border-color: var(--accent); }
    .path {
      display: block; margin-top: 18px; padding: 10px 12px; border-radius: 8px;
      background: rgba(0,0,0,.25); border: 1px solid var(--border);
      color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; word-break: break-all;
    }
    .notice { border-left: 3px solid var(--accent-2); padding: 12px 14px; border-radius: 8px;
              background: rgba(139,255,176,.06); margin-bottom: 18px; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 8px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f6f8fa; --card: #ffffff; --text: #1c2128; --muted: #57606a;
        --border: #d0d7de; --accent: #0969da;
      }
      :root:not([data-theme="dark"]) a.btn.primary { color: #fff; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="code">Error 404</div>
    <h1>That page isn’t here</h1>
    <p>The link may be out of date, or the address may have a typo in it.</p>
    <p class="muted">If you followed a link from inside the portal, tell an administrator which page sent you here — that is a broken link worth fixing rather than working around.</p>

    <div class="actions">
      <a class="btn primary" href="/portal/index.html">Go to the Portal</a>
      <a class="btn" href="/">Home</a>
    </div>

    <span class="path" id="path"></span>
  </div>

  <script>
    (function () {
      var path = document.getElementById('path');
      if (path) path.textContent = window.location.pathname + window.location.search + window.location.hash.replace(/(access_token|refresh_token)=[^&]*/g, '$1=…');

      // An auth email that resolved to the wrong path lands here with its tokens
      // still intact in the fragment. Rather than dead-ending a teacher who just
      // clicked "confirm my email", hand the tokens to the page that knows what
      // to do with them. Same origin, and the fragment is exactly what
      // confirm.html reads — so this repairs the link instead of reporting it.
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var looksLikeAuth =
        /access_token=|refresh_token=|token_hash=|[?&#]type=(recovery|invite|signup|email_change|magiclink)/.test(hash + search) ||
        /error_code=|error_description=/.test(hash);

      if (!looksLikeAuth) return;

      var target = '/confirm.html' + search + hash;
      document.getElementById('card').innerHTML =
        '<div class="code">Sign-in link</div>' +
        '<h1><span class="spinner"></span>Finishing that for you…</h1>' +
        '<div class="notice">This looks like a confirmation or sign-in link that pointed at the wrong address. ' +
        'Taking you to the right page — nothing is lost.</div>' +
        '<p class="muted">If nothing happens, use the button below.</p>' +
        '<div class="actions"><a class="btn primary" href="' + target.replace(/"/g, '&quot;') + '">Continue</a>' +
        '<a class="btn" href="/">Home</a></div>';

      // Replace rather than assign, so Back does not bounce between 404 and
      // confirm.html.
      setTimeout(function () { window.location.replace(target); }, 900);
    })();
  </script>
</body>
</html>
