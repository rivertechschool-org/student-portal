<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 Training Log</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#0f1420; --card:#1a2332; --card2:#212d42; --border:#2c3a54; --text:#e8ecf4;
  --muted:#8b97ad; --accent:#ff6347; --accent2:#ff8a70; --good:#4caf7d; --warn:#e0a63c;
  --info:#5b9bd5; --chip:#26334c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
header h1{font-size:1.35rem}
header .sub{color:var(--muted);font-size:.85rem}
.band-pick{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.band-pick select{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.card h3{font-size:1rem;margin-bottom:2px}
.card .meta{color:var(--muted);font-size:.78rem;margin-bottom:8px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.72rem;color:var(--muted);margin:0 4px 4px 0}
.chip.mastered{background:rgba(76,175,125,.18);color:var(--good)}
.chip.progress{background:rgba(224,166,60,.16);color:var(--warn)}
.chip.exceeds{background:rgba(91,155,213,.18);color:var(--info)}
.chip.pr{background:rgba(255,99,71,.18);color:var(--accent2)}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:130px}
.stat .n{font-size:1.5rem;font-weight:700}
.stat .l{color:var(--muted);font-size:.75rem}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar>i.good{background:var(--good)}
.rowline{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;padding:4px 0}
.rowline .muted{color:var(--muted);font-size:.78rem}
button.act{background:var(--accent);border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:600}
button.act:disabled{background:var(--chip);color:var(--muted);cursor:default}
button.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.85rem}
input.val{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;width:110px;font-size:.9rem}
.logform{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.72rem;margin-top:6px}
.check-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.85rem}
.check-item .dot{width:18px;flex:none;text-align:center}
.crit{margin:6px 0}
.crit .cl{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.pips{display:flex;gap:4px;margin-top:3px}
.pip{width:22%;height:7px;border-radius:3px;background:var(--card2)}
.pip.on{background:var(--good)}
.svgchart{width:100%;height:110px;margin-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:20px}
.modal h2{font-size:1.1rem;margin-bottom:10px}
.step{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px}
.step .st{font-weight:600;margin-bottom:4px}
.step .ex{margin-top:6px;font-size:.85rem;color:var(--accent2)}
.mistake{font-size:.83rem;color:var(--warn);padding:3px 0}
.qopt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;margin:6px 0;cursor:pointer;font-size:.9rem}
.qopt.right{border-color:var(--good);background:rgba(76,175,125,.14)}
.qopt.wrong{border-color:var(--accent);background:rgba(255,99,71,.12)}
.empty{color:var(--muted);font-size:.9rem;padding:20px;text-align:center}
.legendline{display:flex;gap:14px;font-size:.72rem;color:var(--muted);margin-top:4px}
.legendline b{font-weight:400}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.88rem;display:none;z-index:60}
section.view{display:none} section.view.active{display:block}
h2.strand{font-size:.95rem;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏃 Training Log</h1>
    <div class="sub">Your physical record — measured, not quizzed</div>
    <div class="band-pick"><span>Grade band</span><select id="band-sel"></select></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-fitness"></section>
  <section class="view" id="view-skills"></section>
  <section class="view" id="view-sports"></section>
  <section class="view" id="view-knowledge"></section>
  <section class="view" id="view-habits"></section>
</div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="../shared/pe-data.js"></script>
<script>
'use strict';
// ============ Knowledge-strand content registries (content spliced below) ============
const STAGE_SKILLS = {1:[],2:[],3:[],4:[],5:[]};
const LESSONS = {};
const GENERATORS = {};

// ===== PE KNOWLEDGE CONTENT =====
(function(){
  function reg(name, stageId, lesson, genFn){
    LESSONS[name] = lesson;
    GENERATORS[name]=function(_st,_sk){var _q=genFn(_st,_sk); if(_q&&typeof _q.correct==='string'&&Array.isArray(_q.options)){var _ix=_q.options.indexOf(_q.correct); _q.correct=_ix<0?0:_ix;} return _q;};
    (STAGE_SKILLS[stageId] = STAGE_SKILLS[stageId] || []).push(name);
  }

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // Each bank entry: { p: prompt, o: [correct, distractor, distractor, distractor] }
  function makeGen(bank){
    return function(stage, skill){
      var q = bank[Math.floor(Math.random() * bank.length)];
      return {
        skill: skill,
        prompt: q.p,
        options: shuffle(q.o.slice()),
        correct: q.o[0]
      };
    };
  }

  // ---------------------------------------------------------------
  // 1. Safety & Warm-Up Basics (K-2) — stage 1
  // ---------------------------------------------------------------
  reg("Safety & Warm-Up Basics", 1, {
    steps: [
      { title: "Why We Warm Up",
        text: "A warm-up gets your body ready to play. It makes your heart beat a little faster, slowly and safely. Warm muscles move better and get hurt less.",
        ex: "Before playing tag, the class jogs slowly around the gym one time and does ten arm circles." },
      { title: "Why We Cool Down",
        text: "After we play hard, we cool down. A cool-down helps your heart slow down gently. Slow walking and easy stretches are great cool-down moves.",
        ex: "After relay races, everyone walks two slow laps and then reaches for their toes." },
      { title: "Safe Space Bubble",
        text: "Keep a space bubble around your body. Look around before you move, swing, or kick. A space bubble keeps you from bumping into friends.",
        ex: "Maya stretches her arms out and turns in a circle. If she cannot touch anyone, her space bubble is safe." },
      { title: "Equipment Rules",
        text: "Use PE equipment the way the teacher shows you. If something is broken, tell the teacher right away. Safe equipment use keeps everyone happy and healthy.",
        ex: "Leo sits on the scooter board like the teacher showed. He never stands on it." },
      { title: "Stop on the Signal",
        text: "When the teacher gives the stop signal, freeze right away. Stop, look at the teacher, and listen. The signal keeps everyone safe.",
        ex: "The whistle blows during tag. Everyone freezes like a statue and looks at the teacher." }
    ],
    mistakes: [
      "Thinking warming up wastes play time — actually it gets your body ready and helps keep you from getting hurt.",
      "Thinking you can sprint full speed the second class starts — actually cold muscles need slow moves first.",
      "Thinking the stop signal is only for other kids — actually everyone freezes when the signal comes.",
      "Thinking an untied shoe can wait — actually stop in a safe spot and tie it right away so you don't trip."
    ]
  }, makeGen([
    { p: "Why do we warm up before we play?",
      o: ["To get our bodies ready to move", "To make the game shorter", "To rest our legs", "Because the game needs more players"] },
    { p: "What is a good warm-up before running games?",
      o: ["Slow jogging", "Sitting still", "Sprinting as fast as you can right away", "Taking a nap"] },
    { p: "What do we do when the teacher blows the whistle?",
      o: ["Stop, look, and listen", "Run faster", "Keep playing", "Yell louder"] },
    { p: "What comes FIRST in PE class?",
      o: ["The warm-up", "The cool-down", "The big game", "The high fives at the end"] },
    { p: "Why do we cool down after we play hard?",
      o: ["To help our heart slow down gently", "To make our heart beat faster", "To win the game", "To get more sweaty"] },
    { p: "Before you swing your arms, what should you check?",
      o: ["That no one is inside your space bubble", "That your eyes are closed", "That you are very close to a friend", "That your hands are in your pockets"] },
    { p: "How should we use PE equipment?",
      o: ["The way the teacher showed us", "Any way we want", "As wildly as possible", "Only when the teacher is not looking"] },
    { p: "Maya's shoelace comes untied during tag. What should she do?",
      o: ["Stop in a safe spot and tie it", "Keep running", "Take off both shoes and keep playing", "Tuck the lace in and sprint"] },
    { p: "Which is a safe place to play a running game?",
      o: ["Open space away from walls", "Right next to a wall", "On a wet floor", "In the middle of a crowd"] },
    { p: "What does a warm-up do to your heart?",
      o: ["Makes it beat a little faster, slowly", "Makes it beat slower", "Makes it skip beats", "Nothing at all"] },
    { p: "Leo is holding a ball when the stop signal comes. What should he do?",
      o: ["Freeze and hold the ball still", "Throw the ball far away", "Bounce it faster", "Roll it at a friend"] },
    { p: "Which is part of a good cool-down?",
      o: ["Slow walking and easy stretches", "Fast sprinting", "Jumping as high as you can", "Racing a friend"] },
    { p: "Why do we keep a space bubble?",
      o: ["So we don't bump into others", "So we can push friends", "To hide from the teacher", "To run slower"] },
    { p: "Which move belongs in a warm-up?",
      o: ["Arm circles", "A long nap", "Eating a big meal", "Sitting on the bench the whole time"] },
    { p: "When should you tell the teacher about broken equipment?",
      o: ["Right away", "Never", "Next week", "Only if someone gets hurt first"] }
  ]));

  // ---------------------------------------------------------------
  // 2. Sportsmanship & Fair Play (K-2) — stage 1
  // ---------------------------------------------------------------
  reg("Sportsmanship & Fair Play", 1, {
    steps: [
      { title: "What Is Fair Play?",
        text: "Fair play means everyone follows the same rules. Rules make games fun and fair for all players. When we play fair, everyone gets a real chance.",
        ex: "In freeze tag, when Ava gets tagged, she freezes — even though she wants to keep running." },
      { title: "Telling the Truth in Games",
        text: "Good players tell the truth, even when it is hard. If you get tagged or step on a line, say so. The truth keeps the game fair.",
        ex: "Sam's foot touches the line in four square. He says, 'That was out — your turn!'" },
      { title: "Winning the Kind Way",
        text: "It is fun to win, but kind winners do not brag. Say 'good game' to the other team. Bragging makes friends feel bad.",
        ex: "Ava's team wins kickball. She tells the other team, 'Good game! You played hard.'" },
      { title: "Losing the Brave Way",
        text: "Losing is okay — everyone loses sometimes. Take a deep breath and stay calm. Say 'good game' and try again next time.",
        ex: "Jon loses the race. He feels sad, but he breathes deep and gives the winner a high five." },
      { title: "Being a Good Teammate",
        text: "Good teammates share, take turns, and cheer for each other. If a friend makes a mistake, say something kind. Teams work best when everyone feels welcome.",
        ex: "Mia drops the ball. Her teammate says, 'Good try! You'll get it next time.'" }
    ],
    mistakes: [
      "Thinking winning is the only thing that matters — actually playing fair and having fun matter more.",
      "Thinking it's okay to cheat if nobody sees — actually cheating makes the game unfair even if it stays secret.",
      "Thinking losing means you are bad at the game — actually everyone loses sometimes, and you can learn and try again.",
      "Thinking bragging shows you are a great player — actually kind winners say 'good game' instead of bragging."
    ]
  }, makeGen([
    { p: "Your team loses the game. What is a good thing to do?",
      o: ["Say 'good game' to the other team", "Blame a teammate", "Throw the ball down", "Say the other team cheated"] },
    { p: "Your team wins the game. What should you do?",
      o: ["Be kind and don't brag", "Laugh at the other team", "Brag all day", "Say the other team played badly"] },
    { p: "Why do games have rules?",
      o: ["To keep the game fair and safe for everyone", "To make games boring", "So only fast kids can win", "To make games take longer"] },
    { p: "Sam touches the line in tag but says he didn't. Is that fair?",
      o: ["No — telling the truth keeps the game fair", "Yes, if no one saw it", "Yes, if he really wants to win", "Yes, lines don't matter"] },
    { p: "A teammate drops the ball. What should you say?",
      o: ["'Good try! You'll get it next time.'", "'You ruined the game!'", "'You can't play anymore.'", "Nothing — just walk away angry"] },
    { p: "Everyone wants a turn with the ball. What is fair?",
      o: ["Take turns and share", "Let the best player keep it", "Let the biggest kid keep it", "Hide the ball"] },
    { p: "Which is an example of fair play?",
      o: ["Following the rules even when you are losing", "Changing the rules so you win", "Pushing to get the ball", "Skipping your place in line"] },
    { p: "Ava wins the race. What is a kind way to act?",
      o: ["Say 'good race' to the other runners", "Point and laugh", "Do a mean dance", "Say the others are slow"] },
    { p: "A new kid wants to join your game. What should you do?",
      o: ["Invite them to play", "Say the game is full forever", "Pretend not to hear them", "Tell them to just watch"] },
    { p: "Which is UNFAIR in a game?",
      o: ["Cheating to win", "Trying your best", "Cheering for friends", "Following the rules"] },
    { p: "You disagree about a call in the game. What should you do?",
      o: ["Talk it out calmly or ask the teacher", "Yell until you win", "Quit and take the ball home", "Push the other player"] },
    { p: "What does being a 'good sport' mean?",
      o: ["Playing fair and being kind, win or lose", "Winning every game", "Being the fastest kid", "Never losing"] },
    { p: "Jon loses at hopscotch and stomps away yelling. What could he do instead?",
      o: ["Take a deep breath and say 'good game'", "Kick the hopscotch rocks", "Yell even louder", "Never play again"] },
    { p: "The other team makes a great play. What can you do?",
      o: ["Say 'nice play!'", "Boo them", "Roll your eyes", "Say it was just luck"] },
    { p: "Why should everyone follow the same rules?",
      o: ["So the game is fair for all players", "So the tallest kid wins", "So games end faster", "So no one has fun"] }
  ]));

  // ---------------------------------------------------------------
  // 3. Components of Fitness (3-5) — stage 2
  // ---------------------------------------------------------------
  reg("Components of Fitness", 2, {
    steps: [
      { title: "Cardiovascular Endurance",
        text: "Cardiovascular endurance is how well your heart and lungs can keep working during long activity. It lets you run, swim, or bike for a long time without stopping. Activities that keep you moving and breathing hard build it.",
        ex: "Jogging for 20 minutes or jumping rope for a whole song builds cardiovascular endurance." },
      { title: "Muscular Strength",
        text: "Muscular strength is how much force your muscles can produce at one time. It is about one big push, pull, or lift. Strong muscles help you carry, climb, and push heavy things.",
        ex: "Pushing a heavy cart one time or climbing a rope with big powerful pulls uses muscular strength." },
      { title: "Muscular Endurance",
        text: "Muscular endurance is using your muscles many times without getting tired. It is not about one big lift — it is about repeating a move again and again. Reps and holds build it.",
        ex: "Doing 25 sit-ups in a row or holding a plank for one minute takes muscular endurance." },
      { title: "Flexibility",
        text: "Flexibility is how far your muscles and joints can stretch and move. Good flexibility helps you move freely and can help prevent injuries. Gentle stretching improves it over time.",
        ex: "Reaching down to touch your toes with straight legs shows flexibility in your legs and back." },
      { title: "Matching Activities to Components",
        text: "Every activity trains some components more than others. Long, steady movement trains your heart; lifting trains strength; many reps train muscular endurance; stretching trains flexibility. Knowing the match helps you train what you need.",
        ex: "Ben gets out of breath fast in soccer, so he trains cardiovascular endurance by jogging three days a week." }
    ],
    mistakes: [
      "Thinking strength and muscular endurance are the same — actually strength is one big effort, endurance is repeating a move many times.",
      "Thinking stretching builds a strong heart — actually stretching builds flexibility; running, swimming, and biking build cardiovascular endurance.",
      "Thinking only sports count as fitness — actually biking to school, climbing, and even active chores train fitness components too.",
      "Thinking you only need one component — actually a fit body needs heart endurance, strength, muscular endurance, AND flexibility."
    ]
  }, makeGen([
    { p: "Which component of fitness is about your heart and lungs working for a long time?",
      o: ["Cardiovascular endurance", "Muscular strength", "Flexibility", "Balance"] },
    { p: "Which activity best builds cardiovascular endurance?",
      o: ["Jogging for 20 minutes", "Lifting a heavy box one time", "Touching your toes", "Standing still"] },
    { p: "Muscular strength means...",
      o: ["How much force your muscles can produce at one time", "How long your heart can keep working", "How far you can stretch", "How many laps you can swim"] },
    { p: "Which activity is the best example of muscular strength?",
      o: ["Pushing a heavy cart one time", "Jogging a mile", "Doing gentle toe touches", "Walking the dog"] },
    { p: "Muscular endurance means...",
      o: ["Using muscles many times without getting tired", "Lifting the heaviest weight once", "Stretching as far as possible", "Running one fast sprint"] },
    { p: "Which activity builds muscular endurance?",
      o: ["Doing 25 sit-ups in a row", "One maximum push against a wall", "A single 10-meter sprint", "Holding a pencil"] },
    { p: "Flexibility means...",
      o: ["How far your muscles and joints can stretch and move", "How strong your arms are", "How long you can run", "How fast your heart beats"] },
    { p: "Which activity best improves flexibility?",
      o: ["Gentle stretching after practice", "Sprinting", "Push-ups", "Kicking a ball as hard as you can"] },
    { p: "Jumping rope for 15 minutes mostly trains...",
      o: ["Cardiovascular endurance", "Flexibility", "Muscular strength", "Nothing — it is rest"] },
    { p: "Which activity does NOT mainly train cardiovascular endurance?",
      o: ["Toe-touch stretching", "Swimming laps", "Jogging around the track", "Riding a bike for 30 minutes"] },
    { p: "Holding a plank for one minute mostly trains...",
      o: ["Muscular endurance", "Flexibility", "Cardiovascular endurance", "Reaction time"] },
    { p: "Tia wants to touch her toes without bending her knees. Which component should she work on?",
      o: ["Flexibility", "Muscular strength", "Cardiovascular endurance", "Speed"] },
    { p: "Ben gets out of breath fast in soccer. Which component should he train?",
      o: ["Cardiovascular endurance", "Flexibility", "Muscular strength", "Balance"] },
    { p: "Doing a gymnastics split uses mostly...",
      o: ["Flexibility", "Cardiovascular endurance", "Muscular endurance", "Reaction time"] },
    { p: "Which pair is matched correctly?",
      o: ["Doing many push-ups — muscular endurance", "Stretching — cardiovascular endurance", "Jogging — flexibility", "Toe touches — muscular strength"] },
    { p: "Carrying one very heavy backpack up the stairs uses mostly...",
      o: ["Muscular strength", "Flexibility", "Rhythm", "Hand-eye coordination"] }
  ]));

  // ---------------------------------------------------------------
  // 4. Rules of Major Sports (3-5) — stage 2
  // ---------------------------------------------------------------
  reg("Rules of Major Sports", 2, {
    steps: [
      { title: "Basketball Basics",
        text: "In basketball you must dribble (bounce) the ball to move with it. Moving without dribbling is traveling, and dribbling again after stopping is a double dribble. Shots inside the arc are worth 2 points, behind the arc 3 points, and free throws 1 point.",
        ex: "Jaden catches a pass, takes three steps without bouncing the ball, and the referee calls traveling." },
      { title: "Soccer Basics",
        text: "In soccer, only the goalkeeper may use hands, and only inside their own penalty area. If a field player touches the ball with a hand or arm on purpose, it is a handball. A goal counts when the whole ball crosses the goal line into the net.",
        ex: "Nia is a defender. The ball bounces up, she catches it with her hands, and the other team gets a free kick for the handball." },
      { title: "Soccer Restarts",
        text: "When the ball goes out over the sideline, the other team restarts with a throw-in. A throw-in uses two hands over the head with both feet on the ground. Balls out over the end line restart with a goal kick or corner kick.",
        ex: "The blue team kicks the ball over the sideline, so the red team throws it back in with two hands over the head." },
      { title: "Volleyball Basics",
        text: "In volleyball, a team may touch the ball up to 3 times before it must go over the net. A player may not hit the ball twice in a row (a block does not count as a touch). You must hit the ball cleanly — catching or holding it is not allowed.",
        ex: "Ana bumps the serve, Luis sets it, and Kim spikes it over — that is 3 legal touches." },
      { title: "Baseball & Kickball Basics",
        text: "In baseball and kickball, you run the bases in order: first, second, third, then home. Three outs end a team's turn. A fly ball caught before it lands is an out, and a ball that goes outside the foul lines is a foul ball.",
        ex: "Marco kicks a high fly ball. A fielder catches it before it touches the ground, so Marco is out." }
    ],
    mistakes: [
      "Thinking any soccer player can grab the ball with their hands — actually only the goalkeeper can, and only in their own penalty area.",
      "Thinking you can run with the basketball without bouncing it — actually that is traveling, and the other team gets the ball.",
      "Thinking a volleyball team can hit the ball as many times as it wants — actually a team gets at most 3 touches before it must go over the net.",
      "Thinking a caught fly ball still lets the kicker run the bases — actually a caught fly ball means the kicker is out."
    ]
  }, makeGen([
    { p: "In basketball, moving with the ball without dribbling is called...",
      o: ["Traveling", "Double dribble", "A free throw", "A rebound"] },
    { p: "In basketball, what is a double dribble?",
      o: ["Stopping your dribble and then dribbling again", "Two teammates dribbling at once", "Dribbling with your feet", "Passing the ball twice"] },
    { p: "How many points is a basketball shot made from behind the three-point line?",
      o: ["3 points", "2 points", "1 point", "4 points"] },
    { p: "In soccer, which player may use their hands during play?",
      o: ["Only the goalkeeper, inside their penalty area", "All players", "Only the team captain", "Only the defenders"] },
    { p: "In soccer, the ball goes out over the sideline. How does play restart?",
      o: ["A throw-in", "A jump ball", "A penalty kick", "A serve"] },
    { p: "In soccer, a field player touches the ball with their hands on purpose. What is this called?",
      o: ["A handball", "A touchdown", "A strike", "A rebound"] },

// ============ State ============
const PE = window.PE_DATA;
const BANDS = ['K-2','3-5','6-8','9-10','11-12'];
const State = {
  entries: [],            // pe_training_log rows, newest first
  gradeLevel: null,
  band: localStorage.getItem('pe_band') || '6-8',
  skillStates: {},        // game_skill -> {state, mastery_score} from skill_progress
  embedded: window.parent !== window,
  loaded: false,
  view: 'dashboard',
  pendingSaves: {},       // clientId -> optimistic entry
  synced: {}              // node_id -> state we already pushed this session
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }

// ============ Host bridge ============
function post(msg){ if (State.embedded) window.parent.postMessage(msg, '*'); }
window.addEventListener('message', e => {
  const d = e.data; if (!d || !d.type) return;
  if (d.type === 'PE_LOG_DATA') {
    State.entries = d.entries || [];
    if (d.gradeLevel) { State.gradeLevel = d.gradeLevel; const b = bandFromGrade(d.gradeLevel); if (b) { State.band = b; localStorage.setItem('pe_band', b); } }
    State.loaded = true; $('band-sel').value = State.band; render(); syncStates();
  } else if (d.type === 'PE_LOG_SAVED') {
    if (d.ok && d.entry) {
      // replace the optimistic copy with the server row
      if (d.clientId && State.pendingSaves[d.clientId]) {
        const i = State.entries.indexOf(State.pendingSaves[d.clientId]);
        if (i >= 0) State.entries[i] = d.entry; delete State.pendingSaves[d.clientId];
      } else State.entries.unshift(d.entry);
      render(); syncStates();
    } else if (!d.ok) { toast('Save failed — try again'); }
  } else if (d.type === 'SKILL_DATA_FOR_DOGO' && d.subject === 'Physical') {
    State.skillStates = d.skills || {}; render(); syncStates();
  }
});
function bandFromGrade(g){
  const s = String(g).trim().toLowerCase();
  if (/^(k|tk|pre)/.test(s)) return 'K-2';
  const m = s.match(/\d+/); if (!m) return null; const n = +m[0];
  return n <= 2 ? 'K-2' : n <= 5 ? '3-5' : n <= 8 ? '6-8' : n <= 10 ? '9-10' : '11-12';
}

// Standalone/dev fallback: localStorage-backed log
function bootstrap(){
  if (State.embedded) {
    post({type:'PE_REQUEST_LOG'});
    post({type:'DOGO_REQUEST_SKILL_DATA', subject:'Physical'});
    // if the host never answers (e.g. opened outside the portal), fall back after 4s
    setTimeout(()=>{ if (!State.loaded) loadLocal(); }, 4000);
  } else loadLocal();
}
function loadLocal(){
  try { State.entries = JSON.parse(localStorage.getItem('pe_log_local') || '[]'); } catch(e){ State.entries = []; }
  try { State.skillStates = JSON.parse(localStorage.getItem('pe_states_local') || '{}'); } catch(e){ State.skillStates = {}; }
  State.loaded = true; render();
}
function saveEntry(node, entry_type, value, unit, detail, notes){
  const clientId = 'c' + Date.now() + Math.random().toString(36).slice(2,7);
  const entry = { node_id: node.id, entry_type, value: value==null?null:value, unit: unit||null,
                  detail: detail||{}, notes: notes||null, verified: false, recorded_at: new Date().toISOString() };
  State.entries.unshift(entry);
  if (State.embedded && State.loadedFromHost !== false) {
    State.pendingSaves[clientId] = entry;
    post({type:'PE_LOG_ENTRY', clientId, node_id: node.id, entry_type, value, unit, detail, notes});
  } else {
    localStorage.setItem('pe_log_local', JSON.stringify(State.entries));
  }
  render(); syncStates();
}

// ============ Derivations ============
const nodesByType = t => Object.values(PE.nodes).filter(n => n.assess.type === t);
function entriesFor(id, verifiedOnly){
  return State.entries.filter(e => e.node_id === id && (!verifiedOnly || e.verified))
    .slice().sort((a,b)=> new Date(a.recorded_at) - new Date(b.recorded_at));
}
function bench(node){ return (node.assess.benchmarks || {})[State.band] || null; }
function better(a, b, dir){ return dir === 'lower' ? a < b : a > b; }
function metricStatus(node){
  const dir = node.assess.direction;
  const all = entriesFor(node.id).filter(e => e.entry_type === 'measurement' && e.value != null);
  const ver = all.filter(e => e.verified);
  const bm = bench(node);
  const bestOf = list => list.length ? list.reduce((a,e)=> better(e.value, a, dir) ? e.value : a, list[0].value) : null;
  const best = bestOf(all), bestVer = bestOf(ver);
  let level = 'none';
  if (bm && bestVer != null) level = better(bestVer, bm[1], dir) || bestVer === bm[1] ? 'exceeds'
    : (better(bestVer, bm[0], dir) || bestVer === bm[0] ? 'meets' : 'below');
  // growth: latest verified improved >=5% on first verified
  let growth = false;
  if (ver.length >= 2) {
    const f = ver[0].value, l = ver[ver.length-1].value;
    growth = dir === 'lower' ? l <= f * 0.95 : l >= f * 1.05;
  }
  const isPR = all.length >= 2 && all[all.length-1].value === best;
  return { all, ver, best, bestVer, bm, level, growth, isPR,
           mastered: level === 'meets' || level === 'exceeds' };
}
function checklistStatus(node){
  const ver = entriesFor(node.id, true).filter(e => e.entry_type === 'checklist');
  const latest = ver[ver.length-1] || null;
  const items = latest && latest.detail && Array.isArray(latest.detail.items) ? latest.detail.items : null;
  const mastered = !!items && items.length >= node.assess.items.length && node.assess.items.every((_,i)=> items[i] === 2);
  const score = items ? Math.round(items.reduce((a,v)=>a+(v||0),0) / (node.assess.items.length*2) * 100) : 0;
  return { latest, items, mastered, score };
}
function rubricStatus(node){
  const ver = entriesFor(node.id, true).filter(e => e.entry_type === 'rubric');
  const latest = ver[ver.length-1] || null;
  const scores = latest && latest.detail && Array.isArray(latest.detail.scores) ? latest.detail.scores : null;
  const avg = scores ? scores.reduce((a,v)=>a+v,0)/scores.length : 0;
  const mastered = !!scores && avg >= 3 && !scores.some(s => s <= 1);
  return { latest, scores, avg, mastered, score: Math.round(avg/4*100), history: ver };
}
function streakStatus(node){
  const logs = entriesFor(node.id).filter(e => e.entry_type === 'activity');
  let count;
  if (node.id === 'P-340') count = new Set(logs.map(e => e.recorded_at.slice(0,10))).size; // unique days
  else count = logs.length;
  const target = node.assess.target;
  return { count, target, logs, mastered: count >= target, score: Math.min(100, Math.round(count/target*100)),
           todayDone: logs.some(e => e.recorded_at.slice(0,10) === new Date().toISOString().slice(0,10)) };
}
function quizStatus(node){
  const st = State.skillStates[node.game_skill];
  return { mastered: !!st && st.state === 'mastered', score: st ? (st.mastery_score || 0) : 0, started: !!st };
}
function planReviewStatus(){ // P14 teacher-approved plan
  const ver = entriesFor('P14', true).filter(e => e.entry_type === 'plan_review');
  const latest = ver[ver.length-1] || null;
  const scores = latest && latest.detail && Array.isArray(latest.detail.scores) ? latest.detail.scores : null;
  const approved = !!scores && scores.reduce((a,v)=>a+v,0)/scores.length >= 3 && !scores.some(s=>s<=1);
  return { latest, scores, approved };
}
function nodeStatus(node){
  const t = node.assess.type;
  if (t === 'metric') return metricStatus(node);
  if (t === 'checklist') return checklistStatus(node);
  if (t === 'rubric') return rubricStatus(node);
  if (t === 'streak') return streakStatus(node);
  if (t === 'quiz') return quizStatus(node);
  if (t === 'capstone') {
    if (node.id === 'P13') {
      const n = node.assess.of.filter(id => { const nd = PE.nodes[id]; return nd && nd.assess.type==='metric' && metricStatus(nd).level==='exceeds'; }).length;
      return { mastered: n >= node.assess.count, score: Math.min(100, Math.round(n/node.assess.count*100)), n };
    }
    if (node.id === 'P14') {
      const q = quizStatus(node), p = planReviewStatus();
      return { mastered: q.mastered && p.approved, score: Math.round((q.score + (p.approved?100:0))/2), quiz:q, plan:p };
    }
    if (node.id === 'P15') {
      const p13 = nodeStatus(PE.nodes['P13']).mastered, p14 = nodeStatus(PE.nodes['P14']).mastered;
      const sport = node.assess.of.some(id => { const nd = PE.nodes[id]; return nd && nd.assess.type==='rubric' && rubricStatus(nd).mastered; });
      return { mastered: p13 && p14 && sport, score: Math.round(((p13?1:0)+(p14?1:0)+(sport?1:0))/3*100) };
    }
  }
  return { mastered:false, score:0 };
}

// Push derived states up to skill_progress (never downgrades; once per state per session)
function syncStates(){
  for (const node of Object.values(PE.nodes)) {
    const st = nodeStatus(node);
    const has = node.assess.type === 'quiz' ? false : entriesFor(node.id).length > 0; // quiz nodes sync at quiz completion
    let target = null;
    if (st.mastered) target = 'mastered';
    else if (has && (st.score || 0) > 0) target = 'in_progress';
    if (!target) continue;
    const cur = State.skillStates[node.game_skill];
    if (cur && cur.state === 'mastered') continue;                       // never downgrade
    if (cur && cur.state === target && (cur.mastery_score||0) >= (st.score||0)) continue;
    const key = node.id + ':' + target + ':' + (st.score||0);
    if (State.synced[key]) continue;
    State.synced[key] = true;
    State.skillStates[node.game_skill] = { state: target, mastery_score: st.score || 0 };
    if (State.embedded) post({ type:'DOGO_SKILL_PROGRESS', subject:'Physical', skill: node.game_skill,
      domain: node.cluster, skillState: target, masteryScore: st.score || 0, correct: 0, total: 0, timestamp: new Date().toISOString() });
    else localStorage.setItem('pe_states_local', JSON.stringify(State.skillStates));
  }
}

// ============ Formatting ============
function fmtVal(node, v){
  if (v == null) return '—';
  if (node.assess.input === 'time') { const m = Math.floor(v/60), s = Math.round(v%60); return m ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`; }
  if (node.assess.input === 'decimal') return v.toFixed(1) + ' ' + node.assess.unit;
  return v + ' ' + node.assess.unit;
}
function parseVal(node, raw){
  raw = String(raw).trim(); if (!raw) return null;
  if (node.assess.input === 'time' && raw.includes(':')) {
    const p = raw.split(':').map(Number); if (p.some(isNaN)) return null;
    return p.length === 2 ? p[0]*60 + p[1] : null;
  }
  const v = parseFloat(raw); return isNaN(v) || v < 0 || v > 100000 ? null : v;
}
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'});

// ============ SVG chart (single series; verified = filled, practice = hollow) ============
function chart(node, st){
  const es = st.all.slice(-14);
  if (es.length < 2) return '<div class="hint">Log at least two attempts to see your trend.</div>';
  const W=320,H=110,P={l:8,r:8,t:10,b:16};
  const vals = es.map(e=>e.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (st.bm){ lo = Math.min(lo, st.bm[0], st.bm[1]); hi = Math.max(hi, st.bm[0], st.bm[1]); }
  if (hi === lo) hi = lo + 1;
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const X = i => P.l + i*(W-P.l-P.r)/(es.length-1);
  const Y = v => P.t + (1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  let s = `<svg class="svgchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(node.title)} history">`;
  if (st.bm){
    for (const [i,label] of [[0,'meets'],[1,'exceeds']]){
      const y = Y(st.bm[i]);
      s += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="${i?'var(--info)':'var(--good)'}" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>`;
      s += `<text x="${W-P.r}" y="${y-3}" fill="var(--muted)" font-size="8" text-anchor="end">${label} ${fmtVal(node, st.bm[i])}</text>`;
    }
  }
  s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${es.map((e,i)=>`${X(i)},${Y(e.value)}`).join(' ')}"/>`;
  es.forEach((e,i)=>{
    const cx=X(i), cy=Y(e.value);
    s += e.verified
      ? `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--accent)"><title>${fmtDate(e.recorded_at)} · ${fmtVal(node,e.value)} · verified</title></circle>`
      : `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"><title>${fmtDate(e.recorded_at)} · ${fmtVal(node,e.value)} · practice</title></circle>`;
  });
  s += `<text x="${P.l}" y="${H-4}" fill="var(--muted)" font-size="8">${fmtDate(es[0].recorded_at)}</text>`;
  s += `<text x="${W-P.r}" y="${H-4}" fill="var(--muted)" font-size="8" text-anchor="end">${fmtDate(es[es.length-1].recorded_at)}</text>`;
  s += '</svg><div class="legendline"><b>● verified test</b><b>○ practice</b></div>';
  return s;
}

// ============ Lessons & quizzes ============
let Quiz = null;
function openModal(html){ $('modal').innerHTML = html; $('modal-bg').classList.add('open'); }
function closeModal(){ $('modal-bg').classList.remove('open'); Quiz = null; }
$('modal-bg').addEventListener('click', e => { if (e.target === $('modal-bg')) closeModal(); });

function openLesson(id){
  const node = PE.nodes[id]; const les = LESSONS[node.game_skill];
  if (!les) return;
  let html = `<h2>📘 ${esc(node.title)}</h2>`;
  for (const s of les.steps) html += `<div class="step"><div class="st">${esc(s.title)}</div><div>${esc(s.text)}</div><div class="ex">Example: ${esc(s.ex)}</div></div>`;
  html += '<h2 style="margin-top:14px">⚠️ Watch out for</h2>';
  for (const m of les.mistakes) html += `<div class="mistake">• ${esc(m)}</div>`;
  html += `<div class="logform" style="margin-top:14px"><button class="act" onclick="startQuiz('${id}')">Take the quiz</button><button class="ghost" onclick="closeModal()">Close</button></div>`;
  openModal(html);
}
function startQuiz(id){
  const node = PE.nodes[id]; const gen = GENERATORS[node.game_skill];
  if (!gen) return;
  const qs = []; const seen = new Set(); let guard = 0;
  while (qs.length < 10 && guard++ < 200){
    const q = gen(node.stage_id, node.game_skill);
    if (q && !seen.has(q.prompt)) { seen.add(q.prompt); qs.push(q); }
  }
  Quiz = { node, qs, i: 0, right: 0, wrongs: [] };
  renderQuiz();
}
function renderQuiz(){
  const q = Quiz.qs[Quiz.i];
  let html = `<h2>${esc(Quiz.node.title)} — question ${Quiz.i+1} of ${Quiz.qs.length}</h2>
    <div class="meta" style="color:var(--muted);font-size:.8rem;margin-bottom:8px">Score ${Quiz.right}/${Quiz.i}</div>
    <div style="margin:10px 0;font-size:.95rem">${esc(q.prompt)}</div>`;
  q.options.forEach((o,i)=>{ html += `<button class="qopt" id="qopt-${i}" onclick="answerQuiz(${i})">${esc(o)}</button>`; });
  openModal(html);
}
function answerQuiz(i){
  const q = Quiz.qs[Quiz.i];
  const right = i === q.correct;
  document.querySelectorAll('.qopt').forEach((b,k)=>{
    b.disabled = true;
    if (k === q.correct) b.classList.add('right');
    else if (k === i && !right) b.classList.add('wrong');
  });
  if (right) Quiz.right++; else Quiz.wrongs.push(q);
  setTimeout(()=>{ Quiz.i++; Quiz.i < Quiz.qs.length ? renderQuiz() : finishQuiz(); }, right ? 650 : 1600);
}
function finishQuiz(){
  const pct = Math.round(Quiz.right / Quiz.qs.length * 100);
  const passed = pct >= 80;
  const node = Quiz.node;
  const prev = State.skillStates[node.game_skill];
  const newState = passed ? 'mastered' : (prev && prev.state === 'mastered' ? 'mastered' : 'in_progress');
  const newScore = Math.max(pct, prev ? (prev.mastery_score||0) : 0);
  State.skillStates[node.game_skill] = { state: newState, mastery_score: newScore };
  if (State.embedded) post({ type:'DOGO_SKILL_PROGRESS', subject:'Physical', skill: node.game_skill, domain: node.cluster,
    skillState: newState, masteryScore: newScore, correct: Quiz.right, total: Quiz.qs.length, timestamp: new Date().toISOString() });
  else localStorage.setItem('pe_states_local', JSON.stringify(State.skillStates));
  let html = `<h2>${passed ? '🎉 Passed!' : 'Keep training'}</h2>
    <div style="margin:10px 0">You scored <b>${Quiz.right}/${Quiz.qs.length}</b> (${pct}%). ${passed ? 'Skill mastered!' : 'You need 80% — review the lesson and try again.'}</div>`;
  if (Quiz.wrongs.length){
    html += '<h2 style="font-size:.95rem;margin-top:10px">Review these</h2>';
    for (const q of Quiz.wrongs.slice(0,5)) html += `<div class="step"><div>${esc(q.prompt)}</div><div class="ex">Answer: ${esc(q.options[q.correct])}</div></div>`;
  }
  html += `<div class="logform" style="margin-top:12px">${passed?'':'<button class="act" onclick="openLesson(\''+node.id+'\')">Review lesson</button>'}<button class="ghost" onclick="closeModal();render()">Done</button></div>`;
  openModal(html);
}

// ============ Boot ============
(function init(){
  const sel = $('band-sel');
  sel.innerHTML = BANDS.map(b=>`<option ${b===State.band?'selected':''}>${b}</option>`).join('');
  sel.addEventListener('change', ()=>{ State.band = sel.value; localStorage.setItem('pe_band', sel.value); render(); });
  render();
  bootstrap();
})();
</script>
</body>
