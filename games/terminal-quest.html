<style>
:root{
  --bg:#090c12; --term:#0d1119; --border:#1f2a3d; --text:#c9d6e8; --dim:#66788f;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Cascadia Code','Consolas','Courier New',monospace;display:flex;flex-direction:column}
#statusbar{display:flex;gap:14px;align-items:center;padding:7px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:.78rem;flex-wrap:wrap}

#statusbar .item{color:var(--dim)}
#statusbar .item b{color:var(--text);font-weight:600}

#term{flex:1;overflow-y:auto;padding:12px 14px;font-size:.86rem;line-height:1.42;white-space:pre-wrap;word-break:break-word}

.t-sys{color:var(--dim)} .t-ok{color:var(--green)} .t-err{color:var(--red)} .t-warn{color:var(--yellow)}
.t-info{color:var(--cyan)} .t-npc{color:var(--mag)} .t-echo{color:#8fa3bd}
.t-title{color:var(--yellow);font-weight:700}
a.t-link{color:var(--cyan)}
#editor-bg{position:fixed;inset:0;background:rgba(4,7,12,.9);display:none;z-index:40;padding:14px}

#editor-main{flex:1;display:flex;gap:10px;min-height:0}

#editor-out{max-height:26vh;overflow-y:auto;background:var(--term);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.8rem;white-space:pre-wrap}
#editor-btns{display:flex;gap:8px}
button.ebtn{background:var(--card);border:1px solid var(--border);color:var(--text);font:inherit;font-size:.8rem;padding:7px 16px;border-radius:7px;cursor:pointer}
button.ebtn.primary{background:var(--cyan);color:#04121a;font-weight:700;border-color:var(--cyan)}
@media (max-width:720px){ #editor-main{flex-direction:column} }
</style>

<script src="../shared/tech-data.js"></script>
<script>
'use strict';
/* ============================================================
   GRIDFALL — Terminal Quest engine
   The Grid crashed. Zones are dark. You are a Junior Systems
   Operative: bring them back online by proving real skills —
   real commands, real code, graded by real execution.
   ============================================================ */

// ---------- quest content registry (content blocks spliced below) ----------
const QUESTS = {};   // nodeId -> quest spec
// ---------- codex lesson registry (lesson blocks spliced below) ----------
// LESSONS[nodeId] = { topic:'Loops', pages:[{title, body:[lines], example:[code lines]}] }
const LESSONS = {};
// ---------- drill registry (infinite practice generators, spliced below) ----------
// DRILLS[topic] = { name, nodes:[nodeIds it exercises], gen(){ return {prompt, answer:{...conceptMatch spec}, reveal} } }
const DRILLS = {};
// ---------- zone boss registry (timed compound challenges, spliced below) ----------
// BOSSES[zone] = { title, intro:[], timeLimitMs, steps:[...], outro:[], badge, xp, solution:[] }
const BOSSES = {};

const TQ = (() => {

const TD = window.TECH_DATA || { nodes:{}, skillToId:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ============ terminal ============
const term = $('term'), cmdIn = $('cmd');
function print(text, cls){
  const d = document.createElement('div');
  if (cls) d.className = 't-' + cls;
  d.innerHTML = esc(text) === '' ? ' ' : esc(text);
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}
function printLines(lines, cls){ (lines||[]).forEach(l => print(l, cls)); }
function printBlock(lines){ print(''); printLines(lines, null); print(''); }

// ============ virtual filesystem ============
function dir(children){ return { type:'dir', children: children || {} }; }
function file(contents){ return { type:'file', contents: String(contents == null ? '' : contents) }; }
const FS = { root: dir({ home: dir({ operative: dir({}) }), grid: dir({}), tmp: dir({}) }) };
let CWD = '/home/operative';

function normPath(p){
  if (!p) return CWD;
  if (p === '~') p = '/home/operative';
  else if (p.startsWith('~/')) p = '/home/operative/' + p.slice(2);
  if (!p.startsWith('/')) p = CWD + '/' + p;
  const parts = [];
  for (const seg of p.split('/')){
    if (!seg || seg === '.') continue;
    if (seg === '..') parts.pop(); else parts.push(seg);
  }
  return '/' + parts.join('/');
}
function nodeAt(p){
  p = normPath(p);
  if (p === '/') return FS.root;
  let cur = FS.root;
  for (const seg of p.slice(1).split('/')){
    if (!cur || cur.type !== 'dir' || !cur.children[seg]) return null;
    cur = cur.children[seg];
  }
  return cur;
}
function parentOf(p){
  p = normPath(p);
  const i = p.lastIndexOf('/');
  return { parent: nodeAt(p.slice(0, i) || '/'), name: p.slice(i + 1) };
}
function mkdirp(p){
  p = normPath(p);
  let cur = FS.root;
  for (const seg of p.slice(1).split('/')){
    if (!seg) continue;
    if (!cur.children[seg]) cur.children[seg] = dir();
    cur = cur.children[seg];
    if (cur.type !== 'dir') return null;
  }
  return cur;
}
function writeFileAt(p, contents){
  const { parent, name } = parentOf(p);
  if (!parent || parent.type !== 'dir' || !name) return false;
  parent.children[name] = file(contents);
  return true;
}

// ============ shell ============
let lastOutput = '';          // combined stdout of the last executed pipeline
let lastCmds = [];            // command names used in the last line
let lastPiped = false;
const history = [];
let histIx = -1;

function tokenize(s){
  const out = []; let cur = '', q = null;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ if (c === q) q = null; else cur += c; }
    else if (c === '"' || c === "'") q = c;
    else if (/\s/.test(c)){ if (cur){ out.push(cur); cur=''; } }
    else cur += c;
  }
  if (cur) out.push(cur);
  return out;
}
function splitPipes(s){
  const segs = []; let cur = '', q = null;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ cur += c; if (c === q) q = null; }
    else if (c === '"' || c === "'"){ q = c; cur += c; }
    else if (c === '|'){ segs.push(cur); cur = ''; }
    else cur += c;
  }
  segs.push(cur);
  return segs;
}

const BIN = {};  // name -> {fn(args, stdin) -> {out, err}, man}
function reg(name, man, fn){ BIN[name] = { fn, man }; }

reg('help', 'help — list commands', () => ({ out:
`GRID SHELL — commands
  files:  ls [-l]  cd  pwd  cat  mkdir  touch  rm  cp  mv  echo
  text:   grep  find  head  tail  wc  sort  uniq   (pipes | and > >> work)
  perms:  chmod +x|-w|... <file>   run <script>
  vcs:    git init|status|add|commit|log|branch|checkout
  net:    ping  nslookup  traceroute  webget
  game:   look  map  go <zone>  talk <name>  quest  quest start <n>  hint
          answer <text>  code  done  stats  badges  save  skills
  train:  drill [topic]   patrol   assess   boss   lab <js|py|web>   quit
  codex:  learn (study the current quest topic)  learn list  next  back
  other:  man <cmd>  history  clear  whoami  date
Type "quest" to see missions · "drill" to practice · "assess" to test out of what you know.` }));
reg('man', 'man <cmd> — manual', a => {
  const b = BIN[a[0]];
  return b ? { out: b.man } : { err: 'man: no entry for ' + (a[0]||'(nothing)') };
});
reg('pwd', 'pwd — print working directory', () => ({ out: CWD }));
reg('whoami', 'whoami — who are you?', () => ({ out: 'operative' }));
reg('date', 'date — current date/time', () => ({ out: new Date().toString() }));
reg('clear', 'clear — clear the screen', () => { term.innerHTML = ''; return { out: '' }; });
reg('history', 'history — recent commands', () => ({ out: history.slice(-20).join('\n') }));
reg('echo', 'echo <text> — print text', a => ({ out: a.join(' ') }));
const permStr = n => n.type === 'dir' ? 'drwx' : '-' + ((n.perm || {}).r !== false ? 'r' : '-') + ((n.perm || {}).w !== false ? 'w' : '-') + ((n.perm || {}).x ? 'x' : '-');
reg('ls', 'ls [-l] [path] — list directory contents (-l shows permissions)', a => {
  let long = false;
  if (a[0] === '-l'){ long = true; a = a.slice(1); }
  const n = nodeAt(a[0] || CWD);
  if (!n) return { err: 'ls: no such path: ' + a[0] };
  if (n.type === 'file') return { out: long ? permStr(n) + '  ' + normPath(a[0]) : normPath(a[0]) };
  const names = Object.keys(n.children).sort();
  return { out: names.map(k => long ? permStr(n.children[k]) + '  ' + k + (n.children[k].type === 'dir' ? '/' : '') : k + (n.children[k].type === 'dir' ? '/' : '')).join('\n') };
});
reg('chmod', 'chmod <+x|-x|+w|-w|+r|-r> <file> — change a file\'s permissions', a => {
  const m = (a[0] || '').match(/^([+-])([rwx])$/);
  if (!m || !a[1]) return { err: 'chmod <+x|-x|+w|-w|+r|-r> <file>' };
  const n = nodeAt(a[1]);
  if (!n || n.type !== 'file') return { err: 'chmod: no such file: ' + a[1] };
  n.perm = n.perm || { r: true, w: true, x: false };
  n.perm[m[2]] = m[1] === '+';
  return { out: 'permissions now ' + permStr(n) + ' on ' + a[1] };
});
reg('run', 'run <file> — execute a script (needs the x permission; script lines like "echo hi" run)', a => {
  if (!a[0]) return { err: 'run <file>' };
  const n = nodeAt(a[0]);
  if (!n || n.type !== 'file') return { err: 'run: no such file: ' + a[0] };
  if (!(n.perm && n.perm.x)) return { err: 'run: permission denied — ' + a[0] + ' is not executable (try: chmod +x ' + a[0] + ')' };
  const outs = [];
  for (const line of n.contents.split('\n')){
    const t = line.trim();
    if (t.startsWith('echo ')) outs.push(t.slice(5).replace(/^["']|["']$/g, ''));
  }
  return { out: outs.length ? outs.join('\n') : '(script ran silently)' };
});
reg('cd', 'cd <path> — change directory', a => {
  const t = normPath(a[0] || '~');
  const n = nodeAt(t);
  if (!n) return { err: 'cd: no such directory: ' + (a[0]||'~') };
  if (n.type !== 'dir') return { err: 'cd: not a directory: ' + a[0] };
  CWD = t; updatePrompt();
  onEnterDir(t);
  return { out: '' };
});
reg('cat', 'cat <file> — print file contents', (a, stdin) => {
  if (!a.length) return { out: stdin || '' };
  const outs = [];
  for (const p of a){
    const n = nodeAt(p);
    if (!n) return { err: 'cat: no such file: ' + p };
    if (n.type === 'dir') return { err: 'cat: is a directory: ' + p };
    if (n.perm && n.perm.r === false) return { err: 'cat: permission denied: ' + p + ' (no read permission — try: chmod +r ' + p + ')' };
    outs.push(n.contents);
  }
  return { out: outs.join('\n') };
});
reg('mkdir', 'mkdir <dir> — create a directory', a => {
  if (!a[0]) return { err: 'mkdir: missing name' };
  for (const p of a){
    const { parent, name } = parentOf(p);
    if (!parent || parent.type !== 'dir') return { err: 'mkdir: bad path: ' + p };
    if (parent.children[name]) return { err: 'mkdir: already exists: ' + p };
    parent.children[name] = dir();
  }
  return { out: '' };
});
reg('touch', 'touch <file> — create an empty file', a => {
  if (!a[0]) return { err: 'touch: missing name' };
  for (const p of a){
    const { parent, name } = parentOf(p);
    if (!parent || parent.type !== 'dir') return { err: 'touch: bad path: ' + p };
    if (!parent.children[name]) parent.children[name] = file('');
  }
  return { out: '' };
});
reg('rm', 'rm [-r] <path> — remove a file (or directory with -r)', a => {
  const rec = a[0] === '-r'; const paths = rec ? a.slice(1) : a;
  if (!paths[0]) return { err: 'rm: missing path' };
  for (const p of paths){
    const { parent, name } = parentOf(p);
    const n = parent && parent.children[name];
    if (!n) return { err: 'rm: no such path: ' + p };
    if (n.type === 'dir' && !rec) return { err: 'rm: is a directory (use rm -r): ' + p };
    delete parent.children[name];
  }
  return { out: '' };
});
reg('cp', 'cp <src> <dest> — copy a file', a => {
  const [s, d] = a;
  if (!s || !d) return { err: 'cp: need source and destination' };
  const n = nodeAt(s);
  if (!n || n.type !== 'file') return { err: 'cp: no such file: ' + s };
  let target = d;
  const dn = nodeAt(d);
  if (dn && dn.type === 'dir') target = normPath(d) + '/' + s.split('/').pop();
  return writeFileAt(target, n.contents) ? { out: '' } : { err: 'cp: bad destination: ' + d };
});
reg('mv', 'mv <src> <dest> — move/rename', a => {
  const [s, d] = a;
  if (!s || !d) return { err: 'mv: need source and destination' };
  const { parent, name } = parentOf(s);
  const n = parent && parent.children[name];
  if (!n) return { err: 'mv: no such path: ' + s };
  let target = d;
  const dn = nodeAt(d);
  if (dn && dn.type === 'dir') target = normPath(d) + '/' + name;
  const t = parentOf(target);
  if (!t.parent || t.parent.type !== 'dir' || !t.name) return { err: 'mv: bad destination: ' + d };
  t.parent.children[t.name] = n;
  delete parent.children[name];
  return { out: '' };
});
reg('grep', 'grep [-i] <pattern> [file] — print matching lines (works with pipes)', (a, stdin) => {
  let ci = false;
  if (a[0] === '-i'){ ci = true; a = a.slice(1); }
  const pat = a[0];
  if (!pat) return { err: 'grep: missing pattern' };
  let text = stdin;
  if (a[1]){
    const n = nodeAt(a[1]);
    if (!n || n.type !== 'file') return { err: 'grep: no such file: ' + a[1] };
    text = n.contents;
  }
  if (text == null) return { err: 'grep: no input (give a file or pipe into me)' };
  let re;
  try { re = new RegExp(pat, ci ? 'i' : ''); } catch(e){ return { err: 'grep: bad pattern' }; }
  return { out: text.split('\n').filter(l => re.test(l)).join('\n') };
});
reg('find', 'find <name> [path] — find files whose name contains <name>', a => {
  const q = a[0];
  if (!q) return { err: 'find: missing name' };
  const start = normPath(a[1] || CWD);
  const hits = [];
  (function walk(p, n){
    if (n.type === 'dir') for (const k of Object.keys(n.children)){
      const cp = (p === '/' ? '' : p) + '/' + k;
      if (k.includes(q)) hits.push(cp + (n.children[k].type === 'dir' ? '/' : ''));
      walk(cp, n.children[k]);
    }
  })(start, nodeAt(start) || dir());
  return { out: hits.join('\n') };
});
reg('head', 'head [-n N] <file> — first N lines (default 10)', (a, stdin) => nTool(a, stdin, true));
reg('tail', 'tail [-n N] <file> — last N lines (default 10)', (a, stdin) => nTool(a, stdin, false));
function nTool(a, stdin, head){
  let n = 10;
  if (a[0] === '-n'){ n = parseInt(a[1], 10) || 10; a = a.slice(2); }
  let text = stdin;
  if (a[0]){
    const f = nodeAt(a[0]);
    if (!f || f.type !== 'file') return { err: 'no such file: ' + a[0] };
    text = f.contents;
  }
  if (text == null) return { err: 'no input' };
  const lines = text.split('\n');
  return { out: (head ? lines.slice(0, n) : lines.slice(-n)).join('\n') };
}
reg('wc', 'wc [-l|-w] <file> — count lines/words/chars', (a, stdin) => {
  let mode = null;
  if (a[0] === '-l' || a[0] === '-w'){ mode = a[0]; a = a.slice(1); }
  let text = stdin;
  if (a[0]){
    const f = nodeAt(a[0]);
    if (!f || f.type !== 'file') return { err: 'wc: no such file: ' + a[0] };
    text = f.contents;
  }
  if (text == null) return { err: 'wc: no input' };
  const l = text ? text.split('\n').length : 0;
  const w = text.trim() ? text.trim().split(/\s+/).length : 0;
  if (mode === '-l') return { out: String(l) };
  if (mode === '-w') return { out: String(w) };
  return { out: `${l} ${w} ${text.length}` };
});
reg('sort', 'sort [file] — sort lines', (a, stdin) => {
  let text = stdin;
  if (a[0]){ const f = nodeAt(a[0]); if (!f || f.type !== 'file') return { err: 'sort: no such file' }; text = f.contents; }
  if (text == null) return { err: 'sort: no input' };
  return { out: text.split('\n').sort().join('\n') };
});
reg('uniq', 'uniq [file] — drop adjacent duplicate lines (sort first!)', (a, stdin) => {
  let text = stdin;
  if (a[0]){ const f = nodeAt(a[0]); if (!f || f.type !== 'file') return { err: 'uniq: no such file' }; text = f.contents; }
  if (text == null) return { err: 'uniq: no input' };
  const out = []; let prev = null;
  for (const l of text.split('\n')){ if (l !== prev) out.push(l); prev = l; }
  return { out: out.join('\n') };
});

function execLine(line){
  // redirect?
  let redirect = null, append = false;
  const rm = line.match(/(.*?)(>>?)\s*(\S+)\s*$/);
  let body = line;
  if (rm && !/['"].*>.*['"]/.test(line)){ body = rm[1]; append = rm[2] === '>>'; redirect = rm[3]; }
  const segs = splitPipes(body).map(s => s.trim()).filter(Boolean);
  if (!segs.length) return;
  lastCmds = []; lastPiped = segs.length > 1;
  let stdin = null, out = '', errored = false;
  for (const seg of segs){
    const toks = tokenize(seg);
    const name = toks[0];
    lastCmds.push(name);
    const bin = BIN[name] || GAME[name];
    if (!bin){ print(`${name}: command not found (try "help")`, 'err'); errored = true; break; }
    const r = bin.fn(toks.slice(1), stdin) || { out: '' };
    if (r.err){ print(r.err, 'err'); errored = true; break; }
    stdin = r.out; out = r.out;
  }
  if (errored){ lastOutput = ''; return; }
  lastOutput = out || '';
  if (redirect){
    const p = normPath(redirect);
    const existing = nodeAt(p);
    const prevContents = (append && existing && existing.type === 'file') ? existing.contents + '\n' : '';
    if (!writeFileAt(p, prevContents + (out || ''))) print('cannot write: ' + redirect, 'err');
  } else if (out) print(out);
}

// ============ RPG layer ============
const RANKS = ['Boot Apprentice','Byte Runner','Script Cadet','Loop Wrangler','Stack Agent','Kernel Knight','Protocol Ranger','Cipher Warden','Systems Architect','Grid Master'];
const Player = { xp: 0, level: 1, badges: [], hints: 0 };
const QState = {};   // nodeId -> {done, step, hints, solutions:{}}
let activeQuest = null;   // nodeId
let saveDirty = false;

const ZONE_FLAVOR = {
  'boot-sector':   { name:'Boot Sector',   desc:'Where every operative wakes up. Flickering BIOS light. Learn to move.' },
  'the-archives':  { name:'The Archives',  desc:'Endless shelves of scattered files. The librarians went offline mid-sort.' },
  'logic-forge':   { name:'Logic Forge',   desc:'Molten algorithms cool into functions here. The anvils still glow.' },
  'web-harbor':    { name:'Web Harbor',    desc:'Half-rendered pages drift like ghost ships. Markup masts, style sails.' },
  'data-vaults':   { name:'Data Vaults',   desc:'Rows and columns behind vault doors. The query lanterns have dimmed.' },

// ============ mini-git (real version control on the VFS) ============
// Repo state lives beside the working dir: GITS[dirPath] = {commits:[{id,msg,snap,parent,branch}], branches:{name:commitId}, head:{branch}, staged:{path:contents}}
const GITS = {};
function gitRepoFor(){ // nearest repo at or above CWD
  let p = CWD;
  for (;;){ if (GITS[p]) return { repo: GITS[p], root: p }; if (p === '/') return null; p = p.slice(0, p.lastIndexOf('/')) || '/'; }
}
function gitSnapshot(root){
  const snap = {};
  (function walk(p, n){ if (n.type === 'file'){ snap[p] = n.contents; return; } for (const k of Object.keys(n.children)) walk(p + '/' + k, n.children[k]); })(root === '/' ? '' : root, nodeAt(root));
  return snap;
}
function gitRestore(root, snap){
  const dir2 = nodeAt(root); if (!dir2) return;
  dir2.children = {};
  for (const [p, c] of Object.entries(snap)){ mkdirp(p.slice(0, p.lastIndexOf('/')) || '/'); writeFileAt(p, c); }
}
let gitSeq = 0;
const gitHash = () => (++gitSeq).toString(36).padStart(2, '0') + Math.abs((JSON.stringify(Object.keys(GITS)).length * 2654435761) % 46656).toString(36).padStart(3, '0');
reg('git', 'git <init|status|add|commit|log|branch|checkout> — the Grid\'s version control (a faithful mini-git)', a => {
  const sub = a[0];
  if (sub === 'init'){
    if (GITS[CWD]) return { err: 'git: repository already exists here' };
    GITS[CWD] = { commits: [], branches: { main: null }, head: 'main', staged: {} };
    return { out: 'Initialized empty Grid repository in ' + CWD + ' (branch main)' };
  }
  const found = gitRepoFor();
  if (!found) return { err: 'git: not a repository (run "git init" first)' };
  const { repo, root } = found;
  const lastCommit = () => repo.commits.find(c => c.id === repo.branches[repo.head]) || null;
  if (sub === 'status'){
    const snap = gitSnapshot(root); const last = lastCommit();
    const base = last ? last.snap : {};
    const changed = [], added = [];
    for (const p of Object.keys(snap)) (p in base ? (snap[p] !== base[p] && changed.push(p)) : added.push(p));
    const deleted = Object.keys(base).filter(p => !(p in snap));
    const stagedN = Object.keys(repo.staged).length;
    return { out: `On branch ${repo.head}\n` +
      (stagedN ? `Staged for commit: ${stagedN} file(s)\n` : '') +
      (added.length ? 'Untracked/new: ' + added.join(', ') + '\n' : '') +
      (changed.length ? 'Modified: ' + changed.join(', ') + '\n' : '') +
      (deleted.length ? 'Deleted: ' + deleted.join(', ') + '\n' : '') +
      (!added.length && !changed.length && !deleted.length && !stagedN ? 'Working tree clean.' : '') };
  }
  if (sub === 'add'){
    if (!a[1]) return { err: 'git add <file|.>' };
    const snap = gitSnapshot(root);
    if (a[1] === '.'){ repo.staged = snap; return { out: 'Staged ' + Object.keys(snap).length + ' file(s).' }; }
    const p = normPath(a[1]);
    if (!(p in snap)) return { err: 'git add: no such file: ' + a[1] };
    repo.staged[p] = snap[p];
    return { out: 'Staged ' + a[1] };
  }
  if (sub === 'commit'){
    let msg = null;
    const mi = a.indexOf('-m');
    if (mi >= 0) msg = a.slice(mi + 1).join(' ');
    if (!msg) return { err: 'git commit -m "your message" — every commit needs a message' };
    if (!Object.keys(repo.staged).length) return { err: 'git: nothing staged (use "git add <file>" or "git add .")' };
    const last = lastCommit();
    const snap = Object.assign({}, last ? last.snap : {}, repo.staged);
    const id = gitHash();
    repo.commits.unshift({ id, msg, snap, parent: repo.branches[repo.head], branch: repo.head, n: repo.commits.length + 1 });
    repo.branches[repo.head] = id;
    repo.staged = {};
    return { out: `[${repo.head} ${id}] ${msg}` };
  }
  if (sub === 'log'){
    if (!repo.commits.length) return { out: '(no commits yet)' };
    const chain = [];
    for (let c = lastCommit(); c; c = repo.commits.find(x => x.id === c.parent)) chain.push(c);
    return { out: chain.map(c => `commit ${c.id}  (${c.branch})\n    ${c.msg}`).join('\n') };
  }
  if (sub === 'branch'){
    if (!a[1]) return { out: Object.keys(repo.branches).map(b => (b === repo.head ? '* ' : '  ') + b).join('\n') };
    if (repo.branches[a[1]] !== undefined) return { err: 'git: branch already exists: ' + a[1] };
    repo.branches[a[1]] = repo.branches[repo.head];
    return { out: 'Created branch ' + a[1] };
  }
  if (sub === 'checkout'){
    const t = a[1];
    if (!t) return { err: 'git checkout <branch|commit-id>' };
    if (repo.branches[t] !== undefined){
      repo.head = t;
      const c = lastCommit();
      if (c) gitRestore(root, c.snap);
      return { out: 'Switched to branch ' + t };
    }
    const c = repo.commits.find(x => x.id === t || x.id.startsWith(t));
    if (!c) return { err: 'git checkout: no branch or commit named ' + t };
    gitRestore(root, c.snap);
    return { out: 'Restored working tree to commit ' + c.id + ' — "' + c.msg + '"' };
  }
  return { err: 'git: unknown subcommand "' + (sub || '') + '" (init status add commit log branch checkout)' };
});

// ============ network simulator (data-driven; quests set NETWORK via step.setup.network) ============
let NETWORK = {
  hosts: {
    'gate.grid':   { ip: '10.0.0.1',  hops: ['10.0.0.1'], up: true },
    'archive.grid':{ ip: '10.0.2.14', hops: ['10.0.0.1', '10.0.2.1', '10.0.2.14'], up: true },
    'signal.grid': { ip: '10.0.7.7',  hops: ['10.0.0.1', '10.0.7.7'], up: true,
      pages: { '/': 'SIGNAL TOWER — status: humming\nsee /status for details', '/status': '{"tower":"online","packets_lost":0}' } }
  }
};
function netResolve(name){
  if (NETWORK.hosts[name]) return { name, h: NETWORK.hosts[name] };
  const byIp = Object.entries(NETWORK.hosts).find(([, h]) => h.ip === name);
  if (byIp) return { name: byIp[0], h: byIp[1] };
  return null;
}
reg('ping', 'ping <host> — is a machine reachable?', a => {
  if (!a[0]) return { err: 'ping <host or ip>' };
  const r = netResolve(a[0]);
  if (!r) return { out: `ping: unknown host ${a[0]}` };
  if (!r.h.up) return { out: `PING ${r.name} (${r.h.ip}): request timeout\nrequest timeout\n--- ${r.name}: 100% packet loss ---` };
  const ms = 4 + (r.h.hops.length * 7);
  return { out: `PING ${r.name} (${r.h.ip}): 3 packets\n64 bytes from ${r.h.ip}: time=${ms}ms\n64 bytes from ${r.h.ip}: time=${ms + 1}ms\n64 bytes from ${r.h.ip}: time=${ms}ms\n--- ${r.name}: 0% packet loss ---` };
});
reg('nslookup', 'nslookup <name> — ask DNS for the IP behind a name', a => {
  if (!a[0]) return { err: 'nslookup <hostname>' };
  const r = NETWORK.hosts[a[0]];
  return r ? { out: `Name:    ${a[0]}\nAddress: ${r.ip}` } : { out: `** server can't find ${a[0]}: NXDOMAIN` };
});
reg('traceroute', 'traceroute <host> — the path packets take', a => {
  if (!a[0]) return { err: 'traceroute <host or ip>' };
  const r = netResolve(a[0]);
  if (!r) return { out: `traceroute: unknown host ${a[0]}` };
  const lines = r.h.hops.map((hop, i) => ` ${i + 1}  ${hop}  ${4 + i * 7}ms`);
  if (!r.h.up) lines.push(` ${r.h.hops.length + 1}  * * *  (no reply — host or link down)`);
  return { out: `traceroute to ${r.name} (${r.h.ip}):\n` + lines.join('\n') };
});
reg('webget', 'webget <host> [path] — fetch a web page over the sim network (HTTP GET)', a => {
  if (!a[0]) return { err: 'webget <host> [path]' };
  const r = netResolve(a[0]);
  if (!r) return { out: 'webget: could not resolve ' + a[0] };
  if (!r.h.up) return { out: 'webget: connection timed out' };
  const path2 = a[1] || '/';
  if (!r.h.pages || !(path2 in r.h.pages)) return { out: `HTTP/1.1 404 Not Found\n(no page at ${path2})` };
  return { out: `HTTP/1.1 200 OK\n\n` + r.h.pages[path2] };
});

let Drill = null;   // { topic, item, n, right, total }
const drillStats = {};  // topic -> {n, right}  (persisted)
function drillAsk(){
  const d = DRILLS[Drill.topic];
  Drill.item = d.gen();
  print('');
  print(`⚡ drill ${Drill.n + 1}/${Drill.total} — ${d.name}`, 'title');
  print(Drill.item.prompt, 'info');
  print('  (reply with: answer <your answer> — or "quit" to stop)', 'sys');
}
function drillAnswer(given){
  const right = conceptMatch(Drill.item.answer, given);
  const st = drillStats[Drill.topic] = drillStats[Drill.topic] || { n: 0, right: 0 };
  st.n++; if (right) st.right++;
  Drill.n++; if (right) Drill.right++;
  if (right) print('✔ correct', 'ok');
  else print('✗ ' + (Drill.item.reveal ? 'answer: ' + Drill.item.reveal : 'not quite'), 'err');
  if (Drill.n >= Drill.total){
    const xp = Drill.right * 4;
    printBlock([`Drill complete: ${Drill.right}/${Drill.total}.`]);
    if (xp) grantXP(xp);
    Drill = null; markDirty();
  } else drillAsk();
}

let TypeState = null;
function handleTypeLine(line){
  const q = QUESTS[activeQuest], st = QState[activeQuest];
  const step = q.steps[st.step];
  const target = step.lines[TypeState.ix];
  let mism = Math.abs(line.length - target.length);
  for (let i = 0; i < Math.min(line.length, target.length); i++) if (line[i] !== target[i]) mism++;
  const acc = 1 - mism / Math.max(1, target.length);
  if (acc < (step.minAcc != null ? step.minAcc : 0.96)){
    TypeState.retries++;
    print('✗ ' + Math.round(acc * 100) + '% accurate — look close and type that line again:', 'err');
    print('    ' + target, 'warn');
    return;
  }
  print('✔ line ' + (TypeState.ix + 1) + '/' + step.lines.length, 'ok');
  TypeState.ix++;
  if (TypeState.ix < step.lines.length){ print('    ' + step.lines[TypeState.ix], 'warn'); return; }
  const chars = step.lines.reduce((a, l) => a + l.length, 0);
  const minutes = Math.max((Date.now() - TypeState.startedAt) / 60000, 1e-6);
  const wpm = Math.round((chars / 5) / minutes);
  const need = step.minWpm || 10;
  if (wpm < need){
    print(`⏱ ${wpm} WPM — the Grid asks for ${need}. Shake out your hands; the set restarts.`, 'warn');
    TypeState = { ix: 0, startedAt: Date.now(), retries: 0 };
    print('    ' + step.lines[0], 'warn');
    return;
  }
  print(`⌨ ${wpm} WPM at ${step.lines.length} line(s) — certified.`, 'ok');
  TypeState = null;
  stepPassed();
}

// ---------- step checking (shell steps auto-check after each command) ----------
function checkStep(verbose){
  if (!activeQuest) return;
  const q = QUESTS[activeQuest], st = QState[activeQuest];
  const step = q.steps[st.step];
  if (!step || step.type !== 'shell') { if (verbose) print('Current step is graded from the editor or "answer".', 'sys'); return; }
  const c = step.check || {};
  let pass = true; const misses = [];
  for (const f of (c.fs || [])){
    const n = nodeAt(f.path);
    if (f.exists === false){ if (n){ pass = false; misses.push(f.path + ' should not exist'); } continue; }
    if (!n){ pass = false; misses.push(f.path + ' missing'); continue; }
    if (f.isDir && n.type !== 'dir'){ pass = false; misses.push(f.path + ' should be a directory'); }
    if (f.isFile && n.type !== 'file'){ pass = false; misses.push(f.path + ' should be a file'); }
    if (f.contains != null && (n.type !== 'file' || !n.contents.includes(f.contains))){ pass = false; misses.push(f.path + ' should contain "' + f.contains + '"'); }
    if (f.equals != null && (n.type !== 'file' || n.contents.trim() !== String(f.equals).trim())){ pass = false; misses.push(f.path + ' contents not right yet'); }
    if (f.lines != null && (n.type !== 'file' || n.contents.split('\n').filter(Boolean).length !== f.lines)){ pass = false; misses.push(f.path + ' should have ' + f.lines + ' lines'); }
    if (f.xbit != null && (n.type !== 'file' || !!(n.perm && n.perm.x) !== f.xbit)){ pass = false; misses.push(f.path + (f.xbit ? ' should be executable (chmod +x)' : ' should NOT be executable')); }
  }
  const o = c.output || {};
  if (o.contains != null && !lastOutput.includes(o.contains)) { pass = false; misses.push('expected output containing "' + o.contains + '"'); }
  if (o.regex != null && !(new RegExp(o.regex, o.flags || '')).test(lastOutput)) { pass = false; misses.push('output doesn\'t match yet'); }
  if (o.equals != null && lastOutput.trim() !== String(o.equals).trim()) { pass = false; misses.push('output not exactly right yet'); }
  const cm = c.cmd || {};
  for (const u of (cm.used || [])) if (!lastCmds.includes(u)){ pass = false; misses.push('use the ' + u + ' command'); }
  if (cm.pipe && !lastPiped){ pass = false; misses.push('use a pipe ( | )'); }
  if (pass) stepPassed();
  else if (verbose){ print('Not yet:', 'warn'); misses.slice(0, 4).forEach(m => print('  · ' + m, 'warn')); }
}
function conceptMatch(spec, given){
  if (!spec) return false;
  const g = given.trim();
  if (spec.accept && spec.accept.some(a => a.toLowerCase() === g.toLowerCase())) return true;
  if (spec.regex && new RegExp(spec.regex, spec.flags || 'i').test(g)) return true;
  if (spec.numeric){
    const v = parseFloat(g.replace(/[^\d.eE+-]/g, ''));
    if (!isNaN(v) && Math.abs(v - spec.numeric.value) <= (spec.numeric.tol || 0)) return true;
  }
  return false;
}

const WORKER_SRC = `
self.onmessage = function(ev){
  const { code, mode, tests, scenario } = ev.data;

  const print = (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));

  function makeRobot(sc){
    sim = { t: 0, led: false, ledEvents: [], pos: null, dirIx: 0, printCount: 0,
            motors: { left: 0, right: 0 }, grid: sc.grid || null, sensors: sc.sensors || {}, stream: sc.stream || null, streamIx: 0, samples: [] };
    if (sc.start){ sim.pos = { x: sc.start[0], y: sc.start[1] }; sim.dirIx = sc.dir || 0; } // 0=N 1=E 2=S 3=W
    const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
    function cellAt(x, y){
      if (!sim.grid) return '.';
      if (y < 0 || y >= sim.grid.length || x < 0 || x >= sim.grid[0].length) return '#';
      return sim.grid[y][x];
    }
    return {
      led: s => { const v = !!s; if (v !== sim.led){ sim.led = v; sim.ledEvents.push({ t: sim.t, on: v }); } },
      motor: (side, power) => { if (side === 'left' || side === 'right') sim.motors[side] = Number(power) || 0; },
      stop: () => { sim.motors.left = 0; sim.motors.right = 0; },

          while (dist < 99){ x += d[0]; y += d[1]; if (cellAt(x, y) === '#') break; dist++; } return dist; }
        if (name in sim.sensors) return sim.sensors[name];

      },
      wait: ms => {
        const ticks = Math.max(1, Math.round((Number(ms) || 0) / 100));
        for (let i = 0; i < ticks; i++){

  }

    if (mode === 'robot'){
      const robot = makeRobot(scenario);
      const fn = new Function('robot', 'print', '"use strict";' + code);
      fn(robot, print);
      self.postMessage({ ok: true, logs, sim: { t: sim.t, led: sim.led, ledEvents: sim.ledEvents, pos: sim.pos ? [sim.pos.x, sim.pos.y] : null, samples: sim.samples } });

// ---- mini SQL ----
function runSQL(q, tables){
  // Educational SQL: SELECT items FROM t1 [JOIN t2 ON a.x = b.y] [WHERE ...]
  //                  [GROUP BY col] [ORDER BY col [DESC]] [LIMIT n]
  // items: * | col | t.col | COUNT(*)|SUM/AVG/MIN/MAX(col) [AS alias]
  try {
    q = q.trim().replace(/;$/, '');
    const m = q.match(/^select\s+(.+?)\s+from\s+(\w+)(?:\s+join\s+(\w+)\s+on\s+([\w.]+)\s*=\s*([\w.]+))?(?:\s+where\s+(.+?))?(?:\s+group\s+by\s+([\w.]+))?(?:\s+order\s+by\s+([\w.]+)(\s+desc)?)?(?:\s+limit\s+(\d+))?\s*$/i);

      const shared = A.cols.filter(c => B.cols.includes(c));
      rows = [];
      for (const ra of A.rows) for (const rb of B.rows){
        const o = {};
        A.cols.forEach((c, i) => { o[t1 + '.' + c] = ra[i]; if (!shared.includes(c)) o[c] = ra[i]; });
        B.cols.forEach((c, i) => { o[t2 + '.' + c] = rb[i]; if (!shared.includes(c)) o[c] = rb[i]; });
        rows.push(o);
      }
      const val = (o, ref) => { if (ref in o) return o[ref]; throw new Error('unknown column in ON: ' + ref + (ref.includes('.') ? '' : ' (qualify shared columns like ' + t1 + '.' + ref + ')')); };

    const colVal = (o, ref) => {
      if (ref in o) return o[ref];
      throw new Error('no column named ' + ref + (t2 && !ref.includes('.') ? ' — with a JOIN, shared columns need a table prefix (' + t1 + '.' + ref + ')' : ''));
    };
    if (whereRaw){
      const conds = whereRaw.split(/\s+and\s+/i).map(c => {
        const cm = c.match(/^([\w.]+)\s*(=|!=|>=|<=|>|<|like)\s*(.+)$/i);
        if (!cm) throw new Error('could not read the WHERE clause near "' + c.trim() + '"');

      });
      rows = rows.filter(r => conds.every(c => {
        const a = colVal(r, c.col);
        switch (c.op){
          case '=': return String(a) == String(c.val);
          case '!=': return String(a) != String(c.val);
          case '>': return a > c.val; case '<': return a < c.val;
          case '>=': return a >= c.val; case '<=': return a <= c.val;

        if (im){ items.push({ kind: 'agg', fn: im[1].toLowerCase(), ref: im[2], name: im[3] || (im[1].toLowerCase() + '_' + im[2].replace(/[.*]/g, '')) }); continue; }

      outRows = rows.map(r => items.map(it => colVal(r, it.ref)));
    }
    if (orderCol && names.includes(orderCol)){
      const oi = names.indexOf(orderCol);
      outRows.sort((x, y) => (x[oi] > y[oi] ? 1 : x[oi] < y[oi] ? -1 : 0) * (orderDesc ? -1 : 1));
    } else if (orderCol && (groupCol || hasAgg)) throw new Error('ORDER BY with GROUP BY must use a selected column name/alias');

  } catch (e){ return { err: e.message }; }
}

function gradePy(code, step, runOnly){
  const r = PyMini.run(code);
  if (!r.ok){ eout('✗ ' + r.error + (r.logs.length ? '\n--- output so far ---\n' + r.logs.join('\n') : '')); return; }
  const results = [];
  for (const t of (step.tests || [])){
    if (t.expr !== undefined){
      try { const v = r.evalIn(t.expr); const got = PyMini.pyStr(v); results.push({ pass: got === String(t.want), why: t.expr + ' gave ' + got, t }); }
      catch (e){ results.push({ pass: false, why: t.expr + ' → ' + e.message, t }); }
    } else if (t.outputContains !== undefined) results.push({ pass: r.logs.join('\n').includes(t.outputContains), why: 'output was: ' + r.logs.join(' | ').slice(0, 120), t });
    else if (t.outputLines !== undefined) results.push({ pass: JSON.stringify(r.logs) === JSON.stringify(t.outputLines), why: 'output was: ' + JSON.stringify(r.logs).slice(0, 160), t });
  }
  if (runOnly){ eout((r.logs.length ? '--- output ---\n' + r.logs.join('\n') + '\n' : 'ran (no output).\n') + results.map((x, i) => (x.pass ? '✔' : '✗') + ' check ' + (i + 1) + (x.pass ? '' : ' — ' + x.why)).join('\n')); return; }
  const fails = results.filter(x => !x.pass);
  if (!results.length){ eout('No checks defined — submitting.'); finishEditorStep(); return; }
  if (!fails.length){ eout('✔ All ' + results.length + ' checks pass!'); finishEditorStep(); }
  else eout(results.map((x, i) => (x.pass ? '✔' : '✗') + ' check ' + (i + 1) + (x.pass ? '' : ' — ' + (x.t.msg ? x.t.msg + ' · ' : '') + x.why)).join('\n'));
}

    quests: Object.fromEntries(Object.entries(QState).filter(([k, v]) => v && !k.startsWith('__boss_')).map(([k, v]) => [k, { done: v.done, step: v.step, hints: v.hints, solutions: v.solutions, certified: v.certified }])) };

}
function restore(s){
  if (!s || typeof s !== 'object') return;
  if (s.player){ Player.xp = s.player.xp || 0; Player.level = levelFor(Player.xp); Player.badges = s.player.badges || []; Player.hints = s.player.hints || 0; }
  if (s.zone) currentZone = s.zone;
  if (s.quests) for (const [k, v] of Object.entries(s.quests)) QState[k] = { done: !!v.done, step: v.step || 0, hints: v.hints || 0, solutions: v.solutions || {}, certified: !!v.certified };
  if (s.drills) for (const [k, v] of Object.entries(s.drills)) drillStats[k] = v;

}

  for (const [nodeId, p] of Object.entries(latest)){
    const node = TD.nodes[nodeId];
    const scores = p.detail && Array.isArray(p.detail.scores) ? p.detail.scores : null;
    if (!node || !scores || !scores.length) continue;
    const avg = scores.reduce((a, v) => a + v, 0) / scores.length;
    const mastered = avg >= 3 && !scores.some(s => s <= 1);
    if (!mastered || syncedProjects[nodeId]) continue;
    syncedProjects[nodeId] = true;
    postToHost({ type: 'DOGO_SKILL_PROGRESS', subject: node.legacy_subject || 'Programming',
      skill: node.game_skill || node.title, domain: node.cluster, skillState: 'mastered',
      masteryScore: Math.round(avg / 4 * 100), correct: 0, total: 0, timestamp: new Date().toISOString() });
  }
}

  if (d.type === 'TQ_SAVE_DATA'){
    restore(d.save);
    if (d.save && d.save.syncedProjects) syncedProjects = d.save.syncedProjects;

// ============ input handling ============
cmdIn.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    const line = cmdIn.value;
    cmdIn.value = '';
    if (!line.trim()) return;
    print($('prompt').textContent + ' ' + line, 'echo');
    history.push(line); histIx = history.length;
    // typing steps consume raw lines (a few commands stay reachable)
    const curStep = activeQuest && QState[activeQuest] && QUESTS[activeQuest].steps[QState[activeQuest].step];
    const first = line.trim().split(/\s+/)[0];
    if (curStep && curStep.type === 'type' && TypeState && !['hint','help','quest','learn','save','quit'].includes(first)){
      if (!bossCheckClock()) return;
      handleTypeLine(line);
      return;
    }
    if (Boss && !bossCheckClock()) return;
    try { execLine(line.trim()); } catch (err){ print('shell error: ' + err.message, 'err'); }
    checkStep(false);     // shell steps auto-check after every command
  } else if (e.key === 'ArrowUp'){ if (histIx > 0){ histIx--; cmdIn.value = history[histIx] || ''; } e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ if (histIx < history.length){ histIx++; cmdIn.value = history[histIx] || ''; } e.preventDefault(); }
  else if (e.key === 'Tab'){
    e.preventDefault();
    const parts = cmdIn.value.split(/\s+/);
    const last = parts[parts.length - 1];
    let pool;
    if (parts.length === 1) pool = Object.keys(BIN);
    else {
      const base = last.includes('/') ? last.slice(0, last.lastIndexOf('/') + 1) : '';
      const d2 = nodeAt(base || CWD);
      pool = d2 && d2.type === 'dir' ? Object.keys(d2.children).map(k => base + k) : [];
    }
    const hits = pool.filter(p => p.startsWith(last));
    if (hits.length === 1){ parts[parts.length - 1] = hits[0]; cmdIn.value = parts.join(' '); }
    else if (hits.length > 1) print(hits.join('  '), 'sys');
  } else if (e.key === 'l' && e.ctrlKey){ e.preventDefault(); term.innerHTML = ''; }
});

      '             quest       (your mission log)',

    ]);
  }
  updateStatus();
}
function boot(){
  updatePrompt(); updateStatus();
  mkdirp('/home/operative');
  writeFileAt('/home/operative/README.txt',
    'GRIDFALL — field manual\n\nThis terminal is real. ls, cd, cat, grep, pipes — they all work.\nQuests teach and test real skills; finishing one masters it on your skill tree.\nType "help" any time. Type "quest" to see missions.\n— Ops Command');
  if (embedded){
    postToHost({ type: 'TQ_LOAD' });

  } else {
    let s = null;

    restore(s); bootMessage(!!s);
    TQ._booted = true;
  }
}

    const hex = n.toString(16);
    return { prompt: 'Convert decimal ' + n + ' to hexadecimal (just the digits, 0x optional).',

DRILLS['gates'] = {
  name: 'Gate Runner',
  nodes: ['T-322', 'T-SD010'],
  gen(){
    const ri = n => Math.floor(Math.random() * n);
    const A = ri(2), B = ri(2), C = ri(2);
    const G = { AND: (a, b) => a & b, OR: (a, b) => a | b, XOR: (a, b) => a ^ b };
    const names = ['AND', 'OR', 'XOR'];
    const wrap = v => ({ answer: { accept: [String(v), v ? 'true' : 'false', v ? 'one' : 'zero', v ? 'on' : 'off'] }, reveal: String(v) });
    const r = Math.random();
    if (r < 0.30){
      const g = names[ri(3)];
      return Object.assign({ prompt: g + ' gate: A=' + A + ', B=' + B + '. What is the output (0 or 1)?' }, wrap(G[g](A, B)));
    }
    if (r < 0.45){
      return Object.assign({ prompt: 'NOT gate: input=' + A + '. What is the output (0 or 1)?' }, wrap(A ? 0 : 1));
    }
    if (r < 0.65){
      const g = names[ri(3)];
      return Object.assign({ prompt: 'Two-gate trace: X = A ' + g + ' B, then OUT = NOT X. With A=' + A + ', B=' + B + ', what is OUT (0 or 1)?' }, wrap(G[g](A, B) ? 0 : 1));
    }
    const g1 = names[ri(3)], g2 = names[ri(3)];
    return Object.assign({ prompt: 'Two-gate trace: X = A ' + g1 + ' B, then OUT = X ' + g2 + ' C. With A=' + A + ', B=' + B + ', C=' + C + ', what is OUT (0 or 1)?' }, wrap(G[g2](G[g1](A, B), C)));
  }
};

           'whoami prints which user account is logged in right now.',
           'Useful on shared machines — and in every quest.'],
    example: ['$ whoami', 'operative'] },
  { title: 'Paths on other machines',
    body: ['Your home here is  /home/operative — slashes lean forward.',
           'That is exactly how LINUX does it:  /home/you.',
           'On a Mac, home is  /Users/you — same forward slashes.',

// ── T-SD004 · Basic Software Tools (6-8) ───────────────────────────────

    body: ['touch makes a brand-new EMPTY file:',

           'If the file already exists, touch leaves it alone.',
           'A blank file is the start of every work sheet.'],
    example: ['$ touch notes.txt', '$ ls', 'notes.txt'] },

  { title: 'Two arrows >> add to the end',

           'and keeps everything that was already there.',

    example: ['$ echo HAMMER READY >> notes.txt', '$ cat notes.txt',

  { title: 'Flags steer your tools',
    body: ['Arguments and flags change what a program does.',

           'PowerShell on Windows also honors > and >>.',

// ── T-SD006 · Text Manipulation (6-8) ──────────────────────────────────
LESSONS['T-SD006'] = { topic: 'The Text Sifting Kit', pages: [
  { title: 'grep: pull matching lines',
    body: ['grep searches a file and prints ONLY matching lines.',
           'grep ERROR alerts.log  → just the ERROR lines.',
           'Pattern first, file second.',
           'Everything else is filtered away.'],
    example: ['$ grep ERROR alerts.log', 'ERROR: shelf 7 offline'] },
  { title: 'wc, head and tail',
    body: ['wc counts things. wc -l file  counts its LINES.',
           'head shows the first lines of a file,',
           'tail shows the last lines.',
           'Both take -n to say how many:  tail -n 3 log.txt',
           'shows just the final three entries.'],
    example: ['$ wc -l visitors.log', '7', '$ tail -n 3 visitors.log'] },
  { title: 'sort and uniq: a team',
    body: ['sort arranges lines in alphabetical order.',
           'uniq removes duplicate lines — but ONLY when the',
           'duplicates sit right next to each other.',
           'So sort first! sort puts twins side by side,',
           'then uniq can spot and drop them.',
           'Apart they are weak. Together they deduplicate anything.'],
    example: ['$ sort names.txt | uniq', 'bex', 'mira', 'odo'] },
  { title: 'Pipes and saving results',
    body: ['The pipe | feeds one command\'s output into the next.',
           'sort visitors.log | uniq  — sort, then dedupe, one line.',
           'Add  > guestlist.txt  at the end to save the result',
           'into a file instead of printing it.',
           'Sift, chain, save: that is the whole kit.'],
    example: ['$ sort visitors.log | uniq > guestlist.txt'] },
  { title: 'Same job, other machines',
    body: ['Mac Terminal has grep, sort, uniq, wc, head and tail —',
           'the exact same commands, since macOS is Unix underneath.',
           'PowerShell spells them differently: Select-String is grep,',
           'Sort-Object is sort, Measure-Object counts like wc.',
           'Different names, same sifting ideas — and pipes work there too.'] }
] };

// ── T-302 · Regular Expressions (9-10) ─────────────────────────────────
LESSONS['T-302'] = { topic: 'Regex: The Shape of Text', pages: [
  { title: 'Describing text shapes',
    body: ['A regular expression (regex) describes a SHAPE of text',
           'instead of exact letters.',
           '"three digits, then a dash" is a shape. Regex writes it.',
           'grep accepts regex patterns: put the pattern in quotes,',
           'and grep prints every line whose text fits the shape.'],
    example: ['$ grep "pattern" file.txt'] },
  { title: 'Character classes [ ]',
    body: ['Square brackets match ONE character from a set.',
           '[0-9]  matches any single digit.',
           '[a-z]  matches any lowercase letter.',
           '[aeiou] matches any one vowel.',
           'grep "[0-9]" notes.txt  → every line containing a digit.'],
    example: ['$ grep "[0-9]" notes.txt', 'code 7 recovered', 'vault B2 unsealed'] },
  { title: 'Anchors ^ and $',
    body: ['Without anchors, a pattern floats anywhere in the line.',
           'The caret ^ pins the pattern to the START of a line:',
           '"^ERR" matches lines that BEGIN with ERR — not lines',
           'that merely mention ERR somewhere in the middle.',
           'The dollar sign $ pins to the END of a line:',
           '"sealed$" matches only lines that end with sealed.'],
    example: ['$ grep "^ERR" ledger.txt', '$ grep "sealed$" vaults.txt'] },
  { title: 'Quantifiers: how many',
    body: ['Quantifiers say how many times the previous piece repeats.',
           '+   one or more        [0-9]+  = a whole number',
           '*   zero or more',
           '?   zero or one (optional)',
           '{4} exactly four       [0-9]{4} = exactly four digits',
           'Combine with anchors to demand an EXACT overall shape:',
           '^A[0-9]{2}$  = a line that is A plus exactly two digits.'] },
  { title: 'Groups ( )',
    body: ['Parentheses bundle a piece of pattern into one unit',
           'so a quantifier can act on the whole thing.',
           '(ab)+  matches ab, abab, ababab...',
           'Groups also CAPTURE what they matched, so tools like sed',
           'can reuse the captured text when replacing.',
           'Classes, anchors, quantifiers, groups: the four regex gears.'] },
  { title: 'Regex everywhere',
    body: ['Regex is not a Grid trick — it is an industry standard.',
           'Mac Terminal: the same grep and sed accept these patterns.',
           'Windows PowerShell: Select-String -Pattern takes regex too,',
           'and so do search boxes in most code editors (like VS Code).',
           'Learn the shapes once; hunt text on any machine forever.'] }
] };

// ── T14 · Versioning & Iteration (9-10) ────────────────────────────────
LESSONS['T14'] = { topic: 'Version Control Thinking', pages: [
  { title: 'Why keep versions?',
    body: ['Editing without backups is walking a tightrope with no net.',
           'Version control gives you the net: snapshots of your work',
           'you can always climb back to.',
           'Every snapshot is a promise to your future self:',
           'nothing is ever truly lost.'] },
  { title: 'The vocabulary',
    body: ['REPOSITORY (repo): a folder whose history is being tracked.',
           'COMMIT: one saved snapshot, plus a message saying why.',
           'HISTORY: the chain of commits, newest to oldest.',
           'A commit message with no meaning is a locked box',
           'with no label. Write messages your future self can read.'] },
  { title: 'The git commands',
    body: ['git is the tool nearly every developer uses for this.',
           'git init             turn this folder into a new, empty repo',
           'git add poem.txt     STAGE a file (include it in the next snapshot)',
           'git commit -m "..."  take the snapshot, with a message',
           'git log              show the history of commits',
           'Stage, then commit: choose what goes in, then seal it.'],
    example: ['$ git init', '$ git add poem.txt', '$ git commit -m "first draft"'] },
  { title: 'Going back in time',
    body: ['The payoff: any file can be restored to a past commit.',
           'git restore (or checkout) copies an old snapshot',
           'back over the current file — the bad edit vanishes.',
           'Iterate boldly: commit, change, test... and if the change',
           'is a disaster, roll back and try a different path.'] },
  { title: 'Snapshots by hand',
    body: ['You can feel what git does using plain commands:',
           'keep a hidden folder of copies, one per version,',
           'with the version and message right in the file name.',
           'Restoring = copying an old snapshot back over the file.',
           'git simply automates this bookkeeping — brilliantly.'],
    example: ['$ mkdir .vault', '$ cp poem.txt .vault/v1_first-draft.txt',
              '$ cp .vault/v1_first-draft.txt poem.txt   # roll back'] },
  { title: 'Same git, every machine',
    body: ['git speaks the same language everywhere:',
           'git init, add, commit, log — identical in Mac Terminal (zsh)',
           'and in Windows PowerShell.',
           'That is rare and precious: one skill, zero translation.',
           'Repos even move between Mac and Windows without changes.'] }
] };

// ── T15 · Systems Integration (9-10) ───────────────────────────────────
LESSONS['T15'] = { topic: 'Pipes: Small Tools, Big Machines', pages: [
  { title: 'One tool, one job',
    body: ['Unix philosophy: each tool does ONE thing well.',
           'grep filters. sort orders. uniq dedupes. wc counts.',
           'None of them alone can clean a messy log file.',
           'Chained together, they can do almost anything.',
           'The pipe is how small tools become a big machine.'] },
  { title: 'The pipe |',
    body: ['The | symbol connects two commands:',
           'everything the left command PRINTS becomes',
           'the INPUT the right command reads (its stdin).',
           'grep packet traffic.log | wc -l',
           'grep finds the packet lines; wc -l counts them.',
           'One line, two tools, one answer.'],
    example: ['$ grep packet traffic.log | wc -l', '6'] },
  { title: 'Longer chains',
    body: ['Pipes chain as far as you need:',
           'grep packet traffic.log | sort | uniq',
           'filter → alphabetize → drop duplicates.',
           'Each stage transforms the stream and passes it on,',
           'like stations on an assembly line.'],
    example: ['$ grep packet traffic.log | sort | uniq',
              'packet from apex', 'packet from cove'] },
  { title: 'Sources and destinations',
    body: ['cat can START a chain by merging several files:',
           'cat alpha.log beta.log  streams both, one after another.',
           'A redirect ENDS a chain by saving the result:',
           '... | sort | uniq > masterlist.txt',
           'Files in, pipeline in the middle, file out.',
           'Raw logs in, clean answers out — that is integration.'],
    example: ['$ cat alpha.log beta.log | grep relay | sort | uniq > nodes.txt'] },
  { title: 'Pipes on other machines',
    body: ['Pipes were born in Unix, so Mac Terminal has them',
           'exactly as you see here.',
           'PowerShell on Windows pipes too — its | passes rich',
           'OBJECTS between commands instead of plain text,',
           'but the idea is identical: output of one, input of the next.',
           'Think in chains and every shell becomes your workshop.'] }
] };

// ── T32 · Automation Basics (9-10) ─────────────────────────────────────
LESSONS['T32'] = { topic: 'Shell Scripts: Write It Once', pages: [
  { title: 'What a script is',
    body: ['A shell script is just the commands you would type,',
           'written down in a file so you never type them again.',
           'The first line  #!/bin/sh  names the shell to run it.',
           'Lines starting with # are comments — notes for humans.',
           'Reading a script = reading someone\'s recorded keystrokes.'],
    example: ['#!/bin/sh', '# rename all the units', 'echo starting...'] },
  { title: 'Variables',
    body: ['A variable is a named container that stores a value.',
           'PREFIX=bot        stores the value bot   (no spaces around =)',
           'Use it later with a dollar sign: $PREFIX',
           'Change the value once at the top and every line',
           'that uses $PREFIX changes with it. That is the power.'],
    example: ['PREFIX=bot', 'echo $PREFIX-unit1   # prints bot-unit1'] },
  { title: 'Loops: the boring part, automated',
    body: ['A for loop repeats its body once per item in a list:',
           'for f in unit1 unit2 unit3',
           'do',
           '  mv $f.part $PREFIX-$f.txt',
           'done',
           'Each pass, $f becomes the next item.',
           'Three files or three thousand — same four lines.'] },
  { title: 'Reading before running',
    body: ['Before you run any script: cat it and trace it.',
           'Find the variables. Find the loop. Ask: what would',
           'ONE pass of that loop do, by hand?',
           'If you can perform a script\'s job manually,',
           'you truly understand it — and can fix it when it breaks.',
           'Good automation also leaves a receipt: a report or log',
           'file proving what it did.'],
    example: ['$ ls | grep bot > report.txt   # the receipt'] },
  { title: 'Scripts on other machines',
    body: ['Mac Terminal runs these same scripts — zsh and bash',
           'both speak this language. Files end in .sh',

           'Different spelling, same three ideas everywhere:',

// ── T33 · Advanced Automation (11-12) ──────────────────────────────────
LESSONS['T33'] = { topic: 'Pipelines That Run Unattended', pages: [
  { title: 'Multi-stage design',
    body: ['A real pipeline is stages, each with one duty:',
           'clean → dedupe → report.',
           'The OUTPUT FILE of each stage is the INPUT of the next.',
           'Stages small enough to test alone, chained into',
           'a machine that processes a dataset end-to-end.',
           'Design the stages first; the commands follow.'],
    example: ['raw.dat → clean.dat → sorted.dat → report.txt'] },
  { title: 'Error handling and exit codes',
    body: ['Every command ends with an EXIT CODE: 0 means success,',
           'anything else means failure.',
           'Scripts test that code to react:',
           'if ! sh clean.sh raw.dat; then',
           '  echo stage1 FAILED >> run.log',
           '  exit 1',
           'fi',
           'Fail fast, record the failure, stop before stage 2',
           'processes garbage. A pipeline that cannot survive',
           'bad data is not a pipeline — it is a prayer.'] },
  { title: 'Log every stage',
    body: ['Unattended means nobody is watching — so the LOG watches.',
           'After each stage, append one line:',
           'echo stage1 ok >> run.log',
           'Use >> (append), never > — a log must keep its history.',
           'When something dies at 3 a.m., the log is the only witness.',
           'A finished run should read like a story:',
           'stage1 ok, stage2 ok, pipeline complete.'],
    example: ['$ cat run.log', 'stage1 ok', 'stage2 ok', 'pipeline complete'] },
  { title: 'Expect bad data',
    body: ['Corrupt input is not an emergency. It is a Tuesday.',
           'Robust pipelines plan a lane for it:',
           'filter out garbage lines (grep keeps only good ones),',
           'quarantine bad files instead of deleting them,',
           'and fall back to backups when the source is ruined.',
           'The goal: the pipeline finishes and the log explains how.'] },
  { title: 'Running on a schedule',
    body: ['Unattended pipelines are STARTED by the machine itself.',
           'On Unix systems — including macOS — cron runs commands',
           'on a schedule (macOS also has launchd).',
           'Windows uses Task Scheduler for the same job.',
           'Same discipline on every platform: exit codes checked,',
           'stages logged, bad data survived. Then you can sleep.'] }
] };

// ── T-SD027 · Systems and Application Programming (11-12) ──────────────
LESSONS['T-SD027'] = { topic: 'Processes and the Environment', pages: [
  { title: 'What a process is',
    body: ['A PROCESS is a program that is currently running.',
           'The OS gives each one a PID — a process ID number —',
           'and tracks it in the process table.',
           'Dozens run at once: your shell, the clock, daemons.',
           'Nothing runs on a healthy system unseen.'] },
  { title: 'Inspect before you act',
    body: ['First list the processes, then read the suspect\'s details.',
           'On Unix systems, ps and top list processes;',
           'on this Grid kernel, the proc directory holds one file',
           'per process — ls it, then cat the suspicious entry.',
           'Look for the signs: huge CPU %, a name nobody recognizes,',
           'a warning in its status. Diagnose first. Always.'],
    example: ['$ ls proc', '101.init.proc  482.rogue.proc', '$ cat proc/482.rogue.proc'] },
  { title: 'Terminate with care',
    body: ['To end a process on a real system:  kill <PID>',
           'kill 482 politely asks process 482 to stop.',
           'Terminate ONLY the process you inspected —',
           'killing the wrong PID can take down something vital.',
           'On the Grid kernel, removing a process file ends it:',
           'same precision required.'],
    example: ['$ kill 482        # real system', '$ rm proc/482.rogue.proc  # grid kernel'] },
  { title: 'Environment variables',
    body: ['Every process inherits a set of named settings',
           'called ENVIRONMENT variables:',
           'PATH   where the shell hunts for programs',
           'HOME   your home directory',
           'Children inherit them from the process that starts them.',
           'Print one with echo:  echo $HOME',
           'Auditing the environment often explains odd behavior —',
           'a poisoned PATH can make the wrong program run.'],
    example: ['$ echo $PATH', '/grid/bin'] },
  { title: 'Same job, other machines',
    body: ['macOS: Activity Monitor shows every process and its CPU;',
           'in Terminal, ps, top and kill work as shown here,',
           'and  echo $PATH  prints the environment variable.',
           'Windows: Task Manager (Ctrl+Shift+Esc) lists processes',
           'and End Task terminates one; in PowerShell use',
           'Get-Process, Stop-Process, and  $env:PATH .',
           'List, inspect, terminate, audit — textbook on any OS.'] }
] };

// ── T-SD030 · Advanced Systems Programming (11-12) ─────────────────────
LESSONS['T-SD030'] = { topic: 'Robust Shell Tools', pages: [
  { title: 'The robustness mindset',
    body: ['Amateur scripts assume everything goes right.',
           'Robust tools assume the worst: missing input files,',
           'crashes mid-run, users who pass nonsense.',
           'Every hardened script answers three questions:',
           'What if the input is missing? What if I crash halfway?',
           'How will anyone know what happened?'] },
  { title: 'Functions',
    body: ['A FUNCTION is a reusable, named group of commands:',
           'log() {',
           '  echo "[guard] $1" >> guard.log',
           '}',
           'Call it like a command:  log "started"',
           '$1 inside is the first argument it was called with.',
           'Write the logic once, call it everywhere —',
           'and fix it in one place when it is wrong.'] },
  { title: 'Exit codes: the last word',
    body: ['Every program ends by reporting a number: its exit code.',
           'Zero means all is well. Anything else is a confession.',
           'Your scripts should confess precisely:',
           'exit 0 on success, and a distinct nonzero code',
           'per failure kind (say, exit 2 for missing input).',
           'Callers test the code and react — that is how scripts',
           'invoking scripts stay honest with each other.'],
    example: ['if [ ! -f "$1" ]; then', '  log "missing input $1"', '  exit 2', 'fi'] },
  { title: 'Traps: crash insurance',
    body: ['trap registers commands to run when something happens:',
           'trap "log crashed; rm -r tmpwork" ERR',
           'If any command errors, the trap fires — logging the crash',
           'and cleaning up temp files before the script dies.',
           'The tool never leaves a mess, even when it fails.',
           'That is the difference between a script and a TOOL.'] },
  { title: 'Process substitution',
    body: ['Some commands only accept FILES, not pipes.',
           'Process substitution fakes one:  <(command)',
           'lets a program read another command\'s live output',
           'as if it were a file on disk.',
           'diff <(sort a.txt) <(sort b.txt)',
           'compares two sorted streams — no temp files needed.'] },
  { title: 'Robustness on other machines',
    body: ['These patterns run unchanged in Mac Terminal —',
           'zsh and bash both support functions, traps and exit codes.',
           'PowerShell expresses the same discipline its own way:',
           'function blocks, try/catch for traps,',
           'and $LASTEXITCODE to read the previous exit code.',
           'The mindset — assume the worst, log everything — is portable.'] }
] };

// ── T-SD031 · Systems and Application Automation (11-12) ───────────────
LESSONS['T-SD031'] = { topic: 'Scheduled, Logged, Recoverable', pages: [
  { title: 'Reading a cron schedule',
    body: ['cron runs commands on a clock, human or no human.',
           'A crontab line has five time fields, then the command:',
           'minute  hour  day-of-month  month  day-of-week',
           '0 2 * * *  sh digest.sh night1',
           'means: at minute 0 of hour 2 — 02:00 — every day,',
           'run digest.sh with the argument night1.',
           'Stars mean "every". Learn to read the five fields.'],
    example: ['# m h dom mon dow  command', '0 2 * * *  sh digest.sh night1'] },
  { title: 'Parameterized scripts',
    body: ['One script, many jobs: pass a PARAMETER.',
           'sh digest.sh night1   and   sh digest.sh night2',
           'run the same logic against different inputs — inside',
           'the script, $1 holds that argument.',
           'A parameterized suite scales without copy-paste:',
           'new night, new argument, zero new code.'] },
  { title: 'Every run leaves a record',
    body: ['Scheduled jobs run while everyone sleeps,',
           'so every run must append to a log:',
           'echo night1 done >> watch.log',
           'Success gets logged. Failure gets logged HARDER.',
           'The morning check is one command: cat watch.log —',

  { title: 'Failure recovery lanes',
    body: ['Design the bad-input lane before you need it:',
           '1) Detect — corrupt data has signatures; peek inside.',
           '2) Quarantine — mv the bad file aside; never process it,',
           '   never delete it (it is evidence).',
           '3) Recover — rebuild from a backup source instead.',

           'Where the clock lives depends on the OS:',
           'cron on Unix and macOS (plus launchd on Macs),',
           'Task Scheduler on Windows.',
           'Any of them can fire a script that logs and recovers —',
           'the discipline is yours to write, on every platform.'] }
] };

LESSONS['T22'] = { topic: 'Your First Real Page', pages: [
  { title: 'Headings and paragraphs',
    body: ['<h1> is the page\'s main headline — use it once.',
