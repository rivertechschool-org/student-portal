           '<p> wraps each paragraph of normal text.',
           'Browsers add spacing between them automatically.'],
    example: ['<h1>Signal Restored</h1>', '<p>The beacon is back online.</p>'] },
  { title: 'Lists',
    body: ['<ul> starts a bulleted (Unordered) List.',
           '<ol> starts a numbered (Ordered) one.',
           'Each item inside is an <li> — List Item.',
           'Close every li, then close the list itself.'],
    example: ['<ul>', '  <li>rope</li>', '  <li>lamp oil</li>', '</ul>'] },
  { title: 'Images and alt text',
    body: ['<img src="beacon.png" alt="lighthouse">',
           'src names the image file to show.',
           'alt DESCRIBES the image in words. It matters:',
           'screen readers speak it to blind visitors,',
           'and it appears whenever the image fails to load.',
           'Every image deserves honest alt text.'] },
  { title: 'Links',
    body: ['<a href="https://rivertech.me">Return to port</a>',
           'The a tag makes a link. href holds the destination;',
           'the text between the tags is what visitors click.',
           'Links can point to whole sites or to nearby files',
           'like  href="manifest.html".'] },
  { title: 'A first taste of CSS',
    body: ['CSS styles your structure. A rule looks like:',
           'p { color: teal; }',
           'selector { property: value; }',
           'color changes text color; font-family changes the font.',
           'Add class="intro" to an element and target it with .intro',
           'to style just that one kind of paragraph.'],
    example: ['<style>', '  .intro { color: teal; }', '</style>'] },
  { title: 'Learn from real pages',
    body: ['Every site you visit is built from these same pieces.',
           'View the source in Chrome, Edge or Safari —',
           'right-click, View Page Source (Ctrl+U on Windows,',
           'Cmd+Option+U on a Mac) — and find the h1, the lists,',
           'the links. The whole web is your example file.'] }
] };

// ── T-SD018 · Web to Desktop Design (9-10) ─────────────────────────────
LESSONS['T-SD018'] = { topic: 'Containers and Flexbox', pages: [
  { title: 'Layouts are containers',
    body: ['Desktop-feeling apps are built from CONTAINERS:',
           'a toolbar strip on top, work panels in the middle,',
           'a status bar at the foot.',
           'In HTML each container is usually a <div> —',
           'a plain box that exists to hold and arrange things.',
           'Sketch the boxes first; the markup writes itself.'],
    example: ['<div id="toolbar">Tools</div>',
              '<div class="panel">Map</div>',
              '<div id="statusbar">Ready</div>'] },
  { title: 'id vs class',
    body: ['An id names ONE unique element: id="toolbar".',
           'Only one element per page may carry a given id.',
           'A class marks a KIND of element: class="panel" —',
           'many panels can share it.',
           'CSS targets them as #toolbar and .panel',
           'One-of-a-kind gets an id; repeatables get a class.'] },
  { title: 'display: flex',
    body: ['Flexbox is CSS\'s flexible row-and-column engine.',
           'Set it on the PARENT container:',
           '.workspace { display: flex; }',
           'Its children now line up in a neat row.',
           'flex-direction: column stacks them vertically instead.',
           'Panels grow, shrink and align without fragile math.'],
    example: ['.workspace { display: flex; }',
              '.panel { flex: 1; }   /* share space equally */'] },
  { title: 'Sizing with intent',
    body: ['Equal columns are arithmetic: a 900px-wide window',
           'holding three equal columns gives each one 300px.',
           'But fixed pixels are brittle — prefer flexible shares:',
           'flex: 1 on each panel divides space evenly',
           'at ANY window size. Spacing comes from gap and padding,',
           'not from guessed margins.'] },
  { title: 'Consistent hierarchy',
    body: ['Users learn a layout once and expect it everywhere:',
           'toolbar always up top, status always at the foot,',
           'panels between — every screen of your app the same.',
           'Reuse the same class names (.panel) for the same roles',
           'so one stylesheet rules them all.',
           'Consistency is what makes a page FEEL like an app.'] }
] };

// ── T-SD019 · HTML CSS (9-10) ──────────────────────────────────────────
LESSONS['T-SD019'] = { topic: 'Skeleton First, Style Second', pages: [
  { title: 'Bones before paint',
    body: ['Build in two passes, always in this order:',
           '1. STRUCTURE — headings, paragraphs, links, in clean HTML.',
           '2. STYLE — colors, fonts, spacing, in CSS.',
           'A page with good bones is readable even unstyled.',
           'A styled page with broken bones is a haunted house.'],
    example: ['<h1>Quartermaster Log</h1>',
              '<p class="note">Ropes counted.</p>',
              '<a href="manifest.html">full manifest</a>'] },
  { title: 'Selectors: who gets styled',
    body: ['A CSS rule starts with a SELECTOR — who it applies to:',
           'p          every paragraph element',
           '.note      every element with class="note"',
           '#header    the one element with id="header"',
           'Then the declarations: { property: value; }',
           'p { color: teal; }  paints every paragraph teal.'] },
  { title: 'The style element',
    body: ['CSS can live in a <style> block on the page:',
           '<style>',
           '  h1 { font-family: monospace; }',
           '  p  { color: teal; }',
           '<' + '/style>',
           'Each rule on its own line, each declaration ending in ;',
           'Bigger sites move this into a separate .css file.'] },
  { title: 'The box model',
    body: ['Every element is a box with layers, inside out:',
           'CONTENT — the text or image itself',
           'PADDING — breathing room inside the border',
           'BORDER  — the drawn edge',
           'MARGIN  — space pushing neighbors away',
           'Total width = content + left/right padding + borders.',
           'Example: 200px content + 10px padding each side',
           '+ 5px border each side = 200 + 20 + 10 = 230px.'] },
  { title: 'Typography and color',
    body: ['font-family sets the typeface; give fallbacks:',
           'font-family: Georgia, serif;',
           'color sets text color; background-color fills the box.',
           'Keep contrast high — dark text on light, or the reverse.',
           'A page must be readable by lamplight. Style serves',
           'reading; it never fights it.'] }
] };

// ── T-SD022 · HTML CSS Concepts (9-10) ─────────────────────────────────
LESSONS['T-SD022'] = { topic: 'Cascade, Specificity, Inheritance', pages: [
  { title: 'When rules collide',
    body: ['Two rules walk into one element. Only one walks out.',
           'The CASCADE is CSS\'s system for deciding which:',
           'more specific selectors beat less specific ones,',
           'and among equals, the LAST rule in the file wins.',
           'Learn the tiebreakers and the stylesheet stops',
           'fighting you.'] },
  { title: 'Specificity ranks',
    body: ['From weakest to strongest:',
           'tag selectors      p        weakest',
           'class selectors    .note    beat tags',
           'id selectors       #alert   beat classes',
           'So if .critical says blue and #alert says red,',
           'the element renders red — the id outranks the class.',
           'One element can carry an id AND classes at once:',
           '<p id="alert" class="critical">...</p>'] },
  { title: 'Inheritance',
    body: ['Text properties flow DOWN the tree to children.',
           'If body { color: green; } and a paragraph inside',
           'sets no color of its own, its text renders green —',
           'it INHERITS from its parent.',
           'Color and font properties inherit; box properties',
           '(padding, border, margin) do not.',
           'Set text defaults once on body; override where needed.'] },
  { title: 'Box model arithmetic',
    body: ['Rendered width adds up layer by layer:',
           'content + padding (both sides) + border (both sides).',
           '150px content, 12px padding each side, 3px border',
           'each side: 150 + 24 + 6 = 180px.',
           'Do this math whenever boxes overflow mysteriously —',
           'the extra width is almost always padding and border.'] },
  { title: 'See the cascade live',
    body: ['Browser DevTools show exactly which rule won and why.',
           'Open them with F12 (Windows) or Cmd+Option+I (Mac)',
           'in Chrome, Edge or Safari, then inspect any element:',
           'winning rules on top, defeated ones struck through.',
           'It is the cascade, visualized — the fastest way',
           'to debug a style that will not apply.'] }
] };

// ── T-SD023 · Basic HTML Design (9-10) ─────────────────────────────────
LESSONS['T-SD023'] = { topic: 'Semantic Layout Bones', pages: [
  { title: 'The trouble with div soup',
    body: ['You CAN build a whole page from anonymous divs.',
           'But screen readers, search engines and other developers',
           'get lost in it — every box looks the same.',
           'Semantic tags fix that: each region gets a tag',
           'that says what the region IS.'] },
  { title: 'The four big bones',
    body: ['<header>  the page\'s masthead: title, logo, banner',
           '<nav>     the main block of navigation links',
           '<main>    the primary content — one per page',
           '<footer>  the foot: credits, copyright, small print',
           'Lay these four down first, even empty.',
           'The skeleton comes before the flesh.'],
    example: ['<header></header>', '<nav></nav>',
              '<main></main>', '<footer></footer>'] },
  { title: 'Flesh on the bones',
    body: ['Inside the skeleton, the usual parts take their places:',
           'the h1 headline near the top, links inside the nav,',
           'content in main, a copyright line in the footer.',
           'Repeated things share a class — three nav links',
           'can all carry class="navlink" so one CSS rule',
           'styles them identically.'],
    example: ['<nav>', '  <a class="navlink" href="#">Berths</a>',
              '  <a class="navlink" href="#">Cargo</a>', '</nav>'] },
  { title: 'Semantics means meaning',
    body: ['Semantic tags mostly do not change how things LOOK —',
           'they add MEANING for machines.',
           'A screen reader can jump straight to <nav> or <main>.',
           'Search engines weigh content by the region it sits in.',
           'Style is for eyes; semantics is for everyone else.',
           'Build with real bones and every reader finds their way.'] }
] };

// ── T-SD024 · HTML to Web Fundamentals (9-10) ──────────────────────────
LESSONS['T-SD024'] = { topic: 'From Request to Render', pages: [
  { title: 'The request',
    body: ['Every page starts as a REQUEST across the network.',
           'The protocol carrying it is HTTP — or HTTPS,',
           'the secure kind — the letters at the front of a URL.',
           'Your browser asks a server for index.html;',
           'the server answers with the file; only then',
           'can anything render. Request, response, render.'] },
  { title: 'The head steers the page',
    body: ['The document head holds instructions, not content:',
           '<meta charset="utf-8">  how to decode the characters —',
           'without it, quotes and accents turn to garbage.',
           '<title>Dock Manifest</title>  names the browser tab.',
           '<link rel="stylesheet" href="styles.css">  pulls in',
           'the CSS file before the body paints.',
           'Head elements first — they steer everything after.'],
    example: ['<meta charset="utf-8">', '<title>Dock Manifest</title>',
              '<link rel="stylesheet" href="styles.css">'] },
  { title: 'Scripts: async vs defer',
    body: ['A plain script tag PAUSES page parsing while it runs.',
           'Two attributes avoid the stall:',
           'async — download in parallel, run the moment it arrives',
           '(order not guaranteed).',
           'defer — download in parallel, but politely postpone',
           'running until the document is fully parsed, in order.',
           'For scripts that touch the page\'s elements, defer wins.'] },
  { title: 'Parse, build, paint',
    body: ['Once the HTML arrives, the browser parses it top to',
           'bottom, builds its model of the document, fetches the',
           'CSS and images it references, then paints pixels.',
           'That is why order matters: stylesheets in the head,',
           'deferred scripts, images with sizes.',
           'A well-ordered page paints fast and never jumps around.'] },
  { title: 'Watch the journey yourself',
    body: ['Browsers let you see all of it happen.',
           'View Page Source (Ctrl+U Windows, Cmd+Option+U Mac)',
           'shows the raw HTML the server sent.',
           'DevTools (F12 or Cmd+Option+I) has a Network tab:',
           'reload and watch the HTML arrive first, then CSS,',
           'images and scripts — the whole request parade,',
           'in Chrome, Edge or Safari, on Mac or Windows alike.'] }
] };

// ── T-SD025 · Building Responsive Websites (9-10) ──────────────────────
LESSONS['T-SD025'] = { topic: 'One Page, Every Screen', pages: [
  { title: 'The responsive promise',
    body: ['Your page will be read on wall screens, laptops,',
           'tablets and cracked phones — the same page.',
           'Responsive design means it REFLOWS to fit each one:',
           'no tiny unreadable text, and above all,',
           'no horizontal scrolling. Ever.'] },
  { title: 'The viewport meta tag',
    body: ['Phones pretend to be desktops unless you say otherwise.',
           'This head line makes them report their true width:',
           '<meta name="viewport"',
           '      content="width=device-width, initial-scale=1">',
           'Without it, every other responsive technique fails —',
           'the phone just shows a shrunken desktop page.'],
    example: ['<meta name="viewport" content="width=device-width, initial-scale=1">'] },
  { title: 'Fluid units',
    body: ['Fixed units freeze: 300px is 300px on every screen.',
           'Fluid units flex: 50% is half of WHATEVER holds it.',
           'Prefer percentages and flexible boxes for layout,',
           'and cap media with:',
           'img { max-width: 100%; }',
           'so images shrink with their container instead of',
           'punching through the side of a phone screen.'] },
  { title: 'Breakpoints with @media',
    body: ['The @media at-rule applies styles conditionally:',
           '@media (max-width: 600px) {',
           '  .deck { width: 100%; }',
           '}',
           'These rules fire only when the screen is 600px or',
           'narrower — a BREAKPOINT where the layout changes.',
           'The classic move: multi-column cards on wide screens',
           'stack into a single column on narrow phones.'] },
  { title: 'Test at every width',
    body: ['Responsive claims must be tested, not trusted.',
           'Easiest check: drag your browser window narrower',
           'and watch the layout reflow — Mac or Windows.',
           'Better: DevTools device mode (F12 / Cmd+Option+I,',
           'then the phone icon) simulates real phone and tablet',
           'sizes in Chrome, Edge and Safari.',
           'Phone, tablet, desktop: all three, before you ship.'] }
] };

// ── T-SD039 · Front-End Development (11-12) ────────────────────────────
LESSONS['T-SD039'] = { topic: 'Building an Interface to Spec', pages: [
  { title: 'Read the spec like a contract',
    body: ['Front-end work usually starts from a design SPEC:',
           'exact headings, exact counts, exact names.',
           'Treat it as a contract — "three cards" means exactly',
           'three, and the h1 wording matters to the letter.',
           'Professionals are measured on fidelity to spec first,',
           'cleverness second.'] },
  { title: 'Classes repeat, ids do not',
    body: ['The spec says a status pill appears on MANY elements:',
           'that is a CLASS — class="status-pill" — reusable freely.',
           'The spec says ONE version label exists: that is an id —',
           'id="version" — unique on the page.',
           'Choosing wrong bites later: duplicate ids break',
           'scripts and CSS in quiet, maddening ways.'] },
  { title: 'The shell: semantic frame',
    body: ['Every console-style interface begins with the frame:',
           'header for the masthead, nav holding the route links,',
           'main for the working area, footer for the small print.',
           'Give the nav links a shared class so they style as one.'],
    example: ['<header><h1>Harbormaster Console</h1></header>',
              '<nav>', '  <a class="navlink" href="#">Berths</a>',
              '  <a class="navlink" href="#">Tides</a>', '</nav>'] },
  { title: 'Components: cards and pills',
    body: ['Interfaces are assembled from repeatable COMPONENTS.',
           'A card: a div with class="card" holding one widget\'s',
           'title, content and status.',
           'A status pill: a small span with class="status-pill"',
           'showing OK / DOWN at a glance.',
           'Build one well, stamp out as many as the spec asks.'],
    example: ['<div class="card">Berths', '  <span class="status-pill">OK</span>',
              '</div>'] },
  { title: 'Layout with flex',
    body: ['Arrange the components with flexbox on their parent:',
           'main { display: flex; }',
           'The cards line up in a row and share the space.',
           'Add gap for spacing and flex-wrap so cards flow',
           'to the next line on narrow screens.',
           'Structure, components, layout — then compare against',
           'the spec one requirement at a time.'],
    example: ['<style>', '  main { display: flex; gap: 12px; }', '<' + '/style>'] },
  { title: 'Making it react',
    body: ['Static interfaces become apps through EVENTS.',
           'querySelector finds an element;',
           'addEventListener attaches behavior to it:',
           'btn.addEventListener("click", refresh);',
           'Finding is not listening — you need both, in that order.',
           'That is the doorway into interactive front-end work.'] }
] };
// GRIDFALL Systems & Platform Codex — Part 3: concept-module lessons (25 nodes)

// ── T1 · Device Basics (K-2) ───────────────────────────────────────────
LESSONS['T1'] = { topic: 'Wake Up Your Device', pages: [
  { title: 'On and off',
    body: ['Every device has a power button.',
           'Press it to turn the device ON.',
           'It has a circle-with-a-line mark on it.',
           'Use the same button to turn it off, the safe way.',
           'Never just unplug a device that is on!'] },
  { title: 'Your secret word',
    body: ['A password is a secret word that lets you in.',
           'Only YOU should know your password.',
           'Do not tell it to friends. Not even best friends!',
           'Type it in, and the device says: welcome!'] },
  { title: 'Name the parts',
    body: ['The SCREEN is the flat, glowing part. It shows',
           'pictures and words. You look at it.',
           'The KEYBOARD has letter keys: A, B, C...',
           'and a long space bar. You type with it.',
           'A MOUSE or TRACKPAD moves the little pointer.',
           'The CHARGING PORT is the small slot on the side.',
           'The charger cord clicks in there to fill the battery.'] },
  { title: 'Open and close apps',
    body: ['Apps are the programs you use — games, drawing, books.',
           'Tap or click an app picture (icon) to open it.',
           'Close it when you are done. That keeps things tidy.',
           'On a Mac, app icons sit in the Dock at the bottom.',
           'On Windows, they sit on the taskbar at the bottom.',
           'Same idea, two names!'] }
] };

// ── T3 · Keyboarding & Input (K-2) ─────────────────────────────────────
LESSONS['T3'] = { topic: 'Happy Typing Fingers', pages: [
  { title: 'Look, then type',
    body: ['Typing is telling the computer words with keys.',
           'Read the line first. Then type it slowly.',
           'Right beats fast! Speed comes later, all by itself.'] },
  { title: 'Big letters need Shift',
    body: ['Little letters come out when you tap a key.',
           'For a BIG letter, hold Shift and tap the letter.',
           'Names and sentence starts need big letters.',
           'M in My. Z in ZED. Hold Shift, tap, let go.'] },
  { title: 'Dots and marks',
    body: ['A period . ends a sentence. It is one small dot.',
           'A comma , makes a tiny rest inside a sentence.',
           'For a ! mark, hold Shift and tap the 1 key.',
           'Type every mark you see. Marks count too!'] },
  { title: 'Space, Enter, and oops',
    body: ['The space bar puts a space between words.',
           'Enter tells the computer: I am done, go!',
           'Made a mistake? The delete key eats one letter.',
           'On Windows that key says Backspace.',
           'On a Mac it says delete. Same helpful job!'] }
] };

// ── T4 · Digital Citizenship (K-2) ─────────────────────────────────────
LESSONS['T4'] = { topic: 'Stay Safe on the Grid', pages: [
  { title: 'Keep private things private',
    body: ['Some things are PRIVATE. Never share them online:',
           'your real name, your address, your school,',
           'your phone number, and your password.',
           'Fun things are fine to share — like a favorite color!',
           'Private things tell strangers how to find you. Keep them safe.'] },
  { title: 'Your password is yours',
    body: ['A password is like a toothbrush.',
           'Only one person should ever use it: you!',
           'Not friends. Not people from games.',
           'If someone asks for it — the answer is no.'] },
  { title: 'Watch out for tricky strangers',
    body: ['Online, some people pretend to be nice to trick you.',
           'They may promise prizes or coins for your info.',
           'A real friend never needs your private things.',
           'If a stranger asks — do not tell. Not ever.'] },
  { title: 'Stop. Do not answer. Tell.',
    body: ['If a message makes you feel scared or yucky:',
           'STOP — put the message down.',
           'DO NOT ANSWER it. Not even a little.',
           'TELL a trusted adult — a parent or a teacher.',
           'You are never in trouble for telling. Telling is brave!'] }
] };

// ── T7 · Internet Research (3-5) ───────────────────────────────────────
LESSONS['T7'] = { topic: 'Search Like a Detective', pages: [
  { title: 'Ask a sharp question',
    body: ['Search engines match the words you give them.',
           'One vague word gets a million fuzzy answers.',
           'Use the exact thing you want to know:',
           'not  dogs  but  how fast can a greyhound run',
           'Specific words in, useful answers out.'] },
  { title: 'Spot the ads',
    body: ['Some results PAID to be at the top of the page.',
           'They carry a little label: Ad or Sponsored.',
           'An ad is trying to sell you something —',
           'it is not the best answer, just the best payer.',
           'Detectives read the labels before they click.'] },
  { title: 'Who wrote this, and why?',
    body: ['Anyone can put anything on the internet. Anyone!',
           'So ask two questions about every source:',
           'WHO wrote it? Experts, like a museum or a scientist?',
           'WHY did they write it? To teach — or to sell or joke?',
           'A museum page about volcanoes beats a random forum',
           'post every time. Experts who teach: that is your source.'] },
  { title: 'Double-check big facts',
    body: ['Even good sources make mistakes.',
           'Found a surprising fact? Check a SECOND source.',
           'If two trustworthy places agree, believe it more.',
           'If they disagree, keep digging — that is detective work.'] }
] };

// ── T8 · Digital Communication (3-5) ───────────────────────────────────
LESSONS['T8'] = { topic: 'Send the Right Message', pages: [
  { title: 'The subject line',
    body: ['Every email starts with a SUBJECT — one short line',
           'at the top that says what the message is about.',
           'Readers see it before they even open the mail.',
           'Good: Missing homework question',
           'Bad: hi  (about what?)',
           'Clear subject, happy reader.'] },
  { title: 'Match your tone to your reader',
    body: ['You talk differently to a friend and to a teacher —',
           'messages work the same way.',
           'To a teacher: a polite greeting like  Dear Ms. Reyes,',
           'clear sentences, and a sign-off like  Thank you, Sam.',
           'To a friend: relaxed is fine!',
           'Ask: WHO will read this? Then write for them.'] },
  { title: 'Reply vs reply-all',
    body: ['Reply answers only the person who sent the message.',
           'Reply-all sends your answer to EVERYONE on the email.',
           'Reply-all is a megaphone — use it only when the',
           'whole group truly needs your answer.',
           '"I can bring markers!" goes to the sender. Just reply.'] },
  { title: 'Forwarding and privacy',
    body: ['A message sent to you still belongs to the sender.',
           'A private note or joke is not yours to pass around.',
           'Before forwarding, ask the sender first.',
           'When unsure, do not forward. Trust is easy to lose',
           'and slow to win back.'] }
] };

// ── T9 · Algorithmic Thinking (6-8) ────────────────────────────────────
LESSONS['T9'] = { topic: 'Recipes for Machines', pages: [
  { title: 'What an algorithm is',
    body: ['An algorithm is a recipe a machine can follow:',
           'a list of exact steps, in order, no guessing allowed.',
           'Machines do EXACTLY what the steps say —',
           'nothing more, nothing less, no common sense.',
           'That is their weakness and their superpower.'] },
  { title: 'Order matters',
    body: ['The same steps in the wrong order fail:',
           'you must HAVE the bread before you can toast it,',
           'and a watering can pours nothing until it is filled.',
           'Checking an algorithm? Ask at every step:',
           'does this step have everything it needs from',
           'the steps before it?'] },
  { title: 'Tracing: be the machine',
    body: ['To predict what a program does, TRACE it:',
           'run each line in your head, one at a time,',
           'writing down each variable as it changes.',
           'x = 5',
           'x = x + 3   → x is now 8',
           'x = x * 2   → x is now 16',
           'No skipping, no guessing. The machine never skips;',
           'when you trace, neither do you.'] },
  { title: 'Loops repeat steps',
    body: ['A loop runs the same steps again and again.',
           'To trace one, list every pass:',
           'count from 3 by 3, stopping after 15:',
           '3, 6, 9, 12, 15 — that is 5 numbers printed.',
           'Write the passes out. Counting in your head lies.'] },
  { title: 'Finding the broken step',
    body: ['When an algorithm fails, one step usually broke it.',
           'Trace until reality and the recipe disagree —',
           'the step where things go wrong is your suspect.',
           'Ask: is a step missing? Out of order?',
           'Or doing the wrong thing entirely?',
           'Debugging is just tracing with a purpose.'] }
] };

// ── T12 · Software Design (9-10) ───────────────────────────────────────
LESSONS['T12'] = { topic: 'Design Before You Code', pages: [
  { title: 'Decompose: one job each',
    body: ['Big programs are designed, not piled up.',
           'DECOMPOSITION splits a program into functions,',
           'each with exactly one job — like a band where',
           'nobody plays two instruments.',
           'A music player might split into: load the songs,',
           'show the menu, play one track.',
           'Small jobs are easy to build, test and fix.'] },
  { title: 'Inputs and outputs',
    body: ['For every function, name what goes IN and what comes OUT.',
           'Values passed in between the parentheses are its',
           'ARGUMENTS (also called parameters): play(track).',
           'What it hands back is its RETURN value.',
           'A function that loads every song returns a LIST —',
           'one ordered bundle holding many items.',
           'A yes/no question returns a BOOLEAN: true or false.'] },
  { title: 'Data structures: pick the right shape',
    body: ['Data structures are containers with personalities.',
           'LIST/ARRAY — items in order, numbered from the start.',
           'QUEUE — a lunch line: first in, first out (FIFO).',
           'Perfect for requests served in arrival order.',
           'STACK — a pile of plates: last in, first out.',
           'DICTIONARY/MAP — look up a key, get its value',
           'instantly, like a real dictionary. Perfect for',
           'finding a user\'s settings by their name.'] },
  { title: 'Match the structure to the need',
    body: ['Read the requirement, then choose:',
           '"first come, first served" → queue.',
           '"look it up by name, fast" → dictionary.',
           '"keep them in order, allow repeats" → list.',
           '"is it on or off?" → boolean.',
           'The right structure makes the code simple;',
           'the wrong one makes every line a fight.'] }
] };

// ── T-SD001 · Introduction to Operating Systems (6-8) ──────────────────
LESSONS['T-SD001'] = { topic: 'What an OS Actually Does', pages: [
  { title: 'The manager in the middle',
    body: ['An operating system (OS) is the manager standing',
           'between your apps and the physical hardware.',
           'Apps never touch the disk, screen or memory directly —',
           'they ASK the OS, and the OS does it safely and fairly.',
           'Windows, macOS and Linux are all operating systems.'] },
  { title: 'The kernel',
    body: ['The KERNEL is the core of the OS — the one piece',
           'that talks directly to the hardware.',
           'It decides who gets memory, who gets CPU time,',
           'and keeps programs out of each other\'s way.',
           'Everything you click passes through it eventually.'] },
  { title: 'Processes',
    body: ['A PROCESS is a program that is currently running.',
           'The OS loads it into memory, gives it a number (PID),',
           'and juggles many at once — your game, your music,',
           'and dozens of quiet helpers all run as processes.',
           'The P in PID stands for process.'] },
  { title: 'The file system',
    body: ['The FILE SYSTEM keeps every saved document sorted',
           'into folders inside folders, so anything can be',
           'found again later.',
           'Saving a drawing, opening a photo, renaming homework —',
           'all of it is the file system doing its one great job.'] },
  { title: 'The user interface',
    body: ['The USER INTERFACE (UI) is how the OS talks to YOU:',
           'icons, windows, menus and buttons you tap and click.',
           'Terminals are an interface too — text instead of icons.',
           'Same OS underneath, two ways to speak with it.'] },
  { title: 'Three famous operating systems',
    body: ['macOS, Windows and Linux do the same jobs with different names:',
           'Find your files:   Finder / File Explorer / Files',
           'Change settings:   System Settings / Settings / Settings',
           'Launch apps from:  the Dock / the taskbar / the app grid',
           'Stuck programs:    Activity Monitor / Task Manager / System Monitor',

] };

// ── T-SD003 · Basic Arithmetic (6-8) ───────────────────────────────────
LESSONS['T-SD003'] = { topic: 'Binary, Hex, and Remainders', pages: [
  { title: 'Binary: place values of 2',
    body: ['Computers count with two digits: 0 and 1.',
           'Each binary place is worth double the one before:',
           '... 8, 4, 2, 1 — reading from the right.',
           'To convert binary to decimal, add up the places',
           'holding a 1.',
           'Example: 1101 = 8 + 4 + 0 + 1 = 13.'] },
  { title: 'Decimal to binary',
    body: ['Going the other way, hunt the powers of two:',
           'which of 8, 4, 2, 1 add up to your number?',
           'Example: 9 = 8 + 1, so light those bits: 1001.',
           'Example: 5 = 4 + 1 → 101.',
           'Check your work by converting back.'] },
  { title: 'Hexadecimal: base 16',
    body: ['Hex uses sixteen digits: 0-9, then A=10, B=11,',
           'C=12, D=13, E=14, F=15.',
           'Each hex place is worth 16 times the one before.',
           'Example: 2B = 2 sixteens + 11 = 43.',
           'Example: FF = 15 sixteens + 15 = 255.',
           'Programmers love hex: one hex digit is exactly',
           'four bits.'] },
  { title: 'Order of operations',
    body: ['Expressions cook in a fixed order:',
           'parentheses first, then * and /, then + and -.',
           'So  4 + 2 * 5  is  4 + 10 = 14 — not 30.',
           'Multiplication before addition. Always.',
           'Parentheses override everything: (4 + 2) * 5 = 30.'] },
  { title: 'Modulo: the remainder',
    body: ['mod (often written %) gives the REMAINDER',
           'after whole-number division.',
           'Example: 14 mod 4 — the fours take out 12,',
           'leaving 2. So 14 mod 4 = 2.',
           'Example: 20 mod 5 = 0 — it divides evenly.',
           'Computers use mod for cycles, clocks and',
           '"is it even?" checks (n mod 2).'] }
] };

// ── T-SD011 · Introduction to Hardware (6-8) ───────────────────────────
LESSONS['T-SD011'] = { topic: 'The Organs of a Computer', pages: [
  { title: 'CPU: the thinker',
    body: ['The CPU (central processing unit) does the thinking.',
           'It fetches every instruction and executes it,',
           'millions upon millions per second.',
           'People call it the brain of the computer —',
           'every calculation passes through it.'] },
  { title: 'RAM: fast but forgetful',
    body: ['RAM (memory) holds the programs running RIGHT NOW',
           'and the data they are juggling.',
           'It is lightning fast — and totally forgetful:',
           'cut the power and RAM is instantly blank.',
           'More RAM = more things open at once without slowdown.'] },
  { title: 'Storage: the keeper',
    body: ['Storage (a hard drive or SSD) keeps files SAFE',
           'when the power is off: documents, games, photos, the OS.',
           'It is far slower than RAM but remembers everything.',
           'Opening a file = copying it from storage into RAM.',
           'Saving = copying it back to storage.'] },
  { title: 'I/O: doors in and out',
    body: ['Input/Output (I/O) devices carry data in and out:',
           'IN — keyboard, mouse, microphone, camera.',
           'OUT — screen, speakers, printer.',
           'The machine thinks with CPU and RAM,',
           'but it meets the world through its I/O.'] },
  { title: 'Finding the bottleneck',
    body: ['When a computer crawls, ONE part is usually the choke',
           'point — the bottleneck. Read the clues:',
           'CPU pinned at 100%? The thinker is overloaded.',
           'RAM full? Too much open; the machine swaps and stutters.',
           'Disk light burning while CPU naps? Storage is the drag.',
           'Watch the meters: Activity Monitor on a Mac,',
           'Task Manager on Windows show CPU, RAM and disk live.'] }
] };

// ── T-SD012 · Intro Computer Science (9-10) ────────────────────────────
LESSONS['T-SD012'] = { topic: 'Bits, Bytes, Better Algorithms', pages: [
  { title: 'Bits and bytes',
    body: ['The smallest unit of data is the BIT: one 0 or 1.',
           'Eight bits make one BYTE.',
           'Each added bit DOUBLES the possible values:',
           '1 bit → 2 values, 2 bits → 4, 3 bits → 8...',
           'n bits → 2 to the power n values.',
           'A byte (8 bits) can represent 256 different values.'] },
  { title: 'Everything is bits',
    body: ['Text, photos, music, video — all stored as bits.',
           'Letters map to numbers (A = 65 in ASCII),',
           'pictures are grids of numeric pixel colors,',
           'sound is thousands of numeric samples per second.',
           'The meaning lives in HOW we read the numbers.'] },
  { title: 'Tracing programs',
    body: ['To know what a program outputs, trace it exactly:',
           'x = 1',
           'repeat 4 times:  x = x * 2',
           'Pass by pass: 2, 4, 8, 16. It prints 16.',
           'Write each step down — memory is a poor scratchpad.',
           'The machine never skips a step; tracers must not either.'] },
  { title: 'Two ways to search',
    body: ['Find one name in a list of 1000:',
           'LINEAR search checks every entry from the top —',
           'up to 1000 checks in the worst case.',
           'BINARY search needs the list SORTED, then jumps to',
           'the middle, throws away the wrong half, repeats.',
           'Each check halves the problem: 1000 → 500 → 250...',
           'Only about 10 checks for 1000 entries. Halving wins.'] },
  { title: 'Comparing algorithms',
    body: ['Two correct algorithms can differ wildly in cost.',
           'Ask: as the input grows, how does the WORK grow?',
           'Linear search: doubling the list doubles the checks.',
           'Binary search: doubling the list adds ONE check.',
           'That gap decides what is instant and what takes hours.',
           'Efficiency is a superpower — measure it in growth.'] }
] };

// ── T-SD016 · Assembly Language Programming (9-10) ─────────────────────
LESSONS['T-SD016'] = { topic: 'Reading the Machine Tongue', pages: [
  { title: 'Registers, not variables',
    body: ['Down at machine level there are no named variables —',
           'only REGISTERS: a handful of tiny, ultra-fast slots',
           'inside the CPU, named R1, R2, R3...',
           'Every calculation happens in registers.',
           'Assembly language is instructions that move and',
           'combine register values, one small step at a time.'] },
  { title: 'MOV, ADD, SUB',
    body: ['MOV R1, 7     put the value 7 into R1',
           'ADD R1, R2    R1 = R1 + R2  (result lands in the first)',
           'SUB R1, 1     R1 = R1 - 1',
           'A register can combine with ITSELF:',
           'ADD R1, R1 doubles R1.',
           'Trace: MOV R1, 3 / ADD R1, R1 / ADD R1, 1 → R1 is 7.'] },
  { title: 'Trace like the machine',
    body: ['Tracing assembly is bookkeeping. Make a column',
           'per register and update it line by line:',
           'MOV R1, 2      R1=2',
           'MOV R2, 6      R1=2  R2=6',
           'ADD R1, R2     R1=8  R2=6',
           'The machine never skips a step. Neither should you —',
           'slow and exact beats fast and wrong.'] },
  { title: 'Compare and jump',
    body: ['Jumps let programs skip or repeat instructions.',
           'CMP R1, 5 compares R1 with 5; a jump reacts:',
           'JLT target   jump to the label if R1 was less',
           'JNZ target   jump if the result was not zero',
           'If a jump is TAKEN, the lines between are skipped.',
           'When tracing, always ask: does this jump fire?',
           'The answer decides which instruction runs next.'] },
  { title: 'Loops from jumps',
    body: ['A loop is just a jump that points BACKWARD:',
           'loop: ADD R1, R2',
           '      SUB R3, 1',
           '      JNZ loop',
           'This adds R2 into R1, once per count in R3 —',
           'and adding the same number over and over is how',
           'simple CPUs build multiplication.',
           'Read the pattern, not just the lines: many short',
           'sequences compute something you already know.'] }
] };

// ── T-SD028 · Operating System Fundamentals (11-12) ────────────────────
LESSONS['T-SD028'] = { topic: 'Processes, Memory, Permissions', pages: [
  { title: 'Processes vs threads',
    body: ['A PROCESS is a running program with its own private',
           'memory space — one crashed process cannot scribble',
           'over another\'s memory.',
           'A THREAD is a lightweight worker INSIDE a process:',
           'several threads share the same memory, each with its',
           'own instruction stream.',
           'Processes isolate; threads cooperate. Browsers use',
           'both: a process per tab, threads within each.'] },
  { title: 'Virtual memory',
    body: ['Programs together often want more memory than the',
           'machine has. The OS fakes it: VIRTUAL MEMORY.',
           'Memory is split into pages; idle pages are quietly',
           'parked on disk (swapped/paged out) and pulled back',
           'when touched again.',
           'Every process believes it has clean, private memory.',
           'The cost: disk is slow — heavy swapping makes the',
           'whole machine crawl (thrashing).'] },
  { title: 'File permissions',
    body: ['Every file carries PERMISSIONS: who may read (r),',
           'write (w) or execute (x) it — set separately for',
           'the file\'s owner, its group, and everyone else.',
           '"access refused" on an existing, healthy file means',
           'permissions, not corruption: you are not on its list.',
           'Least privilege is the rule: grant the minimum',
           'access each user needs, nothing more.'] },
  { title: 'Scheduling',
    body: ['One CPU core runs ONE thing at a time — yet dozens',
           'of processes appear simultaneous.',
           'The SCHEDULER, deep in the kernel, switches the CPU',
           'between them every few milliseconds (context switching),',
           'weighing priorities and fairness.',
           'The illusion of "everything at once" is the scheduler',
           'doing its job faster than you can notice.'] },
  { title: 'Process states and zombies',
    body: ['Process tables list a STATE per process:',
           'R running, S sleeping (waiting for something),',
           'Z zombie — finished, but never cleaned up by its parent.',
           'Reading such tables is diagnosis: what is hogging CPU,',
           'what is stuck asleep, what died and lingers.',
           'The table never lies, even when processes do.'] },
  { title: 'The same OS ideas, every platform',
    body: ['These fundamentals wear different suits:',
           'watch processes with Activity Monitor on macOS,',
           'Task Manager on Windows (Ctrl+Shift+Esc),',
           'System Monitor (or htop) on Linux;',
           'force-quit a stuck app on Mac, End Task on Windows,',
           'kill on Linux — just like the Rogue Process quest.',
           'ps and top are LINUX-native tools that macOS shares;',
           'PowerShell calls its version Get-Process.',
           'Learn the concepts once — the buttons are just skins.'] }
] };

// ── T-SD029 · Cybersecurity Pathways (11-12) ───────────────────────────
LESSONS['T-SD029'] = { topic: 'Know the Attacks, Pick the Shield', pages: [
  { title: 'Phishing: fake bait',
    body: ['PHISHING is a message impersonating someone you trust',
           'to steal credentials. The tell-tale signs:',
           'a sender domain that is slightly WRONG (gr1dmail),',
           'panic language — URGENT! act NOW or lose everything,',
           'and a link demanding your password.',
           'Real services do not ask for passwords by email.',
           'Check the sender. Slow down. Panic is the weapon.'] },
  { title: 'Brute force: the hammer',
    body: ['A BRUTE FORCE attack throws password guesses at a',
           'login — thousands, automated, until one fits.',
           'In the logs it has a signature: a rapid drumbeat of',
           'FAILED logins on one account, seconds apart,',
           'then suddenly a SUCCESS.',
           'Defenses: long passwords, lockouts after repeated',
           'failures, and multi-factor authentication.'] },
  { title: 'Injection: input that executes',
    body: ['INJECTION attacks hide code inside ordinary input.',
           'If a login form glues what you type straight into a',
           'database query, an attacker types query syntax —',
           'the classic \' OR 1=1 trick — and the database',
           'obeys it as if the site itself had asked.',
           'The cure is never trusting input: validate it, and',
           'send data separately from the query (see below).'] },
  { title: 'Reading logs like a guard',
    body: ['Logs are where intrusions become visible.',
           'Scan for patterns, not single lines:',
           'repeated failures (brute force), logins at strange',
           'hours, one account touched from many addresses.',
           'Tools help: grep pulls matching lines, wc -l counts',
           'them — six FAILED lines in six seconds tells a story.',
           'A guard who reads logs daily is rarely surprised.'] },
  { title: 'The defender\'s toolkit',
    body: ['Match each defense to what it defends:',
           'HASHING — store passwords as one-way scrambles',
           '(with salt) so even a stolen database stays unreadable.',
           'LEAST PRIVILEGE — every account gets the minimum',
           'access it needs; a breached intern account should',
           'not open the vault.',
           'PATCHING — update software promptly; most break-ins',
           'exploit holes that were already fixed upstream.'] }
] };

// ── T-SD033 · Software Engineering (11-12) ─────────────────────────────
LESSONS['T-SD033'] = { topic: 'The Software Lifecycle', pages: [
  { title: 'Five phases, one order',
    body: ['Serious software moves through a lifecycle:',
           '1. REQUIREMENTS — learn what is actually needed.',
           '2. DESIGN — plan how to build it.',
           '3. IMPLEMENTATION — write the code.',
           '4. TESTING — try honestly to break it.',
           '5. MAINTENANCE — care for it in the wild.',
           'First learn WHAT, then plan HOW, then build,',
           'then check, then keep it healthy.'] },
  { title: 'Requirements: ask before you build',
    body: ['The most expensive failure is building the wrong thing',
           'beautifully. It happens when nobody asks the client',
           'what they actually need.',
           'Requirements work is interviews, examples and written',
           'agreement on what "done" means — before design begins.',
           'Skip it, and every later phase polishes a mistake.'] },
  { title: 'Acceptance criteria',
    body: ['An acceptance criterion states, testably, when a',
           'feature counts as working. The classic shape:',
           'GIVEN a starting state,',
           'WHEN an action happens,',
           'THEN a specific result follows.',
           'GIVEN a registered user, WHEN they request a password',
           'reset, THEN a reset link arrives by email.',
           'Write these BEFORE coding — they become your tests.'] },
  { title: 'Testing means trying to break it',
    body: ['"It works on my machine" is not testing.',
           'Real testing feeds the code hostile input: empty',
           'fields, huge numbers, wrong types, double-clicks.',
           'The bugs users find on launch day are the tests',
           'nobody wrote the week before.',
           'Test the unhappy paths — the happy path tests itself.'] },
  { title: 'Reading a post-mortem',
    body: ['When a project fails, trace the failure to its phase:',
           'Built the wrong product? Requirements failed.',
           'Right product, wobbly structure? Design failed.',
           'Crashes on real input? Testing was skipped.',
           'Rotted after launch? Maintenance was starved.',
           'Every disaster is a lesson filed under the phase',
           'that got skipped. Read post-mortems; ship fewer of them.'] }
] };

// ── T-SD035 · Building Scalable Applications (11-12) ───────────────────
LESSONS['T-SD035'] = { topic: 'Scaling: Out, Up, Cache, Stateless', pages: [
  { title: 'Two directions to grow',
    body: ['When traffic outgrows a server, you can scale',
           'two ways:',
           'HORIZONTAL (scale out) — add MORE identical machines',
           'and spread the load across them.',
           'VERTICAL (scale up) — make ONE machine mightier:',
           'more RAM, more cores.',
           'Out is flexible and fault-tolerant; up is simpler',
           'but hits a ceiling — there is only so big one box gets.'] },
  { title: 'Load balancing',
    body: ['A LOAD BALANCER stands in front of your servers',
           'and deals incoming requests across them —',
           'like a host seating diners at open tables.',
           'It also notices dead servers and routes around them.',
           'Load balancing is what makes horizontal scaling',
           'actually work: many machines, one front door.'] },
  { title: 'Caching: compute once, reuse',
    body: ['If the SAME query returns identical results hundreds',
           'of times a second, computing it every time is waste.',
           'A CACHE stores the result somewhere fast and serves',
           'the copy until it expires.',
           'It is often the cheapest fix for a drowning database.',
           'The classic trap: stale data — every cache needs',
           'a rule for when to refresh.'] },
  { title: 'Stateless servers',
    body: ['If each server keeps user sessions in its OWN memory,',
           'users get logged out whenever the balancer routes',
           'them to a different machine.',
           'The fix: STATELESS servers — servers hold no per-user',
           'data between requests; session state lives in a',
           'shared store all servers can reach.',
           'Stateless machines are interchangeable: add ten,',
           'remove three, nobody notices.'] },
  { title: 'Diagnose, then scale',
    body: ['Match the remedy to the bottleneck:',
           'Same result computed over and over → add a cache.',
           'All servers busy with real, distinct work → scale out.',
           'One un-splittable machine (often the database)',
           'wheezing → scale up.',
           'Users bounced between servers losing state →',
           'go stateless.',
           'A million requests are not a problem. They are',
           'a design brief.'] }
] };

// ── T-SD036 · Software Architecture (11-12) ────────────────────────────
LESSONS['T-SD036'] = { topic: 'Architectural Styles & Coupling', pages: [
  { title: 'What architecture is',
    body: ['Architecture is the set of decisions that are',
           'EXPENSIVE to change later: how the system splits',
           'into parts and how the parts talk.',
           'You can refactor a function over lunch;',
           'you cannot re-architect a system over lunch.',
           'Choose slowly. Every style is right somewhere',
           'and wrong somewhere else.'] },
  { title: 'Layered',
    body: ['LAYERED architecture stacks the system like a cake:',
           'UI on top, business logic in the middle,',
           'data access at the bottom.',
           'Each layer may only call the layer directly beneath.',
           'Strengths: order, clarity, easy to reason about.',
           'Weakness: a change can ripple through every layer.'] },
  { title: 'Client-server',
    body: ['CLIENT-SERVER splits the world in two:',
           'clients (browsers, apps) ask; a server answers',
           'and guards the shared data.',
           'It is the shape of nearly the whole web.',
           'Centralizing data simplifies truth — and makes',
           'the server the part you must scale and protect.'] },
  { title: 'Monolith vs microservices',
    body: ['A MONOLITH is one codebase, one deploy — simple to',
           'build, test and ship. Ideal for small teams and',
           'young products that must ship THIS month.',
           'MICROSERVICES split the app into many small services,',
           'each built, deployed and scaled independently —',
           'powerful for large organizations, but you inherit',
           'network failures, versioning and ops overhead.',
           'Match the architecture to the team, not the fashion.'] },
  { title: 'Event-driven',
    body: ['In EVENT-DRIVEN systems, components never call each',
           'other directly. They publish events — records of',
           'things that HAPPENED — to a shared bus,',
           'and whoever cares reacts in its own time.',
           'Publishers do not know their subscribers exist.',
           'Superb for loose coupling and adding new reactions;',
           'harder to trace end-to-end when debugging.'] },
  { title: 'Coupling: the silent flaw',
    body: ['COUPLING is how tightly parts depend on each other.',
           'Tight coupling: one service reads another\'s private',
           'database tables — rename a column, and a different',
           'team\'s service explodes.',
           'Healthy designs talk through agreed interfaces only,',
           'hiding internals behind them.',
           'When judging any design, hunt the coupling first:',
           'what breaks if THIS part changes?'] }
] };

// ── T-SD037 · Application Security (11-12) ─────────────────────────────
LESSONS['T-SD037'] = { topic: 'Vulnerabilities and Their Cures', pages: [
  { title: 'Every input is a visitor',
    body: ['Application security starts from one assumption:',
           'every input might be hostile.',
           'Form fields, URLs, uploaded files, cookies —',
           'each is a door where crafted data can arrive.',
           'The habit: validate input, encode output, trust nothing.',
           'Some visitors bring knives.'] },
  { title: 'XSS: cross-site scripting',
    body: ['XSS: an attacker saves a script tag as ordinary',
           'content — a comment, a username — and every browser',
           'that later views the page RUNS it as code.',
           'The victim is not the site; it is every visitor.',
           'Cure: escape/encode user content when displaying it,',
           'so a script tag renders as harmless text',
           'instead of executing.'] },
  { title: 'SQL injection',
    body: ['If code builds queries by gluing user input into',
           'the SQL string, input like  \' OR 1=1 --  becomes',
           'part of the query itself — and the database obeys.',
           'Cure: PARAMETERIZED QUERIES (prepared statements) —',
           'the query with placeholders travels separately from',
           'the user data, so data can never become commands.',
           'It is the single highest-value habit in this codex.'] },
  { title: 'Insecure storage & broken auth',
    body: ['Passwords stored readable (in PLAIN text) turn any',
           'database theft into a catastrophe.',
           'Cure: hash them — one-way, salted — before storing.',
           'Broken authentication: a session token that keeps',
           'working after logout lets anyone who grabbed it',
           'walk right in.',
           'Cure: the server must INVALIDATE tokens on logout',
           'and expire them after inactivity.'] },
  { title: 'The secure development loop',
    body: ['Security is not a feature bolted on at the end;',
           'it is a cycle repeated forever:',
           'write the code → test for vulnerabilities →',
           'fix what you find → verify the fix actually holds.',
           'Then around again, every release.',
           'Teams that run this loop ship boring security news.',
           'Teams that skip it make headlines.'] }
] };

// ── T-SD042 · Web Development Pathways (11-12) ─────────────────────────
LESSONS['T-SD042'] = { topic: 'The Modern Web Ecosystem', pages: [
  { title: 'Front end and back end',
    body: ['Web work splits along the network line:',
           'FRONT END — everything users see and touch:',
           'HTML, CSS, JavaScript running in the browser.',
           'BACK END — everything behind the curtain:',
           'server code, databases, APIs.',
           'A FULL-STACK developer sails both waters,',

           'Frameworks trade freedom for speed and consistency —',

      body: [

        "Work = force x distance. A simple machine cannot shrink the work —",
        "it can only TRADE: use LESS force by pushing over a LONGER distance.",
        "A ramp (inclined plane) is the cleanest example. Lifting straight up is a",
        "short, hard path. Rolling up a ramp is a long, easy path to the same height.",
        "Either way, force times distance comes out the same."
      ],
      example: [
        "Lift a 12 N crate straight up 1 m:   work = 12 x 1 = 12",

        "Check the trade:                     4 N x 3 m = 12. Same work."
      ] },
    { title: 'Levers',
      body: [
        "A lever is a stiff bar resting on a pivot point called the FULCRUM.",
        "Push the LONG side down a big distance and the SHORT side pushes up",
        "hard over a small distance. Crowbars, seesaws, and bottle openers all count.",
        "The trade is the same law: long side = more distance, less force.",
        "How much help you get depends on how the fulcrum splits the bar."
      ],
      example: [
        "Your side of the bar moves 60 cm. The crate side moves 10 cm.",
        "That is a 60 / 10 = 6x force multiplier.",
        "Push with 5 N:  5 x 60 = 300, and 300 / 10 = 30 N of lift."
      ] },
    { title: 'Pulleys and wheel-and-axle',
      body: [

        "comfortable. Add more pulleys and the rope shares the load: less force,",
        "but you must pull more rope. The trade again.",
        "A WHEEL AND AXLE is a big wheel locked to a skinny rod. Turning the wide",
        "wheel is a long easy path; the thin axle twists with serious force.",
        "Doorknobs, steering wheels, and screwdriver handles are all this machine."
      ] },
    { title: 'Spotting them in the wild',
      body: [

        "Rope over a grooved wheel?          PULLEY.",

        "Sloped surface instead of a lift?   INCLINED PLANE (ramp).",
