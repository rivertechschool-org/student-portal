<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fright Space</title>
<style>
  :root { --bg: #000; --fg: #c9c9c9; --dim: #7d7d7d; --err: #ff8a7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  /* the game draws 1280 x 720; the window shows all of it, as large as fits, letterboxed in black */
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9;
    background: #000; outline: none; touch-action: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--dim);
    white-space: pre-wrap; pointer-events: none; }
  #status.err { color: var(--err); background: rgba(0, 0, 0, 0.85); padding: 8px 12px; pointer-events: auto; user-select: text; }
  /* once the game draws, the loading line goes - but an error still shows (the viewer marks it .err) */
  body.ready #status:not(.err) { display: none; }
  #nogpu { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #nogpu div { max-width: 34em; }
  #nogpu h1 { font-size: 22px; margin: 0 0 10px; color: #e0e0e0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="view" width="1280" height="720" tabindex="0"></canvas></div>
<div id="status">Loading Fright Space...</div>
<div id="nogpu"><div>
  <h1>This device can't run Fright Space</h1>
  <p>The game needs WebGPU, which this browser or device doesn't have. It runs in Chrome on most
  Chromebooks and computers from the last few years. Updating Chrome can help.</p>
</div></div>
<script>
  // a plain message instead of a black box where there is no WebGPU
  if (!navigator.gpu) {
    document.getElementById("nogpu").style.display = "flex";
    document.getElementById("wrap").style.display = "none";
    document.getElementById("status").style.display = "none";
  } else {
    // the viewer's parameters for this game, unless the address already gives them
    const q = new URLSearchParams(location.search);
    let changed = false;
    // frames: the viewer's headless-run length (a frame saved at its end, which a browser cannot): never
    for (const [k, v] of [["world", "fright-space"], ["w", "1280"], ["h", "720"], ["frames", "1000000"]]) if (!q.has(k)) { q.set(k, v); changed = true; }
    if (changed) history.replaceState(null, "", location.pathname + "?" + q.toString());
    // keys go to the game from the first click on it (an iframe gets keys only once it has focus)
    const c = document.getElementById("view");
    c.addEventListener("pointerdown", () => c.focus());
    window.addEventListener("load", () => c.focus());
    // the loading line goes once the first frame is drawn (an error after that still shows)
    const t = setInterval(() => { if (window.dr && window.dr.ready) { document.body.classList.add("ready"); clearInterval(t); } }, 250);
    const s = document.createElement("script"); s.type = "module"; s.src = "viewer.js"; document.body.appendChild(s);
  }
</script>
</body>
</html>
