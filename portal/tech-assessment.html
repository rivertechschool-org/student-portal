<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Tech Project Assessment</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#0f1216; --card:#151a21; --card2:#1c2330; --border:#2a3140; --text:#e6edf3;
  --muted:#97a2b0; --accent:#5ac8e0; --good:#8bffb0; --warn:#ffd36a; --danger:#ff6a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;padding:8px 0 14px;flex-wrap:wrap}
header h1{font-size:1.3rem}
header .sub{color:var(--muted);font-size:.83rem}
select{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.9rem}
.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.roster{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;max-height:80vh;overflow-y:auto}
.stu{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;justify-content:space-between;gap:6px}
.stu:hover{background:var(--card2)}
.stu.active{background:var(--accent);color:#04121a;font-weight:600}
.stu .gb{color:var(--muted);font-size:.72rem}
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:6px}
button.save{background:var(--accent);border:none;color:#04121a;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.84rem;font-weight:700}
button.seg{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer;font-size:.78rem;width:34px}
button.seg.on{background:rgba(139,255,176,.15);border-color:var(--good);color:var(--good)}
.chk-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;font-size:.85rem;flex-wrap:wrap}
.chk-row .lbl{flex:1;min-width:200px}
.pipbtns{display:flex;gap:5px}
.hint{color:var(--muted);font-size:.76rem;margin-top:6px}
.chip{display:inline-block;background:var(--card2);border-radius:999px;padding:2px 10px;font-size:.72rem;color:var(--muted);margin-left:6px}
.chip.m{background:rgba(139,255,176,.14);color:var(--good)}
.feed .row{display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;color:var(--muted)}
.denied{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.88rem;display:none;z-index:60}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabbar button{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.85rem}
.tabbar button.active{background:var(--accent);border-color:var(--accent);color:#04121a;font-weight:600}
h2.sec{font-size:.92rem;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="../shared/config.js"></script>
<script src="../shared/tech-data.js"></script>
<script>
'use strict';
const TD = window.TECH_DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.style.borderColor = bad ? 'var(--danger)' : 'var(--border)'; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }

const PROJECT_NODES = Object.values(TD.nodes).filter(n => n.assess.type === 'project');
const CLUSTERS = [...new Set(PROJECT_NODES.map(n => n.cluster))];

const A = { auth:null, supabase:null, me:null, classes:[], classId:null, roster:[], student:null,
            entries:[], cluster:CLUSTERS[0], draft:{} };

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'});
function latestVerified(nodeId){
  return A.entries.find(e => e.node_id === nodeId && e.verified && e.entry_type === 'rubric') || null;
}

(async function init(){
  try {
    A.auth = window.portalAuth;
    await A.auth.initialize();
    if (!A.auth.isAuthenticated()) { deny('Please sign in through the portal first.'); return; }
    const info = A.auth.getUserInfo();
    A.me = info.profile; A.supabase = A.auth.supabase;
    if (!A.me || !['teacher','admin'].includes(A.me.user_type)) { deny('This page is for teachers and admins.'); return; }
    await loadClasses();
    const want = new URLSearchParams(location.search).get('class');
    if (want && A.classes.some(c => String(c.id) === want)) A.classId = want;
    else if (A.classes.length) A.classId = String(A.classes[0].id);
    renderShell();
    if (A.classId) await loadRoster();
  } catch (e) { console.error(e); deny('Failed to load: ' + e.message); }
})();
function deny(msg){ $('app').innerHTML = `<div class="denied"><h2>🤖 Tech Project Assessment</h2><p style="margin-top:10px">${esc(msg)}</p></div>`; }

async function loadClasses(){
  const uid = A.auth.currentUser ? A.auth.currentUser.id : A.me.id;
  let q = A.supabase.from('classes').select('id, name, teacher_id, secondary_teacher_id');
  if (A.me.user_type !== 'admin')
    q = q.or(`teacher_id.eq.${A.me.id},secondary_teacher_id.eq.${A.me.id},teacher_id.eq.${uid},secondary_teacher_id.eq.${uid}`);
  const { data, error } = await q.order('name');
  if (error) throw error;
  A.classes = data || [];
}
async function loadRoster(){
  A.roster = []; A.student = null; A.entries = [];
  renderRoster(); renderMain();
  const { data: enr, error } = await A.supabase.from('class_enrollments')
    .select('student_id').eq('class_id', A.classId).eq('status', 'active');
  if (error) { toast('Roster load failed: ' + error.message, true); return; }
  const ids = [...new Set((enr || []).map(e => e.student_id))];
  if (!ids.length) { renderRoster(); return; }
  const { data: profs, error: e2 } = await A.supabase.from('user_profiles')
    .select('id, full_name, first_name, last_name, grade_level').in('id', ids);
  if (e2) { toast('Profiles load failed: ' + e2.message, true); return; }
  A.roster = (profs || []).map(p => ({ id: p.id, grade: p.grade_level,
    name: p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || 'Student' }))
    .sort((a,b)=> a.name.localeCompare(b.name));
  renderRoster();
}
async function pickStudent(id){
  A.student = A.roster.find(s => s.id === id) || null;
  A.entries = []; A.draft = {};
  renderRoster(); renderMain();
  if (!A.student) return;
  const { data, error } = await A.supabase.from('tech_project_log')
    .select('id, node_id, entry_type, detail, notes, verified, recorded_at')
    .eq('user_id', id).order('recorded_at', { ascending: false }).limit(1000);
  if (error) { toast('History load failed: ' + error.message, true); return; }
  A.entries = data || [];
  renderMain();
}

function renderShell(){
  $('app').innerHTML = `
    <header>
      <h1>🤖 Tech Project Assessment</h1>
      <div class="sub">Rubric-score the hands-on Technology &amp; Robotics work a terminal can't grade</div>
      <select id="class-sel" style="margin-left:auto">${A.classes.map(c=>`<option value="${c.id}" ${String(c.id)===A.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    </header>
    <div class="layout">
      <div class="roster" id="roster"></div>
      <div class="main" id="main"></div>
    </div>`;
  $('class-sel').addEventListener('change', async e => { A.classId = e.target.value; await loadRoster(); });
  renderRoster(); renderMain();
}
function renderRoster(){
  const el = $('roster'); if (!el) return;
  el.innerHTML = A.roster.length
    ? A.roster.map(s => `<div class="stu ${A.student && A.student.id===s.id?'active':''}" onclick="pickStudent('${s.id}')">
        <span>${esc(s.name)}</span><span class="gb">${esc(s.grade || '')}</span></div>`).join('')
    : '<div class="hint" style="padding:8px">No active students in this class.</div>';
}
function renderMain(){
  const el = $('main'); if (!el) return;
  if (!A.student){ el.innerHTML = '<div class="card"><div class="hint">Pick a student. Rubrics you save here are <b>verified evidence</b> — the student\'s skill tree picks them up next time they open GRIDFALL. Scale: 1 beginning · 2 developing · 3 proficient · 4 advanced; mastery = average 3+ with no 1s.</div></div>'; return; }
  const mastered = PROJECT_NODES.filter(n => { const l = latestVerified(n.id); if (!l) return false;
    const sc = l.detail && l.detail.scores || []; const avg = sc.length ? sc.reduce((a,v)=>a+v,0)/sc.length : 0; return avg >= 3 && !sc.some(v=>v<=1); }).length;
  let html = `<div class="card"><h3>${esc(A.student.name)} <span class="chip">${esc(A.student.grade || 'grade ?')}</span>
    <span class="chip m">${mastered}/${PROJECT_NODES.length} project skills mastered</span></h3></div>
    <div class="tabbar">${CLUSTERS.map(c=>`<button class="${A.cluster===c?'active':''}" onclick="setCluster('${esc(c)}')">${esc(c.replace(/^(Robotics|Software|Tech): /,''))}</button>`).join('')}
      <button class="${A.cluster==='__history__'?'active':''}" onclick="setCluster('__history__')">🕘 History</button></div>`;
  html += A.cluster === '__history__' ? rHistory() : rCluster();
  el.innerHTML = html;
}
function setCluster(c){ A.cluster = c; renderMain(); }

function rCluster(){
  let html = '';
  const nodes = PROJECT_NODES.filter(n => n.cluster === A.cluster).sort((a,b)=> a.stage_id - b.stage_id);
  for (const node of nodes){
    const latest = latestVerified(node.id);
    const cur = latest && latest.detail && Array.isArray(latest.detail.scores) ? latest.detail.scores : [];
    if (!A.draft[node.id]) A.draft[node.id] = node.assess.criteria.map((_,i)=> cur[i] != null ? cur[i] : null);
    const d = A.draft[node.id];
    html += `<div class="card"><h3>${esc(node.title)} <span class="chip">${esc(node.grade_band)} · ${esc(node.stage)}</span>${latest?`<span class="chip">last: ${fmtDate(latest.recorded_at)}</span>`:''}</h3>
      <div class="hint" style="margin-bottom:6px">${esc(node.mastery_criteria)}</div>`;
    node.assess.criteria.forEach((c,i)=>{
      html += `<div class="chk-row"><span class="lbl">${esc(c)}</span><span class="pipbtns">${[1,2,3,4].map(v=>
        `<button class="seg ${d[i]===v?'on':''}" onclick="setRub('${node.id}',${i},${v})">${v}</button>`).join('')}</span></div>`;
    });
    html += `<div style="margin-top:8px"><button class="save" onclick="saveRub('${node.id}')">Save rubric</button></div></div>`;
  }
  return html || '<div class="card"><div class="hint">No project nodes in this cluster.</div></div>';
}
function setRub(id, i, v){ A.draft[id][i] = v; renderMain(); }
async function saveRub(id){
  const d = A.draft[id];
  if (d.some(v => v == null)) { toast('Score every criterion first', true); return; }
  const { data, error } = await A.supabase.from('tech_project_log')
    .insert({ user_id: A.student.id, node_id: id, entry_type: 'rubric', detail: { scores: d.slice() },
              verified: true, recorded_by: A.me.id })
    .select('id, node_id, entry_type, detail, notes, verified, recorded_at').single();
  if (error) { toast('Save failed: ' + error.message, true); return; }
  A.entries.unshift(data); toast('Rubric saved'); renderMain();
}
function rHistory(){
  const rows = A.entries.slice(0, 80);
  if (!rows.length) return '<div class="card"><div class="hint">No rubric entries yet for this student.</div></div>';
  return '<div class="card feed"><h3>Recent rubric entries</h3>' + rows.map(e => {
    const n = TD.nodes[e.node_id];
    const sc = e.detail && e.detail.scores || [];
    return `<div class="row"><span>${esc(n ? n.title : e.node_id)}</span><span>[${sc.join(', ')}] · ${fmtDate(e.recorded_at)}</span></div>`;
  }).join('') + '</div>';
}
</script>
</body>
</html>
