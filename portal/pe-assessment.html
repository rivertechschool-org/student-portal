<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 PE Assessment</title>
<link rel="icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
:root{
  --bg:#0f1216; --card:#151a21; --card2:#1c2330; --border:#2a3140; --text:#e6edf3;
  --muted:#97a2b0; --accent:#ff6347; --good:#8bffb0; --info:#6aa9ff; --warn:#ffd36a; --danger:#ff6a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;padding:8px 0 14px;flex-wrap:wrap}
header h1{font-size:1.3rem}
header .sub{color:var(--muted);font-size:.83rem}
select,input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.9rem}
.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.roster{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;max-height:80vh;overflow-y:auto}
.stu{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;justify-content:space-between;gap:6px}
.stu:hover{background:var(--card2)}
.stu.active{background:var(--accent);color:#fff;font-weight:600}
.stu .gb{color:var(--muted);font-size:.72rem}
.stu.active .gb{color:#ffd9d0}
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:6px}
h2.sec{font-size:.92rem;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.metric-row{display:grid;grid-template-columns:minmax(140px,1fr) 110px 130px auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.metric-row:last-child{border-bottom:none}
.metric-row .bm{color:var(--muted);font-size:.76rem}
.metric-row .cur{color:var(--info);font-size:.8rem}
input.val{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 9px;width:100px;font-size:.9rem}
button.save{background:var(--accent);border:none;color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.84rem;font-weight:600}
button.save:disabled{opacity:.5;cursor:default}
button.seg{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer;font-size:.78rem}
button.seg.on{background:rgba(139,255,176,.15);border-color:var(--good);color:var(--good)}
button.seg.on.mid{background:rgba(255,211,106,.14);border-color:var(--warn);color:var(--warn)}
button.seg.on.no{background:var(--card2);border-color:var(--muted);color:var(--text)}
.chk-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;font-size:.85rem;flex-wrap:wrap}
.chk-row .lbl{flex:1;min-width:200px}
.segs{display:flex;gap:5px}
.pipbtns{display:flex;gap:5px}
.pipbtns button{width:34px}
.saved-note{color:var(--good);font-size:.78rem;margin-left:8px}
.hint{color:var(--muted);font-size:.76rem;margin-top:6px}
.chip{display:inline-block;background:var(--card2);border-radius:999px;padding:2px 10px;font-size:.72rem;color:var(--muted);margin-left:6px}
.chip.m{background:rgba(139,255,176,.14);color:var(--good)}
.feed .row{display:flex;justify-content:space-between;font-size:.82rem;padding:4px 0;color:var(--muted)}
.denied{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.88rem;display:none;z-index:60}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabbar button{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.85rem}
.tabbar button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="../shared/config.js"></script>
<script src="../shared/pe-data.js"></script>
<script>
'use strict';
const PE = window.PE_DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.style.borderColor = bad ? 'var(--danger)' : 'var(--border)'; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }

const A = {
  auth: null, supabase: null, me: null,
  classes: [], classId: null, roster: [], student: null,
  entries: [],          // selected student's pe_training_log (all, newest first)
  section: 'fitness',
  draft: {}             // nodeId -> in-progress checklist/rubric scores
};

function bandFromGrade(g){
  const s = String(g == null ? '' : g).trim().toLowerCase();
  if (/^(k|tk|pre)/.test(s)) return 'K-2';
  const m = s.match(/\d+/); if (!m) return null; const n = +m[0];
  return n <= 2 ? 'K-2' : n <= 5 ? '3-5' : n <= 8 ? '6-8' : n <= 10 ? '9-10' : '11-12';
}
function fmtVal(node, v){
  if (v == null) return '—';
  if (node.assess.input === 'time') { const m = Math.floor(v/60), s = Math.round(v%60); return m ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`; }
  if (node.assess.input === 'decimal') return v.toFixed(1) + ' ' + node.assess.unit;
  return v + ' ' + node.assess.unit;
}
function parseVal(node, raw){
  raw = String(raw).trim(); if (!raw) return null;
  if (node.assess.input === 'time' && raw.includes(':')) {
    const p = raw.split(':').map(Number); if (p.some(isNaN)) return null;
    return p.length === 2 ? p[0]*60 + p[1] : null;
  }
  const v = parseFloat(raw); return isNaN(v) || v < 0 || v > 100000 ? null : v;
}
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'});
const nodesByType = t => Object.values(PE.nodes).filter(n => n.assess.type === t);
function latestVerified(nodeId, type){
  return A.entries.find(e => e.node_id === nodeId && e.verified && e.entry_type === type) || null;
}
function bestVerified(node){
  const dir = node.assess.direction;
  const vs = A.entries.filter(e => e.node_id === node.id && e.verified && e.entry_type === 'measurement' && e.value != null).map(e => e.value);
  return vs.length ? vs.reduce((a,v)=> (dir==='lower' ? v<a : v>a) ? v : a, vs[0]) : null;
}

// ============ Boot ============
(async function init(){
  try {
    A.auth = window.portalAuth;
    await A.auth.initialize();
    if (!A.auth.isAuthenticated()) { deny('Please sign in through the portal first.'); return; }
    const info = A.auth.getUserInfo();
    A.me = info.profile; A.supabase = A.auth.supabase;
    if (!A.me || !['teacher','admin'].includes(A.me.user_type)) { deny('This page is for teachers and admins.'); return; }
    await loadClasses();
    const want = new URLSearchParams(location.search).get('class');
    if (want && A.classes.some(c => String(c.id) === want)) A.classId = want;
    else if (A.classes.length) A.classId = String(A.classes[0].id);
    renderShell();
    if (A.classId) await loadRoster();
  } catch (e) {
    console.error(e); deny('Failed to load: ' + e.message);
  }
})();
function deny(msg){ $('app').innerHTML = `<div class="denied"><h2>🏃 PE Assessment</h2><p style="margin-top:10px">${esc(msg)}</p></div>`; }

async function loadClasses(){
  const uid = A.auth.currentUser ? A.auth.currentUser.id : A.me.id;
  let q = A.supabase.from('classes').select('id, name, teacher_id, secondary_teacher_id');
  if (A.me.user_type !== 'admin') {
    q = q.or(`teacher_id.eq.${A.me.id},secondary_teacher_id.eq.${A.me.id},teacher_id.eq.${uid},secondary_teacher_id.eq.${uid}`);
  }
  const { data, error } = await q.order('name');
  if (error) throw error;
  A.classes = data || [];
}
async function loadRoster(){
  A.roster = []; A.student = null; A.entries = [];
  renderRoster(); renderMain();
  const { data: enr, error } = await A.supabase.from('class_enrollments')
    .select('student_id').eq('class_id', A.classId).eq('status', 'active');
  if (error) { toast('Roster load failed: ' + error.message, true); return; }
  const ids = [...new Set((enr || []).map(e => e.student_id))];
  if (!ids.length) { renderRoster(); return; }
  const { data: profs, error: e2 } = await A.supabase.from('user_profiles')
    .select('id, full_name, first_name, last_name, grade_level').in('id', ids);
  if (e2) { toast('Profiles load failed: ' + e2.message, true); return; }
  A.roster = (profs || []).map(p => ({
    id: p.id,
    name: p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || 'Student',
    grade: p.grade_level, band: bandFromGrade(p.grade_level) || '6-8'
  })).sort((a,b)=> a.name.localeCompare(b.name));
  renderRoster();
}
async function pickStudent(id){
  A.student = A.roster.find(s => s.id === id) || null;
  A.entries = []; A.draft = {};
  renderRoster(); renderMain();
  if (!A.student) return;
  const { data, error } = await A.supabase.from('pe_training_log')
    .select('id, node_id, entry_type, value, unit, detail, notes, verified, recorded_at')
    .eq('user_id', id).order('recorded_at', { ascending: false }).limit(2000);
  if (error) { toast('History load failed: ' + error.message, true); return; }
  A.entries = data || [];
  renderMain();
}
async function insertEntry(nodeId, entry_type, value, unit, detail, notes){
  const row = { user_id: A.student.id, node_id: nodeId, entry_type,
    value: value == null ? null : value, unit: unit || null,
    detail: detail || {}, notes: notes || null, verified: true, recorded_by: A.me.id };
  const { data, error } = await A.supabase.from('pe_training_log').insert(row)
    .select('id, node_id, entry_type, value, unit, detail, notes, verified, recorded_at').single();
  if (error) { toast('Save failed: ' + error.message, true); return false; }
  A.entries.unshift(data);
  return true;
}

// ============ Render ============
function renderShell(){
  $('app').innerHTML = `
    <header>
      <h1>🏃 PE Assessment</h1>
      <div class="sub">Record verified fitness tests, movement checklists &amp; sport rubrics</div>
      <select id="class-sel" style="margin-left:auto">${A.classes.map(c=>`<option value="${c.id}" ${String(c.id)===A.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    </header>
    <div class="layout">
      <div class="roster" id="roster"></div>
      <div class="main" id="main"></div>
    </div>`;
  $('class-sel').addEventListener('change', async e => { A.classId = e.target.value; await loadRoster(); });
  renderRoster(); renderMain();
}
function renderRoster(){
  const el = $('roster'); if (!el) return;
  el.innerHTML = A.roster.length
    ? A.roster.map(s => `<div class="stu ${A.student && A.student.id===s.id?'active':''}" onclick="pickStudent('${s.id}')">
        <span>${esc(s.name)}</span><span class="gb">${esc(s.grade || '')}</span></div>`).join('')
    : '<div class="hint" style="padding:8px">No active students in this class.</div>';
}
function renderMain(){
  const el = $('main'); if (!el) return;
  if (!A.student) { el.innerHTML = '<div class="card"><div class="hint">Pick a student from the roster to record assessments. Entries you save here are <b>verified</b> — they count toward skill mastery in the student\'s Training Log.</div></div>'; return; }
  const SECS = [['fitness','💪 Fitness Tests'],['skills','🤸 Movement Checklists'],['sports','⚽ Sport Rubrics'],['plan','📋 Plan Review'],['history','🕘 History']];
  let html = `<div class="card"><h3>${esc(A.student.name)} <span class="chip">${esc(A.student.grade || 'grade ?')} → band ${A.student.band}</span></h3>
    <div class="hint">Benchmarks below are the ${A.student.band} standards. All saves are verified assessments dated today.</div></div>
    <div class="tabbar">${SECS.map(([k,l])=>`<button class="${A.section===k?'active':''}" onclick="setSection('${k}')">${l}</button>`).join('')}</div>`;
  html += ({fitness:rFitness, skills:rChecklists, sports:rRubrics, plan:rPlan, history:rHistory})[A.section]();
  el.innerHTML = html;
}
function setSection(s){ A.section = s; renderMain(); }

function rFitness(){
  let html = '<div class="card"><h3>Fitness measures</h3>';
  for (const node of nodesByType('metric')){
    const bm = node.assess.benchmarks[A.student.band];
    const best = bestVerified(node);
    const ph = node.assess.input === 'time' ? 'mm:ss or sec' : node.assess.unit;
    html += `<div class="metric-row">
      <div>${esc(node.title)}<div class="cur">best: ${fmtVal(node, best)}</div></div>
      <div class="bm">${bm ? `meets ${fmtVal(node,bm[0])}<br>exceeds ${fmtVal(node,bm[1])}` : 'no standard<br>for this band'}</div>
      <div><input class="val" id="m-${node.id}" placeholder="${ph}"></div>
      <div><button class="save" onclick="saveMetric('${node.id}')">Record</button><span class="saved-note" id="ok-${node.id}"></span></div>
    </div>`;
  }
  html += '<div class="hint">Recording a result at or above "meets" masters the skill in the student\'s Training Log (their page syncs when they next open it).</div></div>';
  return html;
}
async function saveMetric(id){
  const node = PE.nodes[id];
  const v = parseVal(node, $('m-'+id).value);
  if (v == null) { toast('Enter a valid ' + (node.assess.input==='time'?'time':'number'), true); return; }
  if (await insertEntry(id, 'measurement', v, node.assess.unit, {}, null)) {
    $('m-'+id).value=''; $('ok-'+id).textContent = '✓ ' + fmtVal(node, v); toast('Recorded');
  }
}

function rChecklists(){
  const LBL = ['Not yet','Emerging','Consistent'];
  let html = '';
  for (const node of nodesByType('checklist')){
    const latest = latestVerified(node.id, 'checklist');
    const cur = latest && latest.detail && Array.isArray(latest.detail.items) ? latest.detail.items : [];
    if (!A.draft[node.id]) A.draft[node.id] = node.assess.items.map((_,i)=> cur[i] != null ? cur[i] : null);
    const d = A.draft[node.id];
    html += `<div class="card"><h3>${esc(node.title)} <span class="chip">${esc(node.grade_band)}</span>${latest?`<span class="chip">last: ${fmtDate(latest.recorded_at)}</span>`:''}</h3>`;
    node.assess.items.forEach((it,i)=>{
      html += `<div class="chk-row"><span class="lbl">${esc(it)}</span><span class="segs">${LBL.map((l,v)=>
        `<button class="seg ${d[i]===v?('on'+(v===1?' mid':v===0?' no':'')):''}" onclick="setChk('${node.id}',${i},${v})">${l}</button>`).join('')}</span></div>`;
    });
    html += `<div style="margin-top:8px"><button class="save" onclick="saveChk('${node.id}')">Save checklist</button><span class="saved-note" id="ok-${node.id}"></span></div></div>`;
  }
  return html;
}
function setChk(id, i, v){ A.draft[id][i] = v; renderMain(); }
async function saveChk(id){
  const node = PE.nodes[id]; const d = A.draft[id];
  if (d.some(v => v == null)) { toast('Score every item first', true); return; }
  if (await insertEntry(id, 'checklist', null, null, {items: d.slice()}, null)) {
    toast('Checklist saved'); renderMain();
  }
}

function rRubrics(){
  let html = '<div class="hint" style="margin-bottom:10px">1 = beginning · 2 = developing · 3 = proficient · 4 = advanced. Mastery = average 3+ with no 1s.</div>';
  for (const node of nodesByType('rubric')){
    const latest = latestVerified(node.id, 'rubric');
    const cur = latest && latest.detail && Array.isArray(latest.detail.scores) ? latest.detail.scores : [];
    if (!A.draft[node.id]) A.draft[node.id] = node.assess.criteria.map((_,i)=> cur[i] != null ? cur[i] : null);
    const d = A.draft[node.id];
    html += `<div class="card"><h3>${esc(node.title)} <span class="chip">${esc(node.grade_band)}</span>${latest?`<span class="chip">last: ${fmtDate(latest.recorded_at)}</span>`:''}</h3>`;
    node.assess.criteria.forEach((c,i)=>{
      html += `<div class="chk-row"><span class="lbl">${esc(c)}</span><span class="pipbtns">${[1,2,3,4].map(v=>
        `<button class="seg ${d[i]===v?'on':''}" onclick="setRub('${node.id}',${i},${v})">${v}</button>`).join('')}</span></div>`;
    });
    html += `<div style="margin-top:8px"><button class="save" onclick="saveRub('${node.id}','rubric')">Save rubric</button></div></div>`;
  }
  return html;
}
function setRub(id, i, v){ A.draft[id][i] = v; renderMain(); }
async function saveRub(id, type){
  const d = A.draft[id];
  if (d.some(v => v == null)) { toast('Score every criterion first', true); return; }
  if (await insertEntry(id, type, null, null, {scores: d.slice()}, null)) { toast('Rubric saved'); renderMain(); }
}

function rPlan(){
  const node = PE.nodes['P14'];
  const latest = latestVerified('P14', 'plan_review');
  const cur = latest && latest.detail && Array.isArray(latest.detail.scores) ? latest.detail.scores : [];
  if (!A.draft['P14']) A.draft['P14'] = node.assess.criteria.map((_,i)=> cur[i] != null ? cur[i] : null);
  const d = A.draft['P14'];
  let html = `<div class="card"><h3>${esc(node.title)} — plan review${latest?`<span class="chip">last: ${fmtDate(latest.recorded_at)}</span>`:''}</h3>
    <div class="hint" style="margin-bottom:8px">Score the student's submitted personal fitness plan. Approval (avg 3+, no 1s) plus a passed planning quiz masters the capstone.</div>`;
  node.assess.criteria.forEach((c,i)=>{
    html += `<div class="chk-row"><span class="lbl">${esc(c)}</span><span class="pipbtns">${[1,2,3,4].map(v=>
      `<button class="seg ${d[i]===v?'on':''}" onclick="setRub('P14',${i},${v})">${v}</button>`).join('')}</span></div>`;
  });
  html += `<div style="margin-top:8px"><button class="save" onclick="saveRub('P14','plan_review')">Save plan review</button></div></div>`;
  return html;
}

function rHistory(){
  const rows = A.entries.slice(0, 60);
  if (!rows.length) return '<div class="card"><div class="hint">No entries yet for this student.</div></div>';
  return '<div class="card feed"><h3>Recent entries</h3>' + rows.map(e => {
    const n = PE.nodes[e.node_id];
    const what = e.entry_type === 'measurement' && n ? fmtVal(n, e.value) : e.entry_type;
    return `<div class="row"><span>${esc(n ? n.title : e.node_id)} ${e.verified?'<span class="chip m">verified</span>':'<span class="chip">self-log</span>'}</span>
      <span>${esc(what)} · ${fmtDate(e.recorded_at)}</span></div>`;
  }).join('') + '</div>';
}
</script>
</body>
</html>
