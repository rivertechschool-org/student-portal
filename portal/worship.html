<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Worship / Band</title>
<link rel="icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
:root{
  --bg:#0f1216; --card:#151a21; --card2:#1c2330; --border:#2a3140; --text:#e6edf3;
  --muted:#97a2b0; --accent:#9b6aff; --good:#8bffb0; --info:#6aa9ff; --warn:#ffd36a; --danger:#ff6a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px;flex-wrap:wrap}
header h1{font-size:1.35rem}
header .sub{color:var(--muted);font-size:.83rem}
header .spacer{flex:1}
a.back{color:var(--muted);text-decoration:none;font-size:.85rem;border:1px solid var(--border);padding:6px 12px;border-radius:8px}
a.back:hover{color:var(--text);border-color:var(--muted)}
input,select,textarea{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.9rem;font-family:inherit;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
label.fld{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hint{color:var(--muted);font-size:.78rem;margin-bottom:10px}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabbar button{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.88rem}
.tabbar button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.badge{display:inline-block;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px;font-size:.7rem;margin-left:6px;font-weight:700}
button.btn{background:var(--accent);border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600}
button.btn.sec{background:var(--card2);border:1px solid var(--border);color:var(--text);font-weight:500}
button.btn.danger{background:var(--danger)}
button.btn.good{background:#1f7a4d}
button.btn.small{padding:4px 10px;font-size:.78rem}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 8px}
td{padding:8px 8px;border-top:1px solid var(--border);vertical-align:middle}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:.75rem;color:var(--muted);margin:2px 4px 2px 0}
.chip.on{background:rgba(155,106,255,.16);border-color:var(--accent);color:#d7c4ff}
.chip.lead{background:rgba(255,211,106,.14);border-color:var(--warn);color:var(--warn)}
.chip.me{background:rgba(139,255,176,.14);border-color:var(--good);color:var(--good)}
.pick{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;margin:0 6px 6px 0;color:var(--text);font-family:inherit;line-height:1.3}
.pick.on{background:rgba(155,106,255,.18);border-color:var(--accent)}
.pick:hover{border-color:var(--accent)}
.svc{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.svc.mine{border-color:var(--good)}
.svc .when{font-weight:700;font-size:.95rem}
.svc .type{color:var(--muted);font-size:.8rem}
.sub-h{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.empty{color:var(--muted);font-size:.85rem;padding:10px 0}
.denied{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.88rem;display:none;z-index:60}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:20px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:620px;width:100%;margin:auto;padding:18px}
.modal h3{font-size:1.05rem;margin-bottom:12px}
.modal .close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
pre.chart{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.82rem;white-space:pre-wrap;overflow-x:auto;max-height:50vh}
.chart-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;max-height:55vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.35}
.chart-chords{color:var(--accent);font-weight:700;white-space:pre}
.chart-lyric{white-space:pre;color:var(--text)}
.chart-section{color:var(--warn);font-weight:700;margin:12px 0 4px;letter-spacing:.04em;text-transform:uppercase;font-size:.75rem}
.chart-section:first-child{margin-top:0}
.keybar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.keybar button{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:.78rem;cursor:pointer;font-family:inherit}
.keybar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* Schedule: type list -> the next two weeks -> one plan */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none;font-size:.85rem}
.crumb a:hover{color:var(--text)}
.crumb .sep{color:var(--border)}
.trow,.drow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card2);margin-bottom:8px;cursor:pointer;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.trow:hover,.drow:hover{border-color:var(--accent)}
.trow .grow,.drow .grow{flex:1;min-width:0}
.trow .name{font-weight:700;font-size:.98rem}
.trow .meta,.drow .meta{color:var(--muted);font-size:.78rem;margin-top:2px}
.drow .date{font-weight:700;font-size:.92rem}
.drow.today{border-color:var(--good)}
.drow.unplanned{background:transparent;border-style:dashed}
.chev{color:var(--muted);font-size:1.1rem}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.7rem;font-weight:700;letter-spacing:.03em}
.tag.today{background:rgba(139,255,176,.16);color:var(--good)}
.tag.draft{background:rgba(255,211,106,.16);color:var(--warn)}
.tag.live{background:rgba(106,169,255,.16);color:var(--info)}
.tag.none{background:var(--card2);color:var(--muted)}
.tag.yes{background:rgba(139,255,176,.16);color:var(--good)}
.tag.no{background:rgba(255,106,106,.16);color:var(--danger)}
.tag.wait{background:var(--card2);color:var(--muted)}
.planhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:6px}
.planhead h2{font-size:1.25rem}
.planhead .when2{color:var(--muted);font-size:.85rem;margin-top:2px}
.pos{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.pos:last-child{border-bottom:none}
.pos .label{width:120px;color:var(--muted);font-size:.82rem;flex-shrink:0}
.pos .people{flex:1;min-width:180px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:.82rem}
.person.me{border-color:var(--good)}
.person .x{color:var(--muted);cursor:pointer;text-decoration:none}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item .num{color:var(--muted);font-size:.78rem;width:18px;flex-shrink:0}
.item .t{flex:1;min-width:0}
.item .t a{color:var(--text);text-decoration:none;font-weight:600;font-size:.9rem}
.item .t a:hover{color:var(--accent)}
.item .sub{color:var(--muted);font-size:.75rem}
.item .ord{display:flex;gap:2px}
.item .ord button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0 3px;font-family:inherit}
.item .ord button:hover{color:var(--text)}
.filerow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.filerow:last-child{border-bottom:none}
.filerow a{color:var(--info);text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.songrow:last-child{border-bottom:none}
.songrow:hover{background:var(--card2)}
.songrow .t{flex:1;min-width:0}
.songrow .t .ti{font-weight:600;font-size:.9rem}
.songrow .t .ar{color:var(--muted);font-size:.76rem}
.songrow .meta{color:var(--muted);font-size:.75rem;white-space:nowrap}
@media (max-width:640px){
  th:nth-child(2),td:nth-child(2){display:none}
  .wrap{padding:12px}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="../shared/config.js"></script>
<script>
'use strict';

// ============================================================================
// Worship / Band
//
// Named for both jobs: the worship team, and band work that has nothing to do
// with a service. The file, the tables and the is_worship_admin column keep
// their original names - they are already deployed, and renaming them buys
// nothing a reader of this comment does not now know.
//
// One page for the whole team, opened from the More launcher on the Portal tab
// of both the student and the teacher portals. Four audiences read it:
//
//   * someone who is not on the team  -> the join form, and the state of the
//     request they already sent;
//   * a member                        -> the roster, the song library, and the
//     schedule with their own slots picked out;
//   * a team admin                    -> everything above plus the requests
//     queue, the roster controls, the library, and the scheduler;
//   * a school admin                  -> a team admin automatically. That is
//     a rule of the database, not of this file: is_worship_admin() says so, and
//     every policy on every worship_* table asks it. The `A.isAdmin` flag here
//     only decides which controls are DRAWN.
//
// Names are the one thing this page cannot read straight off the tables. A
// student may not select another student's user_profiles row, so the roster and
// the requests queue come back through two security-definer functions that
// return names and nothing else. Slot rows hold a user_id and are always a
// member, so they resolve against the roster already in memory.
// ============================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, bad){
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = bad ? 'var(--danger)' : 'var(--border)';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 2800);
}

// Today HERE, not in UTC. From late afternoon on, toISOString() is already
// tomorrow, and a schedule that defaults to tomorrow is a schedule nobody
// trusts. Same rule as _localDateStr in the portal.
function localDateStr(d = new Date()){
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// A yyyy-mm-dd string is a calendar day, not an instant: parse the parts rather
// than letting Date read it as UTC midnight and shift it a day backwards.
function dateFromStr(s){
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function fmtDate(s){
  const d = dateFromStr(s);
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(t){
  if (!t) return '';
  const [h, m] = String(t).split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m ? `${h12}:${String(m).padStart(2, '0')}${ampm}` : `${h12}${ampm}`;
}

// The four instruments the team plays. Adding a fifth is this list plus nothing
// else: the join form, the roster chips and the slot picker all read it.
const INSTRUMENTS = [
  { id: 'piano',   label: 'Piano',   icon: '🎹' },
  { id: 'guitar',  label: 'Guitar',  icon: '🎸' },
  { id: 'cajon',   label: 'Cajón',   icon: '🥁' },
  { id: 'singing', label: 'Singing', icon: '🎤' }
];
// =========================================================================
// Nashville charts
//
// A chart is stored ONCE, in no key at all. Chords are written as scale
// degrees inline in the lyric, exactly where they fall:
//
//     /Chorus
//     He 1picked me up, and 2turned me around
//     And 1/3placed my feet on 4solid ground
//
// That is the notation the lyric-slides app uses, and the reason these charts
// can be read in any key: 1 is the key's own chord, 4 is the fourth, and the
// player reads the letters for whichever key the band is actually in. Storing
// twelve transposed copies of a song is how that goes wrong.
//
// The whole vocabulary, from every song in the library:
//   1-7      a degree; its quality comes from the major scale, so 1, 4 and 5
//            are major, 2, 3 and 6 minor, 7 diminished
//   3maj     "maj" forces major on a degree that would otherwise be minor -
//            the borrowed III of "He Reigns"
//   1/3      a slash chord: the 1 chord with the third degree in the bass
//   /Chorus  a line beginning with / is a section heading, not a lyric
// Everything else on a line is lyric, including any letter that happens to
// follow a digit ("1mountain" is the 1 chord over the word "mountain").
// =========================================================================

// Twelve keys, each spelled the way that key is written rather than by
// pitch number - a chart in Eb must read Ab, never G#.
const KEY_SCALES = {
  'C':  ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
  'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
  'D':  ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
  'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
  'E':  ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
  'F':  ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
  'Gb': ['Gb', 'Ab', 'Bb', 'Cb', 'Db', 'Eb', 'F'],
  'G':  ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
  'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
  'A':  ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
  'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
  'B':  ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#']
};
const KEYS = Object.keys(KEY_SCALES);
// What people write when they mean one of the twelve above.
const KEY_ALIASES = { 'C#': 'Db', 'D#': 'Eb', 'F#': 'Gb', 'G#': 'Ab', 'A#': 'Bb',
                      'Cb': 'B', 'Fb': 'E', 'E#': 'F', 'B#': 'C' };
// Quality of each degree in a major key. "maj" in the chart overrides it.
const DEGREE_QUALITY = ['', 'm', 'm', '', '', 'm', 'dim'];

function normaliseKey(k){
  if (!k) return null;
  const t = String(k).trim().replace(/\s+.*$/, '');
  const up = t.charAt(0).toUpperCase() + t.slice(1);
  if (KEY_SCALES[up]) return up;
  if (KEY_ALIASES[up]) return KEY_ALIASES[up];
  return null;
}

// One degree token -> the chord as played in `key`.
function chordFor(degree, forceMajor, key){
  const scale = KEY_SCALES[key] || KEY_SCALES.C;
  const root = scale[degree - 1];
  return root + (forceMajor ? '' : DEGREE_QUALITY[degree - 1]);
}

// Split one line into { text, chords: [{ at, name }] }, where `at` is the
// index in the finished lyric text that the chord sits above.
function parseChartLine(line, key){
  const chords = [];
  let text = '';
  let i = 0;
  while (i < line.length) {
    const m = /^([1-7])(maj)?(?:\/([1-7])(maj)?)?/.exec(line.slice(i));
    if (m) {
      let name = chordFor(+m[1], !!m[2], key);
      if (m[3]) {
        // A slash chord names a bass NOTE, so the quality of the lower
        // degree is not written - 1/3 in C is C/E, never C/Em.
        name += '/' + (KEY_SCALES[key] || KEY_SCALES.C)[+m[3] - 1];
      }
      chords.push({ at: text.length, name });
      i += m[0].length;
    } else {
      text += line[i];
      i++;
    }
  }
  return { text, chords };
}

// Lay the chords out on their own line above the lyric, monospaced so the
// two line up. A chord that would collide with the one before it is pushed
// right by a space rather than overwriting it.
function renderChartLine(line, key){
  const { text, chords } = parseChartLine(line, key);
  if (!chords.length) return { chordLine: '', lyricLine: text };

  let chordLine = '';
  for (const c of chords) {
    if (c.at > chordLine.length) chordLine += ' '.repeat(c.at - chordLine.length);
    else if (chordLine.length) chordLine += ' ';
    chordLine += c.name;
  }
  return { chordLine, lyricLine: text };
}

// The whole chart, as HTML.
function renderChart(chart, key){
  const lines = String(chart || '').split('\n');
  const out = [];
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (/^\//.test(line)) {
      const label = line.slice(1).trim();
      out.push(label.toLowerCase() === 'blank'
        ? '<div style="height:10px"></div>'
        : `<div class="chart-section">${esc(label)}</div>`);
      continue;
    }
    if (!line.trim()) { out.push('<div style="height:10px"></div>'); continue; }
    const { chordLine, lyricLine } = renderChartLine(line, key);
    out.push(
      (chordLine ? `<div class="chart-chords">${esc(chordLine)}</div>` : '') +
      `<div class="chart-lyric">${esc(lyricLine)}</div>`
    );
  }
  return out.join('');
}

// A pill is a button that remembers, in its own class list, whether it is on.
//
// It was a <label> wrapping a hidden checkbox, which does not work: clicking the
// label runs the handler once, and then the browser's own label behaviour
// dispatches a second click on the input, which bubbles back up to the label and
// runs the handler AGAIN. Every pill therefore turned itself on and straight
// back off, so no instrument could ever be changed. A button has no second act.
function pill(id, label, on){
  return `<button type="button" class="pick ${on ? 'on' : ''}" id="${id}"` +
         ` aria-pressed="${on ? 'true' : 'false'}" onclick="togglePill(this)">${label}</button>`;
}
function togglePill(el){
  const on = !el.classList.contains('on');
  el.classList.toggle('on', on);
  el.setAttribute('aria-pressed', on ? 'true' : 'false');
}
function pillOn(id){
  const el = $(id);
  return !!el && el.classList.contains('on');
}

function instrLabel(id){
  const i = INSTRUMENTS.find(x => x.id === id);
  return i ? `${i.icon} ${i.label}` : id;
}

const A = {
  auth: null, supabase: null, me: null,
  isAdmin: false,          // team admin: school admin, or flagged on the roster
  member: null,            // my own worship_members row, if any
  myRequest: null,         // my latest worship_join_requests row, if any
  roster: [], rosterById: {},
  requests: [],
  songs: [],
  types: [],
  services: [],
  slots: {}, songLinks: {}, files: {},   // serviceId -> rows
  filesUnavailable: false,   // set when the practice-files table is not there yet
  directory: null,         // lazily loaded, admin only
  tab: 'schedule',
  openService: null, _openType: null,
  loaded: { songs: false, schedule: false, requests: false }
};

// ---------------------------------------------------------------- boot ----
(async function init(){
  try {
    A.auth = window.portalAuth;
    await A.auth.initialize();
    if (!A.auth.isAuthenticated()) { deny('Please sign in through the portal first.'); return; }

    const info = A.auth.getUserInfo();
    A.me = info.profile;
    A.supabase = A.auth.supabase;

    if (!A.me) { deny('Your profile could not be loaded. Sign out and back in, or ask a teacher.'); return; }
    if (!['student', 'teacher', 'admin'].includes(A.me.user_type)) {
      deny('Worship / Band is for students and staff.');
      return;
    }

    await loadCore();
    if (!A.member && !A.isAdmin) A.tab = 'team';
    await go(A.tab);
  } catch (e) {
    console.error(e);
    deny('Failed to load: ' + (e.message || e));
  }
})();

function deny(msg){
  $('app').innerHTML = `<div class="denied"><h2>🎵 Worship / Band</h2><p style="margin-top:10px">${esc(msg)}</p>
    <p style="margin-top:14px"><a class="back" href="./index.html">← Back to the portal</a></p></div>`;
}

// The roster and my own two rows. Everything else waits for its tab.
async function loadCore(){
  const [rosterRes, memberRes, reqRes] = await Promise.all([
    A.supabase.rpc('worship_roster'),
    A.supabase.from('worship_members').select('*').eq('user_id', A.me.id).maybeSingle(),
    A.supabase.from('worship_join_requests').select('*').eq('user_id', A.me.id)
      .order('created_at', { ascending: false }).limit(1)
  ]);

  if (rosterRes.error) throw rosterRes.error;
  A.roster = rosterRes.data || [];
  A.rosterById = {};
  A.roster.forEach(r => { A.rosterById[r.user_id] = r; });

  A.member = memberRes.data || null;
  A.myRequest = (reqRes.data && reqRes.data[0]) || null;

  // A school admin is a team admin without being on the roster at all - they
  // may never play, and still have to run the team.
  A.isAdmin = A.me.user_type === 'admin' || !!(A.member && A.member.is_worship_admin);
}

// --------------------------------------------------------------- shell ----
function render(){
  const who = `${A.me.first_name || ''} ${A.me.last_name || ''}`.trim();
  const standing = A.isAdmin ? 'Team admin' : (A.member ? 'Team member' : 'Not on the team yet');
  const pending = A.isAdmin ? A.requests.filter(r => r.status === 'pending').length : 0;

  $('app').innerHTML = `
    <header>
      <div>
        <h1>🎵 Worship / Band</h1>
        <div class="sub">${esc(who)} · ${esc(standing)}</div>
      </div>
      <div class="spacer"></div>
      <a class="back" href="./index.html">← Portal</a>
    </header>

    <div class="tabbar">
      <button class="${A.tab === 'schedule' ? 'active' : ''}" onclick="go('schedule')">📅 Schedule</button>
      <button class="${A.tab === 'songs' ? 'active' : ''}" onclick="go('songs')">🎼 Songs</button>
      <button class="${A.tab === 'team' ? 'active' : ''}" onclick="go('team')">👥 Team</button>
      ${A.isAdmin ? `<button class="${A.tab === 'requests' ? 'active' : ''}" onclick="go('requests')">📥 Requests${
        pending ? `<span class="badge">${pending}</span>` : ''}</button>` : ''}
    </div>

    <div id="tab-body"></div>
  `;
  renderTab();
}

async function go(tab){
  // Pressing the Schedule tab while already inside a plan means "take me back
  // out", not "stay where I was".
  if (tab === 'schedule' && A.tab === 'schedule') { A.openService = null; A._openType = null; }
  A.tab = tab;
  // Each tab fetches once, then keeps what it has until something changes it.
  try {
    if (tab === 'songs' && !A.loaded.songs) await loadSongs();
    if (tab === 'schedule' && !A.loaded.schedule) await loadSchedule();
    if (tab === 'requests' && !A.loaded.requests) await loadRequests();
  } catch (e) {
    console.error(e);
    toast('Could not load that tab: ' + (e.message || e), true);
  }
  render();
}

function renderTab(){
  const body = $('tab-body');
  if (!body) return;
  if (A.tab === 'team') {
    body.innerHTML = teamTab();
    // The directory results live below a search box that survives the render;
    // redraw them so an add does not appear to clear the search.
    if (A.isAdmin && (A._dirQuery || '').trim().length >= 2) renderDirectory();
  }
  else if (A.tab === 'songs') body.innerHTML = songsTab();
  else if (A.tab === 'schedule') body.innerHTML = scheduleTab();
  else if (A.tab === 'requests') body.innerHTML = requestsTab();
}

  });

// `key` is the key to open in. The schedule passes the key the song is
// actually being played in that day, which is the whole point: you press the
// song on the rota and the chart is already in the right key.
function openSong(id, key){
  const s = A.songs.find(x => x.id === id);
  if (!s) return;
  A._chartSong = id;
  A._chartKey = normaliseKey(key) || normaliseKey(s.default_key) || 'C';
  drawSongModal();
}

function setChartKey(key){
  A._chartKey = key;
  drawSongModal();
}

function drawSongModal(){
  const s = A.songs.find(x => x.id === A._chartSong);
  if (!s) return;
  const key = A._chartKey;
  const home = normaliseKey(s.default_key);
  const isNashville = (s.chart_format === 'nashville') && !!s.chord_chart;

  showModal(esc(s.title), `
    <div class="hint">${esc(s.artist || 'Unknown artist')}</div>
    <div style="margin:8px 0">
      ${home ? `<span class="chip ${key === home ? 'on' : ''}">Original ${esc(home)}</span>` : ''}
      ${s.bpm ? `<span class="chip">${s.bpm} bpm</span>` : ''}

    </div>
    <div class="row" style="margin-bottom:8px">
      ${s.song_url ? `<a class="back" href="${esc(s.song_url)}" target="_blank" rel="noopener">🔗 Listen / watch</a>` : ''}
      ${s.spotify_url ? `<a class="back" href="${esc(s.spotify_url)}" target="_blank" rel="noopener">🎧 Spotify</a>` : ''}
      ${s.chord_chart_url ? `<a class="back" href="${esc(s.chord_chart_url)}" target="_blank" rel="noopener">📄 Chart link</a>` : ''}

// ------------------------------------------------------------ schedule ----
// ------------------------------------------------------------ schedule ----
//
// Three screens, one tab, in the order someone actually thinks:
//
//   the services we run  ->  the next fortnight of one of them  ->  one plan
//
// That is the shape Planning Center uses and the reason it is legible: a
// service type is a standing thing ("Sunday Morning"), a date is an instance of
// it, and the plan is where the people, the songs and the files live. Landing
// on a flat list of every date across every service tells you nothing about
// which is which.
function scheduleTab(){
  if (A.openService) {
    const svc = A.services.find(s => s.id === A.openService);
    if (svc) return planPage(svc);
    A.openService = null;          // deleted underneath us
  }
  if (A._openType) {
    const type = A.types.find(t => t.id === A._openType);
    if (type) return typeDates(type);
    A._openType = null;
  }
  return typeList();
}

// ---- screen 1: the services we run -------------------------------------
function typeList(){
  const rows = A.types.map(t => {
    const dates = upcomingDatesForType(t);
    const next = dates.find(d => d.service) || dates[0];
    const planned = dates.filter(d => d.service).length;
    return `
      <button class="trow" onclick="openType('${t.id}')">
        <div class="grow">
          <div class="name">${esc(t.name)}</div>
          <div class="meta">${t.weekday != null ? esc(WEEKDAYS[t.weekday] + 's') : 'No set day'}${
            t.start_time ? ' · ' + esc(fmtTime(t.start_time)) : ''}${
            t.location ? ' · ' + esc(t.location) : ''}</div>
          <div class="meta">${next
            ? `Next: ${esc(fmtDate(next.date))}${next.service ? '' : ' — not planned yet'}`
            : 'Nothing in the next two weeks'} · ${planned} planned in the next two weeks</div>
        </div>
        <span class="chev">›</span>
      </button>`;
  }).join('');

  return `
    <div class="card">
      <div class="spread">
        <h3>📅 Services</h3>
        ${A.isAdmin ? '<button class="btn small" onclick="editServiceType(null)">+ Add service</button>' : ''}
      </div>
      <div class="hint">Pick a service to see the next two weeks of it.</div>
      ${A.types.length ? rows : '<div class="empty">No services set up yet.</div>'}
    </div>
    ${A.isAdmin ? oneOffCard() : ''}
    ${myNextCard()}`;
}

// Anything the signed-in player is on, across every service, so they do not
// have to go looking for their own name.
function myNextCard(){
  const today = localDateStr();
  const mine = A.services
    .filter(s => s.service_date >= today)
    .map(s => ({ s, slots: (A.slots[s.id] || []).filter(sl => sl.user_id === A.me.id) }))
    .filter(x => x.slots.length)
    .sort((a, b) => a.s.service_date.localeCompare(b.s.service_date))
    .slice(0, 5);
  if (!mine.length) return '';

  return `
    <div class="card">
      <h3>🎤 You are on</h3>
      ${mine.map(({ s, slots }) => {
        const type = A.types.find(t => t.id === s.service_type_id);
        return `
        <button class="drow ${s.service_date === today ? 'today' : ''}" onclick="openService('${s.id}')">
          <div class="grow">
            <div class="date">${esc(fmtDate(s.service_date))}${
              s.service_date === today ? ' <span class="tag today">today</span>' : ''}</div>
            <div class="meta">${esc(type ? type.name : 'Service')} · ${
              slots.map(sl => esc(instrLabel(sl.instrument))).join(', ')} ${statusTag(slots[0].status)}</div>
          </div>
          <span class="chev">›</span>
        </button>`;
      }).join('')}
    </div>`;
}

function oneOffCard(){
  if (!A.types.length) return '';
  return `
    <div class="card">
      <h3>➕ A one-off date</h3>
      <div class="hint">For a service outside the usual weekly pattern — a carol service, a rehearsal, a wedding.</div>
      <div class="row">
        <select id="ns-type">${A.types.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
        <input type="date" id="ns-date" value="${nextDateForType(A.types[0])}">
        <input type="text" id="ns-title" placeholder="Title (optional)" style="min-width:160px">
        <button class="btn" onclick="createService()">Create</button>
      </div>
    </div>`;
}

// ---- screen 2: the next two weeks of one service ------------------------
function typeDates(type){
  const today = localDateStr();
  const dates = upcomingDatesForType(type);

  const rows = dates.map(d => {
    const s = d.service;
    const isToday = d.date === today;
    const slots = s ? (A.slots[s.id] || []) : [];
    const songs = s ? (A.songLinks[s.id] || []) : [];
    const mine = slots.some(sl => sl.user_id === A.me.id);

    // A date nobody has planned yet is still a date the service happens on.
    // Admins get to start it from here; everyone else sees it is not ready.
    if (!s) {
      return `
        <div class="drow unplanned" ${A.isAdmin ? `onclick="planDate('${type.id}','${d.date}')"` : ''}>
          <div class="grow">
            <div class="date">${esc(fmtDate(d.date))}${isToday ? ' <span class="tag today">today</span>' : ''}</div>
            <div class="meta">Not planned yet</div>
          </div>
          ${A.isAdmin ? '<span class="btn sec small">Start a plan</span>' : '<span class="tag none">nothing yet</span>'}
        </div>`;
    }

    return `
      <button class="drow ${isToday ? 'today' : ''}" onclick="openService('${s.id}')">
        <div class="grow">
          <div class="date">${esc(fmtDate(d.date))}${isToday ? ' <span class="tag today">today</span>' : ''}${
            mine ? ' <span class="tag yes">you are on</span>' : ''}</div>
          <div class="meta">${s.title ? esc(s.title) + ' · ' : ''}${slots.length} on the team · ${songs.length} song${
            songs.length === 1 ? '' : 's'} · <span class="tag ${s.status === 'published' ? 'live' : 'draft'}">${
            s.status === 'published' ? 'published' : 'draft'}</span></div>
        </div>
        <span class="chev">›</span>
      </button>`;
  }).join('');

  return `
    <div class="crumb">
      <a href="#" onclick="closeType();return false;">📅 Services</a>
      <span class="sep">›</span>
      <strong>${esc(type.name)}</strong>
    </div>
    <div class="card">
      <div class="spread">
        <h3>${esc(type.name)} — the next two weeks</h3>
        ${A.isAdmin ? `<div class="row">
          <button class="btn sec small" onclick="editServiceType('${type.id}')">Edit service</button>
          <button class="btn danger small" onclick="deleteServiceType('${type.id}')">Delete</button>
        </div>` : ''}
      </div>
      <div class="hint">${type.weekday != null ? esc(WEEKDAYS[type.weekday] + 's') : 'No set day'}${
        type.start_time ? ' at ' + esc(fmtTime(type.start_time)) : ''}${
        type.location ? ' · ' + esc(type.location) : ''}</div>
      ${rows || '<div class="empty">Nothing in the next two weeks.</div>'}
    </div>`;
}

// Every date this service falls on between today and a fortnight out, planned
// or not. Today counts: the whole point of opening this on a Sunday morning is
// the service you are about to play.
function upcomingDatesForType(type, days = 14){
  const out = [];
  const today = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const ds = localDateStr(d);
    const planned = A.services.filter(s => s.service_type_id === type.id && s.service_date === ds);
    const recurring = type.weekday != null && d.getDay() === type.weekday;
    if (planned.length) planned.forEach(s => out.push({ date: ds, service: s }));
    else if (recurring) out.push({ date: ds, service: null });
  }
  return out;
}

// Positions first, people inside them - the way a rota is read. Every
// instrument shows even when nobody is on it, because an empty position is
// the thing you are looking for when you open this page.
function teamBlock(s, slots){
  const mySlot = slots.find(sl => sl.user_id === A.me.id);

  const positions = INSTRUMENTS.map(inst => {
    const here = slots.filter(sl => sl.instrument === inst.id);
    const people = here.length ? here.map(sl => {
      const m = A.rosterById[sl.user_id];
      const isMe = sl.user_id === A.me.id;
      return `<span class="person ${isMe ? 'me' : ''}">${sl.is_leader ? '★ ' : ''}${
        esc(m ? m.full_name : 'Former member')} ${statusTag(sl.status)}${
        A.isAdmin ? ` <a href="#" class="x" onclick="removeSlot('${sl.id}','${s.id}');return false;">✕</a>` : ''}</span>`;
    }).join('') : '<span class="empty" style="padding:0">—</span>';

    return `
      <div class="pos">
        <div class="label">${inst.icon} ${esc(inst.label)}</div>
        <div class="people">${people}</div>
        ${A.isAdmin ? `<button class="btn sec small" onclick="addPersonTo('${s.id}','${inst.id}')">+ Add</button>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="card">
      <h3>👥 Team</h3>
      ${mySlot ? `
        <div class="hint" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          You are on for ${esc(instrLabel(mySlot.instrument))}.
          <button class="btn good small" onclick="respondToSlot('${mySlot.id}','${s.id}','confirmed')">✓ I'll be there</button>

        </div>` : ''}

}

function statusTag(status){
  if (status === 'confirmed') return '<span class="tag yes">in</span>';
  if (status === 'declined') return '<span class="tag no">out</span>';
  return '<span class="tag wait">asked</span>';
}

// the title opens the chart already in it.

  const songs = (A.songLinks[s.id] || []).slice().sort((a, b) => a.sort_order - b.sort_order);

  const items = songs.map((l, i) => {
    const song = A.songs.find(x => x.id === l.song_id);
    const playable = song && song.chart_format === 'nashville' && song.chord_chart;
    const title = esc(song ? song.title : 'Song');
    return `
      <div class="item">
        <div class="num">${i + 1}</div>
        <div class="t">
          ${song ? `<a href="#" onclick="openSong('${song.id}'${l.song_key ? `,'${esc(l.song_key)}'` : ''});return false;">${title}</a>`
                 : title}
          <div class="sub">${l.song_key ? 'Key ' + esc(l.song_key) : (song && song.default_key ? 'Key ' + esc(song.default_key) : 'No key set')}${
            song && song.artist ? ' · ' + esc(song.artist) : ''}${playable ? ' · 🎹 chart' : ''}${
            l.note ? ' · ' + esc(l.note) : ''}</div>

          <div class="ord">

  return `
    <div class="card">

// The next time this type's weekday comes round, so the date box opens on the
// day you almost certainly mean.
function nextDateForType(type){
  const today = new Date();
  if (!type || type.weekday == null) return localDateStr(today);
  const delta = (type.weekday - today.getDay() + 7) % 7;
  const d = new Date(today);
  d.setDate(today.getDate() + delta);
  return localDateStr(d);
}

async function loadSongs(){
  const { data, error } = await A.supabase.from('worship_songs')
    .select('*').eq('is_active', true).order('title');
  if (error) throw error;
  A.songs = data || [];
  A.loaded.songs = true;
}

async function loadSchedule(){
  // Songs come along because the set lists name them, and the schedule is
  // unreadable without their titles.
  if (!A.loaded.songs) await loadSongs();

  const [typesRes, svcRes] = await Promise.all([
    A.supabase.from('worship_service_types').select('*').eq('is_active', true)
      .order('sort_order').order('name'),
    A.supabase.from('worship_services').select('*').order('service_date', { ascending: true })
  ]);
  if (typesRes.error) throw typesRes.error;
  if (svcRes.error) throw svcRes.error;

  A.types = typesRes.data || [];
  // Members see published services only; an admin is still building the drafts.
  A.services = (svcRes.data || []).filter(s => A.isAdmin || s.status === 'published');

  await loadServiceChildren();
  A.loaded.schedule = true;
}

// Slots and set lists for every service on screen, in two queries rather than
// two per service.
async function loadServiceChildren(){
  const ids = A.services.map(s => s.id);
  A.slots = {}; A.songLinks = {}; A.files = {};
  if (!ids.length) return;

  const [slotRes, songRes, fileRes] = await Promise.all([
    A.supabase.from('worship_service_slots').select('*').in('service_id', ids),
    A.supabase.from('worship_service_songs').select('*').in('service_id', ids).order('sort_order'),
    A.supabase.from('worship_service_files').select('*').in('service_id', ids).order('sort_order')
  ]);
  if (slotRes.error) throw slotRes.error;
  if (songRes.error) throw songRes.error;

  // Practice files arrived after the rest of the section. Until that migration
  // is applied the table is simply absent, which must cost the files block and
  // nothing else - not the rota, which is what people actually came for.
  if (fileRes.error) {
    A.filesUnavailable = true;
    console.warn('Practice files unavailable, continuing without them:', fileRes.error.message);
  }

  (slotRes.data || []).forEach(r => { (A.slots[r.service_id] = A.slots[r.service_id] || []).push(r); });
  (songRes.data || []).forEach(r => { (A.songLinks[r.service_id] = A.songLinks[r.service_id] || []).push(r); });
  (fileRes.data || []).forEach(r => { (A.files[r.service_id] = A.files[r.service_id] || []).push(r); });
}

async function loadRequests(){
  const { data, error } = await A.supabase.rpc('worship_requests_list');
  if (error) throw error;
  A.requests = data || [];
  A.loaded.requests = true;
}

async function submitJoinRequest(){

  const note = ($('join-note').value || '').trim();

  A.loaded.requests = false;

}

async function cancelMyRequest(){
  if (!A.myRequest) return;
  const { error } = await A.supabase.from('worship_join_requests').delete().eq('id', A.myRequest.id);
  if (error) { toast('Could not cancel: ' + error.message, true); return; }
  A.myRequest = null;

// Approving writes the roster row AND closes the request. Both are worship-admin
// writes the database allows; if the roster row fails, the request stays open
// rather than being marked answered with nobody added.
async function decideRequest(id, status){
  const req = A.requests.find(r => r.id === id);
  if (!req) return;

  if (status === 'approved') {
    const { error } = await A.supabase.from('worship_members').insert({
      user_id: req.user_id,
      instruments: req.instruments || [],
      added_by: A.me.id
    });
    // A person already on the roster is not an error worth stopping for: close
    // the request and move on.
    if (error && !/duplicate key/i.test(error.message)) {
      toast('Could not add them: ' + error.message, true);
      return;
    }
  }

  const note = status === 'declined' ? (prompt('A short note back (optional):') || null) : null;
  const { error: upErr } = await A.supabase.from('worship_join_requests').update({
    status, decided_by: A.me.id, decided_at: new Date().toISOString(), decision_note: note
  }).eq('id', id);
  if (upErr) { toast('Could not save: ' + upErr.message, true); return; }

  await Promise.all([loadCore(), loadRequests()]);
  toast(status === 'approved' ? 'Added to the team' : 'Request closed');
  render();
}

// The add-someone search. The directory is one security-definer call that
// returns names only, loaded once and filtered here.
async function renderDirectory(){
  const box = $('dir-results');
  if (!box) return;
  const q = (A._dirQuery || '').trim().toLowerCase();
  const kind = $('dir-kind').value;

  if (!A.directory) {
    box.innerHTML = '<div class="empty">Searching…</div>';
    const { data, error } = await A.supabase.rpc('worship_directory');
    if (error) { box.innerHTML = `<div class="empty">Could not load the directory: ${esc(error.message)}</div>`; return; }
    A.directory = data || [];
  }

  if (q.length < 2) { box.innerHTML = '<div class="empty">Type at least two letters.</div>'; return; }

  const onTeam = new Set(A.roster.map(r => r.user_id));
  const hits = A.directory.filter(p => {
    if (onTeam.has(p.user_id)) return false;
    if (kind === 'student' && p.user_type !== 'student') return false;
    if (kind === 'staff' && p.user_type === 'student') return false;
    return (p.full_name || '').toLowerCase().includes(q);
  }).slice(0, 30);

  box.innerHTML = hits.length ? `<table><tbody>${hits.map(p => `
    <tr>
      <td><strong>${esc(p.full_name)}</strong></td>
      <td style="color:var(--muted)">${esc(whoLabel(p))}</td>
      <td style="text-align:right"><button class="btn small" onclick="addMember('${p.user_id}')">Add</button></td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">Nobody matches, or they are already on the team.</div>';
}

async function saveSong(id){
  const title = ($('sg-title').value || '').trim();
  if (!title) { toast('A song needs a title', true); return; }

  const bpmRaw = ($('sg-bpm').value || '').trim();
  const row = {
    title,
    artist: ($('sg-artist').value || '').trim() || null,
    default_key: ($('sg-key').value || '').trim() || null,
    bpm: bpmRaw ? parseInt(bpmRaw, 10) : null,
    song_url: ($('sg-song-url').value || '').trim() || null,
    spotify_url: ($('sg-spotify').value || '').trim() || null,
    chord_chart_url: ($('sg-chart-url').value || '').trim() || null,
    chart_format: pillOn('sg-nashville') ? 'nashville' : 'text',
    tags: ($('sg-tags').value || '').split(',').map(t => t.trim()).filter(Boolean),
    notes: ($('sg-notes').value || '').trim() || null,
    chord_chart: ($('sg-chart').value || '').trim() || null
  };

  let error;
  if (id) {
    row.updated_at = new Date().toISOString();
    ({ error } = await A.supabase.from('worship_songs').update(row).eq('id', id));
  } else {
    row.created_by = A.me.id;
    ({ error } = await A.supabase.from('worship_songs').insert(row));
  }
  if (error) { toast('Could not save: ' + error.message, true); return; }

  closeModal();
  await loadSongs();
  toast('Saved');
  render();
}

// Soft delete: a song that has been played is still named on old set lists, and
// deleting the row outright would empty those lines.
async function deleteSong(id){
  const s = A.songs.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Remove “${s.title}” from the library? Past set lists keep it.`)) return;

  const { error } = await A.supabase.from('worship_songs').update({ is_active: false }).eq('id', id);
  if (error) { toast('Could not remove: ' + error.message, true); return; }

  closeModal();
  await loadSongs();
  toast('Removed from the library');
  render();
}

    <div class="field"><label class="fld" for="st-notes">Notes</label>
      <textarea id="st-notes">${esc(t && t.notes || '')}</textarea></div>
    <button class="btn" onclick="saveServiceType(${t ? `'${t.id}'` : 'null'})">Save</button>
    <button class="btn sec" onclick="closeModal()">Cancel</button>
  `);
}

async function saveServiceType(id){
  const name = ($('st-name').value || '').trim();
  if (!name) { toast('A service type needs a name', true); return; }

  const dayRaw = $('st-day').value;
  const row = {
    name,
    weekday: dayRaw === '' ? null : parseInt(dayRaw, 10),
    start_time: $('st-time').value || null,
    location: ($('st-loc').value || '').trim() || null,
    notes: ($('st-notes').value || '').trim() || null
  };

  const { error } = id
    ? await A.supabase.from('worship_service_types').update(row).eq('id', id)
    : await A.supabase.from('worship_service_types').insert(row);
  if (error) { toast('Could not save: ' + error.message, true); return; }

  closeModal();
  A.loaded.schedule = false;
  await loadSchedule();
  toast('Saved');
  render();
}

async function deleteServiceType(id){
  const t = A.types.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`Remove “${t.name}”? Dates already scheduled keep their people and songs, but lose the type.`)) return;

  const { error } = await A.supabase.from('worship_service_types').update({ is_active: false }).eq('id', id);
  if (error) { toast('Could not remove: ' + error.message, true); return; }

  A.loaded.schedule = false;
  await loadSchedule();
  toast('Removed');
  render();
}

async function createService(){
  const date = $('ns-date').value;
  if (!date) { toast('Pick a date', true); return; }

  const { error } = await A.supabase.from('worship_services').insert({
    service_type_id: $('ns-type').value,
    service_date: date,
    title: ($('ns-title').value || '').trim() || null,
    status: 'draft',
    created_by: A.me.id
  });
  if (error) { toast('Could not create: ' + error.message, true); return; }

  A.loaded.schedule = false;
  await loadSchedule();
  toast('Service created as a draft');
  render();
}

async function toggleServiceStatus(id){
  const s = A.services.find(x => x.id === id);
  if (!s) return;
  const status = s.status === 'published' ? 'draft' : 'published';

  const { error } = await A.supabase.from('worship_services').update({ status }).eq('id', id);
  if (error) { toast('Could not save: ' + error.message, true); return; }

  s.status = status;
  toast(status === 'published' ? 'The team can see it now' : 'Back to draft');
  renderTab();
}

function editServiceNotes(id){
  const s = A.services.find(x => x.id === id);
  if (!s) return;
  showModal('Service details', `
    <div class="row">
      <div class="field"><label class="fld" for="sv-date">Date</label>
        <input type="date" id="sv-date" value="${esc(s.service_date)}"></div>
      <div class="field" style="flex:1;min-width:160px"><label class="fld" for="sv-title">Title</label>
        <input type="text" id="sv-title" style="width:100%" value="${esc(s.title || '')}"></div>
    </div>
    <div class="field"><label class="fld" for="sv-notes">Notes for the team</label>
      <textarea id="sv-notes">${esc(s.notes || '')}</textarea></div>
    <button class="btn" onclick="saveServiceDetails('${id}')">Save</button>
    <button class="btn sec" onclick="closeModal()">Cancel</button>
  `);
}

async function saveServiceDetails(id){
  const { error } = await A.supabase.from('worship_services').update({
    service_date: $('sv-date').value,
    title: ($('sv-title').value || '').trim() || null,
    notes: ($('sv-notes').value || '').trim() || null
  }).eq('id', id);
  if (error) { toast('Could not save: ' + error.message, true); return; }

  closeModal();
  A.loaded.schedule = false;
  await loadSchedule();
  toast('Saved');
  render();
}

async function deleteService(id){
  const s = A.services.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Delete ${fmtDate(s.service_date)} and everything scheduled on it?`)) return;

  const { error } = await A.supabase.from('worship_services').delete().eq('id', id);
  if (error) { toast('Could not delete: ' + error.message, true); return; }

  A.openService = null;
  A.loaded.schedule = false;
  await loadSchedule();
  toast('Deleted');
  render();
}

async function confirmAddPerson(serviceId, instrument){
  const userId = $('ap-user').value;
  const isLeader = pillOn('ap-lead');

  const { error } = await A.supabase.from('worship_service_slots')
    .insert({ service_id: serviceId, user_id: userId, instrument, is_leader: isLeader });
  if (error) {
    toast(/duplicate key/i.test(error.message)
      ? 'They are already on for that instrument'
      : 'Could not add: ' + error.message, true);
    return;
  }

  closeModal();
  await loadServiceChildren();
  renderTab();
}

// A player answering for themselves. The database only lets them touch their
// OWN slot's status, through worship_slot_respond() - the row is otherwise an
// admin's to write, and a player must not be able to put themselves on a rota
// or change what they are playing.
async function respondToSlot(slotId, serviceId, status){
  const { data, error } = await A.supabase.rpc('worship_slot_respond', {
    p_slot_id: slotId, p_status: status
  });
  if (error || (data && data.success === false)) {
    toast('Could not save: ' + ((error && error.message) || (data && data.error) || 'unknown'), true);
    return;
  }
  await loadServiceChildren();
  toast(status === 'confirmed' ? "You're in" : 'Thanks for saying');
  renderTab();
}

async function removeSlot(slotId, serviceId){
  const { error } = await A.supabase.from('worship_service_slots').delete().eq('id', slotId);
  if (error) { toast('Could not remove: ' + error.message, true); return; }
  await loadServiceChildren();
  renderTab();
}

async function addServiceSong(serviceId){
  const songId = $('song-pick-' + serviceId).value;
  if (!songId) { toast('Pick a song', true); return; }

  const existing = A.songLinks[serviceId] || [];
  const { error } = await A.supabase.from('worship_service_songs').insert({
    service_id: serviceId,
    song_id: songId,
    song_key: ($('song-key-' + serviceId).value || '').trim() || null,
    note: ($('song-note-' + serviceId).value || '').trim() || null,
    sort_order: existing.length
  });
  if (error) { toast('Could not add: ' + error.message, true); return; }

  await loadServiceChildren();
  renderTab();
}

// Reorder by swapping the two rows' sort_order. Two writes rather than a
// rewrite of the whole list, so two people editing different parts of an order
// cannot clobber each other's work.
async function moveServiceSong(linkId, serviceId, dir){
  const songs = (A.songLinks[serviceId] || []).slice().sort((a, b) => a.sort_order - b.sort_order);
  const i = songs.findIndex(x => x.id === linkId);
  const j = i + dir;
  if (i === -1 || j < 0 || j >= songs.length) return;

  const a = songs[i], b = songs[j];
  const [res1, res2] = await Promise.all([
    A.supabase.from('worship_service_songs').update({ sort_order: b.sort_order }).eq('id', a.id),
    A.supabase.from('worship_service_songs').update({ sort_order: a.sort_order }).eq('id', b.id)
  ]);
  if (res1.error || res2.error) {
    toast('Could not reorder: ' + ((res1.error || res2.error).message), true);
  }
  await loadServiceChildren();
  renderTab();
}

async function addServiceFile(serviceId){
  const url = ($('file-url-' + serviceId).value || '').trim();
  if (!url) { toast('A file needs a link', true); return; }
  const label = ($('file-label-' + serviceId).value || '').trim();

  const existing = A.files[serviceId] || [];
  const { error } = await A.supabase.from('worship_service_files')
    .insert({ service_id: serviceId, label: label || null, url, sort_order: existing.length });
  if (error) { toast('Could not attach: ' + error.message, true); return; }

  await loadServiceChildren();
  renderTab();
}

async function removeServiceFile(fileId, serviceId){
  const { error } = await A.supabase.from('worship_service_files').delete().eq('id', fileId);
  if (error) { toast('Could not remove: ' + error.message, true); return; }
  await loadServiceChildren();
  renderTab();
}

// Starting a plan from a date the service falls on but nobody has touched.
async function planDate(typeId, date){
  const { data, error } = await A.supabase.from('worship_services')
    .insert({ service_type_id: typeId, service_date: date, status: 'draft', created_by: A.me.id })
    .select('id').single();
  if (error) { toast('Could not start it: ' + error.message, true); return; }

  A.loaded.schedule = false;
  await loadSchedule();
  A.openService = data && data.id;
  toast('Draft started');
  renderTab();
  window.scrollTo(0, 0);
}

async function removeServiceSong(linkId, serviceId){
  const { error } = await A.supabase.from('worship_service_songs').delete().eq('id', linkId);
  if (error) { toast('Could not remove: ' + error.message, true); return; }
  await loadServiceChildren();
  renderTab();
}

// =========================================================================
// Modal
// =========================================================================
function showModal(title, bodyHtml){
  $('modal').innerHTML = `<button class="close" onclick="closeModal()">&times;</button><h3>${title}</h3>${bodyHtml}`;
  $('modal-bg').classList.add('open');
}
function closeModal(){
  $('modal-bg').classList.remove('open');
  $('modal').innerHTML = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
