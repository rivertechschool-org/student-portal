<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Worship Team</title>
<link rel="icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
:root{
  --bg:#0f1216; --card:#151a21; --card2:#1c2330; --border:#2a3140; --text:#e6edf3;
  --muted:#97a2b0; --accent:#9b6aff; --good:#8bffb0; --info:#6aa9ff; --warn:#ffd36a; --danger:#ff6a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px;flex-wrap:wrap}
header h1{font-size:1.35rem}
header .sub{color:var(--muted);font-size:.83rem}
header .spacer{flex:1}
a.back{color:var(--muted);text-decoration:none;font-size:.85rem;border:1px solid var(--border);padding:6px 12px;border-radius:8px}
a.back:hover{color:var(--text);border-color:var(--muted)}
input,select,textarea{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.9rem;font-family:inherit;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
label.fld{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.field{margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hint{color:var(--muted);font-size:.78rem;margin-bottom:10px}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabbar button{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.88rem}
.tabbar button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.badge{display:inline-block;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px;font-size:.7rem;margin-left:6px;font-weight:700}
button.btn{background:var(--accent);border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600}
button.btn.sec{background:var(--card2);border:1px solid var(--border);color:var(--text);font-weight:500}
button.btn.danger{background:var(--danger)}
button.btn.good{background:#1f7a4d}
button.btn.small{padding:4px 10px;font-size:.78rem}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 8px}
td{padding:8px 8px;border-top:1px solid var(--border);vertical-align:middle}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:.75rem;color:var(--muted);margin:2px 4px 2px 0}
.chip.on{background:rgba(155,106,255,.16);border-color:var(--accent);color:#d7c4ff}
.chip.lead{background:rgba(255,211,106,.14);border-color:var(--warn);color:var(--warn)}
.chip.me{background:rgba(139,255,176,.14);border-color:var(--good);color:var(--good)}
.pick{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;margin:0 6px 6px 0}
.pick.on{background:rgba(155,106,255,.18);border-color:var(--accent)}
.pick input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.song{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer}
.song:hover{border-color:var(--accent)}
.song .t{font-weight:600;font-size:.95rem}
.song .a{color:var(--muted);font-size:.78rem;margin-top:2px}
.svc{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.svc.mine{border-color:var(--good)}
.svc .when{font-weight:700;font-size:.95rem}
.svc .type{color:var(--muted);font-size:.8rem}
.sub-h{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.empty{color:var(--muted);font-size:.85rem;padding:10px 0}
.denied{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.88rem;display:none;z-index:60}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:20px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:620px;width:100%;margin:auto;padding:18px}
.modal h3{font-size:1.05rem;margin-bottom:12px}
.modal .close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
pre.chart{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.82rem;white-space:pre-wrap;overflow-x:auto;max-height:50vh}
@media (max-width:640px){
  th:nth-child(2),td:nth-child(2){display:none}
  .wrap{padding:12px}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="../shared/config.js"></script>
<script>
'use strict';

// ============================================================================
// Worship Team
//
// One page for the whole team, opened from the More launcher on the Portal tab
// of both the student and the teacher portals. Four audiences read it:
//
//   * someone who is not on the team  -> the join form, and the state of the
//     request they already sent;
//   * a member                        -> the roster, the song library, and the
//     schedule with their own slots picked out;
//   * a worship admin                 -> everything above plus the requests
//     queue, the roster controls, the library, and the scheduler;
//   * a school admin                  -> a worship admin automatically. That is
//     a rule of the database, not of this file: is_worship_admin() says so, and
//     every policy on every worship_* table asks it. The `A.isAdmin` flag here
//     only decides which controls are DRAWN.
//
// Names are the one thing this page cannot read straight off the tables. A
// student may not select another student's user_profiles row, so the roster and
// the requests queue come back through two security-definer functions that
// return names and nothing else. Slot rows hold a user_id and are always a
// member, so they resolve against the roster already in memory.
// ============================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, bad){
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = bad ? 'var(--danger)' : 'var(--border)';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 2800);
}

// Today HERE, not in UTC. From late afternoon on, toISOString() is already
// tomorrow, and a schedule that defaults to tomorrow is a schedule nobody
// trusts. Same rule as _localDateStr in the portal.
function localDateStr(d = new Date()){
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// A yyyy-mm-dd string is a calendar day, not an instant: parse the parts rather
// than letting Date read it as UTC midnight and shift it a day backwards.
function dateFromStr(s){
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function fmtDate(s){
  const d = dateFromStr(s);
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(t){
  if (!t) return '';
  const [h, m] = String(t).split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m ? `${h12}:${String(m).padStart(2, '0')}${ampm}` : `${h12}${ampm}`;
}

// The four instruments the team plays. Adding a fifth is this list plus nothing
// else: the join form, the roster chips and the slot picker all read it.
const INSTRUMENTS = [
  { id: 'piano',   label: 'Piano',   icon: '🎹' },
  { id: 'guitar',  label: 'Guitar',  icon: '🎸' },
  { id: 'cajon',   label: 'Cajón',   icon: '🥁' },
  { id: 'singing', label: 'Singing', icon: '🎤' }
];
function instrLabel(id){
  const i = INSTRUMENTS.find(x => x.id === id);
  return i ? `${i.icon} ${i.label}` : id;
}

const A = {
  auth: null, supabase: null, me: null,
  isAdmin: false,          // worship admin: school admin, or flagged on the roster
  member: null,            // my own worship_members row, if any
  myRequest: null,         // my latest worship_join_requests row, if any
  roster: [], rosterById: {},
  requests: [],
  songs: [],
  types: [],
  services: [],
  slots: {}, songLinks: {},   // serviceId -> rows
  directory: null,         // lazily loaded, admin only
  tab: 'team',
  openService: null,
  loaded: { songs: false, schedule: false, requests: false }
};

// ---------------------------------------------------------------- boot ----
(async function init(){
  try {
    A.auth = window.portalAuth;
    await A.auth.initialize();
    if (!A.auth.isAuthenticated()) { deny('Please sign in through the portal first.'); return; }

    const info = A.auth.getUserInfo();
    A.me = info.profile;
    A.supabase = A.auth.supabase;

    if (!A.me) { deny('Your profile could not be loaded. Sign out and back in, or ask a teacher.'); return; }
    if (!['student', 'teacher', 'admin'].includes(A.me.user_type)) {
      deny('The worship team page is for students and staff.');
      return;
    }

    await loadCore();
    render();
  } catch (e) {
    console.error(e);
    deny('Failed to load: ' + (e.message || e));
  }
})();

function deny(msg){
  $('app').innerHTML = `<div class="denied"><h2>🎵 Worship Team</h2><p style="margin-top:10px">${esc(msg)}</p>
    <p style="margin-top:14px"><a class="back" href="./index.html">← Back to the portal</a></p></div>`;
}

// The roster and my own two rows. Everything else waits for its tab.
async function loadCore(){
  const [rosterRes, memberRes, reqRes] = await Promise.all([
    A.supabase.rpc('worship_roster'),
    A.supabase.from('worship_members').select('*').eq('user_id', A.me.id).maybeSingle(),
    A.supabase.from('worship_join_requests').select('*').eq('user_id', A.me.id)
      .order('created_at', { ascending: false }).limit(1)
  ]);

  if (rosterRes.error) throw rosterRes.error;
  A.roster = rosterRes.data || [];
  A.rosterById = {};
  A.roster.forEach(r => { A.rosterById[r.user_id] = r; });

  A.member = memberRes.data || null;
  A.myRequest = (reqRes.data && reqRes.data[0]) || null;

  // A school admin is a worship admin without being on the roster at all - they
  // may never play, and still have to run the team.
  A.isAdmin = A.me.user_type === 'admin' || !!(A.member && A.member.is_worship_admin);
}

// --------------------------------------------------------------- shell ----
function render(){
  const who = `${A.me.first_name || ''} ${A.me.last_name || ''}`.trim();
  const standing = A.isAdmin ? 'Worship admin' : (A.member ? 'Team member' : 'Not on the team yet');
  const pending = A.isAdmin ? A.requests.filter(r => r.status === 'pending').length : 0;

  $('app').innerHTML = `
    <header>
      <div>
        <h1>🎵 Worship Team</h1>
        <div class="sub">${esc(who)} · ${esc(standing)}</div>
      </div>
      <div class="spacer"></div>
      <a class="back" href="./index.html">← Portal</a>
    </header>

    <div class="tabbar">
      <button class="${A.tab === 'team' ? 'active' : ''}" onclick="go('team')">👥 Team</button>
      <button class="${A.tab === 'songs' ? 'active' : ''}" onclick="go('songs')">🎼 Songs</button>
      <button class="${A.tab === 'schedule' ? 'active' : ''}" onclick="go('schedule')">📅 Schedule</button>
      ${A.isAdmin ? `<button class="${A.tab === 'requests' ? 'active' : ''}" onclick="go('requests')">📥 Requests${
        pending ? `<span class="badge">${pending}</span>` : ''}</button>` : ''}
    </div>

    <div id="tab-body"></div>
  `;
  renderTab();
}

async function go(tab){
  A.tab = tab;
  // Each tab fetches once, then keeps what it has until something changes it.
  try {
    if (tab === 'songs' && !A.loaded.songs) await loadSongs();
    if (tab === 'schedule' && !A.loaded.schedule) await loadSchedule();
    if (tab === 'requests' && !A.loaded.requests) await loadRequests();
  } catch (e) {
    console.error(e);
    toast('Could not load that tab: ' + (e.message || e), true);
  }
  render();
}

function renderTab(){
  const body = $('tab-body');
  if (!body) return;
  if (A.tab === 'team') {
    body.innerHTML = teamTab();
    // The directory results live below a search box that survives the render;
    // redraw them so an add does not appear to clear the search.
    if (A.isAdmin && (A._dirQuery || '').trim().length >= 2) renderDirectory();
  }
  else if (A.tab === 'songs') body.innerHTML = songsTab();
  else if (A.tab === 'schedule') body.innerHTML = scheduleTab();
  else if (A.tab === 'requests') body.innerHTML = requestsTab();
}

// ---------------------------------------------------------------- team ----
function teamTab(){
  return joinCard() + rosterCard() + (A.isAdmin ? addPeopleCard() : '');
}

// Shown to anyone who is not on the roster: the form, or the standing of the
// request they already sent. A declined request can be sent again - people
// change instrument, or ask again next term.
function joinCard(){
  if (A.member) return '';

  if (A.myRequest && A.myRequest.status === 'pending') {
    return `
      <div class="card">
        <h3>⏳ Your request is in</h3>
        <div class="hint">Sent ${esc(fmtDate(localDateStr(new Date(A.myRequest.created_at))))}. The worship team leader will see it on this page and answer here.</div>
        <div>${(A.myRequest.instruments || []).map(i => `<span class="chip on">${esc(instrLabel(i))}</span>`).join('')}</div>
        ${A.myRequest.note ? `<div class="hint" style="margin-top:8px">“${esc(A.myRequest.note)}”</div>` : ''}
        <div style="margin-top:12px"><button class="btn sec small" onclick="cancelMyRequest()">Cancel my request</button></div>
      </div>`;
  }

  const declined = A.myRequest && A.myRequest.status === 'declined';
  return `
    <div class="card">
      <h3>🙋 Ask to join the worship team</h3>
      <div class="hint">${declined
        ? 'Your last request was not taken up. You are welcome to ask again.'
        : 'Pick what you would like to play. You can choose more than one.'}</div>
      ${declined && A.myRequest.decision_note ? `<div class="hint">Note back: “${esc(A.myRequest.decision_note)}”</div>` : ''}
      <div style="margin:10px 0 4px">
        ${INSTRUMENTS.map(i => `
          <label class="pick" id="pick-${i.id}" onclick="togglePick('${i.id}')">
            <input type="checkbox" id="join-${i.id}"> <span>${i.icon} ${esc(i.label)}</span>
          </label>`).join('')}
      </div>
      <div class="field">
        <label class="fld" for="join-note">Anything else? (optional)</label>
        <textarea id="join-note" placeholder="How long you have played, what you would like to learn, when you are free…"></textarea>
      </div>
      <button class="btn" onclick="submitJoinRequest()">Send my request</button>
    </div>`;
}

function togglePick(id){
  const box = $('join-' + id);
  const label = $('pick-' + id);
  if (!box || !label) return;
  box.checked = !box.checked;
  label.classList.toggle('on', box.checked);
}

function rosterCard(){
  if (!A.roster.length) {
    return `<div class="card"><h3>👥 The team</h3><div class="empty">Nobody is on the team yet.</div></div>`;
  }

  const rows = A.roster.map(m => {
    const isMe = m.user_id === A.me.id;
    const instruments = (m.instruments || []).map(i => `<span class="chip on">${esc(instrLabel(i))}</span>`).join('') ||
      '<span class="chip">no instrument set</span>';
    return `
      <tr>
        <td>
          <strong>${esc(m.full_name)}</strong>${isMe ? ' <span class="chip me">you</span>' : ''}
          ${m.is_worship_admin ? ' <span class="chip lead">worship admin</span>' : ''}
        </td>
        <td style="color:var(--muted)">${esc(whoLabel(m))}</td>
        <td>${instruments}</td>
        ${A.isAdmin ? `<td style="text-align:right;white-space:nowrap">
          <button class="btn sec small" onclick="editMember('${m.user_id}')">Edit</button>
          <button class="btn danger small" onclick="removeMember('${m.user_id}')">Remove</button>
        </td>` : ''}
      </tr>`;
  }).join('');

  return `
    <div class="card">
      <h3>👥 The team <span class="chip">${A.roster.length}</span></h3>
      <table>
        <thead><tr><th>Name</th><th>Who</th><th>Plays</th>${A.isAdmin ? '<th></th>' : ''}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function whoLabel(m){
  if (m.user_type === 'student') return m.grade_level ? `Student · Grade ${m.grade_level}` : 'Student';
  if (m.user_type === 'teacher') return 'Teacher';
  if (m.user_type === 'admin') return 'Staff';
  return m.user_type || '';
}

// Admins add people directly, without waiting to be asked.
function addPeopleCard(){
  return `
    <div class="card">
      <h3>➕ Add someone to the team</h3>
      <div class="hint">Anyone on the roster of the school. They do not have to ask first.</div>
      <div class="row">
        <input type="text" id="dir-search" placeholder="Search by name…" value="${esc(A._dirQuery || '')}"
               oninput="A._dirQuery=this.value;renderDirectory()" style="flex:1;min-width:200px">
        <select id="dir-kind" onchange="renderDirectory()">
          <option value="all">Students and staff</option>
          <option value="student">Students only</option>
          <option value="staff">Staff only</option>
        </select>
      </div>
      <div id="dir-results" style="margin-top:10px"><div class="empty">Type a name to search.</div></div>
    </div>`;
}

// --------------------------------------------------------------- songs ----
function songsTab(){
  const q = (A._songQuery || '').toLowerCase();
  const list = A.songs.filter(s => {
    if (!q) return true;
    return `${s.title} ${s.artist || ''} ${(s.tags || []).join(' ')}`.toLowerCase().includes(q);
  });

  const cards = list.map(s => `
    <div class="song" onclick="openSong('${s.id}')">
      <div class="t">${esc(s.title)}</div>
      <div class="a">${esc(s.artist || '—')}</div>
      <div style="margin-top:6px">
        ${s.default_key ? `<span class="chip on">Key ${esc(s.default_key)}</span>` : ''}
        ${s.bpm ? `<span class="chip">${s.bpm} bpm</span>` : ''}
        ${(s.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}
      </div>
      <div style="margin-top:6px;font-size:.75rem;color:var(--muted)">
        ${s.chord_chart_url || s.chord_chart ? '📄 chart' : ''}
        ${s.song_url ? ' 🔗 link' : ''}
      </div>
    </div>`).join('');

  return `
    <div class="card">
      <div class="spread">
        <h3>🎼 Song library <span class="chip">${A.songs.length}</span></h3>
        ${A.isAdmin ? '<button class="btn small" onclick="editSong(null)">+ Add song</button>' : ''}
      </div>
      <div class="hint">Chord charts, keys and links. Anyone on the team can read it; worship admins keep it up to date.</div>
      <input type="text" placeholder="Search title, artist or tag…" value="${esc(A._songQuery || '')}"
             oninput="A._songQuery=this.value;renderTab()" style="width:100%;margin-bottom:12px">
      ${list.length ? `<div class="grid">${cards}</div>` : '<div class="empty">No songs yet.</div>'}
    </div>`;
}

function openSong(id){
  const s = A.songs.find(x => x.id === id);
  if (!s) return;
  showModal(esc(s.title), `
    <div class="hint">${esc(s.artist || 'Unknown artist')}</div>
    <div style="margin:8px 0">
      ${s.default_key ? `<span class="chip on">Key ${esc(s.default_key)}</span>` : ''}
      ${s.bpm ? `<span class="chip">${s.bpm} bpm</span>` : ''}
      ${(s.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}
    </div>
    ${s.song_url ? `<div class="field"><a class="back" href="${esc(s.song_url)}" target="_blank" rel="noopener">🔗 Listen / watch</a></div>` : ''}
    ${s.chord_chart_url ? `<div class="field"><a class="back" href="${esc(s.chord_chart_url)}" target="_blank" rel="noopener">📄 Open chord chart</a></div>` : ''}
    ${s.notes ? `<div class="field"><label class="fld">Notes</label>${esc(s.notes)}</div>` : ''}
    ${s.chord_chart ? `<div class="field"><label class="fld">Chart</label><pre class="chart">${esc(s.chord_chart)}</pre></div>` : ''}
    ${A.isAdmin ? `<div class="row" style="margin-top:12px">
      <button class="btn sec" onclick="editSong('${s.id}')">Edit</button>
      <button class="btn danger" onclick="deleteSong('${s.id}')">Delete</button>
    </div>` : ''}
  `);
}

function editSong(id){
  const s = id ? A.songs.find(x => x.id === id) : null;
  showModal(s ? 'Edit song' : 'Add song', `
    <div class="field"><label class="fld" for="sg-title">Title</label>
      <input type="text" id="sg-title" style="width:100%" value="${esc(s ? s.title : '')}"></div>
    <div class="row">
      <div class="field" style="flex:2;min-width:180px"><label class="fld" for="sg-artist">Artist</label>

// The next time this type's weekday comes round, so the date box opens on the
// day you almost certainly mean.
function nextDateForType(type){
  const today = new Date();
  if (!type || type.weekday == null) return localDateStr(today);
  const delta = (type.weekday - today.getDay() + 7) % 7;
  const d = new Date(today);
  d.setDate(today.getDate() + delta);
  return localDateStr(d);
}

// Loads
// =========================================================================
async function loadSongs(){
  const { data, error } = await A.supabase.from('worship_songs')
    .select('*').eq('is_active', true).order('title');
  if (error) throw error;
  A.songs = data || [];
  A.loaded.songs = true;
}

async function loadSchedule(){
  // Songs come along because the set lists name them, and the schedule is
  // unreadable without their titles.
  if (!A.loaded.songs) await loadSongs();

  const [typesRes, svcRes] = await Promise.all([
    A.supabase.from('worship_service_types').select('*').eq('is_active', true)
      .order('sort_order').order('name'),
    A.supabase.from('worship_services').select('*').order('service_date', { ascending: true })
  ]);
  if (typesRes.error) throw typesRes.error;
  if (svcRes.error) throw svcRes.error;

  A.types = typesRes.data || [];
  // Members see published services only; an admin is still building the drafts.
  A.services = (svcRes.data || []).filter(s => A.isAdmin || s.status === 'published');

  await loadServiceChildren();
  A.loaded.schedule = true;
}

// Slots and set lists for every service on screen, in two queries rather than
// two per service.
async function loadServiceChildren(){
  const ids = A.services.map(s => s.id);
  A.slots = {}; A.songLinks = {};
  if (!ids.length) return;

  const [slotRes, songRes] = await Promise.all([
    A.supabase.from('worship_service_slots').select('*').in('service_id', ids),
    A.supabase.from('worship_service_songs').select('*').in('service_id', ids).order('sort_order')
  ]);
  if (slotRes.error) throw slotRes.error;
  if (songRes.error) throw songRes.error;

  (slotRes.data || []).forEach(r => { (A.slots[r.service_id] = A.slots[r.service_id] || []).push(r); });
  (songRes.data || []).forEach(r => { (A.songLinks[r.service_id] = A.songLinks[r.service_id] || []).push(r); });
}

async function loadRequests(){
  const { data, error } = await A.supabase.rpc('worship_requests_list');
  if (error) throw error;
  A.requests = data || [];
  A.loaded.requests = true;
}

async function submitJoinRequest(){
  const instruments = INSTRUMENTS.filter(i => $('join-' + i.id) && $('join-' + i.id).checked).map(i => i.id);
  if (!instruments.length) { toast('Pick at least one instrument', true); return; }
  const note = ($('join-note').value || '').trim();

  const { error } = await A.supabase.from('worship_join_requests')
    .insert({ user_id: A.me.id, instruments, note: note || null });
  if (error) { toast('Could not send: ' + error.message, true); return; }

  await loadCore();
  A.loaded.requests = false;
  toast('Request sent');
  render();
}

async function cancelMyRequest(){
  if (!A.myRequest) return;
  const { error } = await A.supabase.from('worship_join_requests').delete().eq('id', A.myRequest.id);
  if (error) { toast('Could not cancel: ' + error.message, true); return; }
  A.myRequest = null;
  A.loaded.requests = false;
  toast('Request cancelled');
  render();
}

// Approving writes the roster row AND closes the request. Both are worship-admin
// writes the database allows; if the roster row fails, the request stays open
// rather than being marked answered with nobody added.
async function decideRequest(id, status){
  const req = A.requests.find(r => r.id === id);
  if (!req) return;

  if (status === 'approved') {
    const { error } = await A.supabase.from('worship_members').insert({
      user_id: req.user_id,
      instruments: req.instruments || [],
      added_by: A.me.id
    });
    // A person already on the roster is not an error worth stopping for: close
    // the request and move on.
    if (error && !/duplicate key/i.test(error.message)) {
      toast('Could not add them: ' + error.message, true);
      return;
    }
  }

  const note = status === 'declined' ? (prompt('A short note back (optional):') || null) : null;
  const { error: upErr } = await A.supabase.from('worship_join_requests').update({
    status, decided_by: A.me.id, decided_at: new Date().toISOString(), decision_note: note
  }).eq('id', id);
  if (upErr) { toast('Could not save: ' + upErr.message, true); return; }

  await Promise.all([loadCore(), loadRequests()]);
  toast(status === 'approved' ? 'Added to the team' : 'Request closed');
  render();
}

// The add-someone search. The directory is one security-definer call that
// returns names only, loaded once and filtered here.
async function renderDirectory(){
  const box = $('dir-results');
  if (!box) return;
  const q = (A._dirQuery || '').trim().toLowerCase();
  const kind = $('dir-kind').value;

  if (!A.directory) {
    box.innerHTML = '<div class="empty">Searching…</div>';
    const { data, error } = await A.supabase.rpc('worship_directory');
    if (error) { box.innerHTML = `<div class="empty">Could not load the directory: ${esc(error.message)}</div>`; return; }
    A.directory = data || [];
  }

  if (q.length < 2) { box.innerHTML = '<div class="empty">Type at least two letters.</div>'; return; }

  const onTeam = new Set(A.roster.map(r => r.user_id));
  const hits = A.directory.filter(p => {
    if (onTeam.has(p.user_id)) return false;
    if (kind === 'student' && p.user_type !== 'student') return false;
    if (kind === 'staff' && p.user_type === 'student') return false;
    return (p.full_name || '').toLowerCase().includes(q);
  }).slice(0, 30);

  box.innerHTML = hits.length ? `<table><tbody>${hits.map(p => `
    <tr>
      <td><strong>${esc(p.full_name)}</strong></td>
      <td style="color:var(--muted)">${esc(whoLabel(p))}</td>
      <td style="text-align:right"><button class="btn small" onclick="addMember('${p.user_id}')">Add</button></td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">Nobody matches, or they are already on the team.</div>';
}

async function saveSong(id){
  const title = ($('sg-title').value || '').trim();
  if (!title) { toast('A song needs a title', true); return; }

  const bpmRaw = ($('sg-bpm').value || '').trim();
  const row = {
    title,
    artist: ($('sg-artist').value || '').trim() || null,
    default_key: ($('sg-key').value || '').trim() || null,
    bpm: bpmRaw ? parseInt(bpmRaw, 10) : null,
    song_url: ($('sg-song-url').value || '').trim() || null,
    chord_chart_url: ($('sg-chart-url').value || '').trim() || null,
    tags: ($('sg-tags').value || '').split(',').map(t => t.trim()).filter(Boolean),
    notes: ($('sg-notes').value || '').trim() || null,
    chord_chart: ($('sg-chart').value || '').trim() || null
  };

  let error;
  if (id) {
    row.updated_at = new Date().toISOString();
    ({ error } = await A.supabase.from('worship_songs').update(row).eq('id', id));
  } else {
    row.created_by = A.me.id;
    ({ error } = await A.supabase.from('worship_songs').insert(row));
  }
  if (error) { toast('Could not save: ' + error.message, true); return; }

  closeModal();
  await loadSongs();
  toast('Saved');
  render();
}

// Soft delete: a song that has been played is still named on old set lists, and
// deleting the row outright would empty those lines.
async function deleteSong(id){
  const s = A.songs.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Remove “${s.title}” from the library? Past set lists keep it.`)) return;

  const { error } = await A.supabase.from('worship_songs').update({ is_active: false }).eq('id', id);
  if (error) { toast('Could not remove: ' + error.message, true); return; }

  closeModal();
  await loadSongs();
  toast('Removed from the library');
  render();
}

async function saveServiceType(id){
  const name = ($('st-name').value || '').trim();
  if (!name) { toast('A service type needs a name', true); return; }

  const dayRaw = $('st-day').value;
  const row = {
    name,
    weekday: dayRaw === '' ? null : parseInt(dayRaw, 10),
    start_time: $('st-time').value || null,
    location: ($('st-loc').value || '').trim() || null,
    notes: ($('st-notes').value || '').trim() || null
  };

  const { error } = id
    ? await A.supabase.from('worship_service_types').update(row).eq('id', id)
    : await A.supabase.from('worship_service_types').insert(row);
  if (error) { toast('Could not save: ' + error.message, true); return; }

  closeModal();
  A.loaded.schedule = false;
  await loadSchedule();
  toast('Saved');
  render();
}

async function deleteServiceType(id){
  const t = A.types.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`Remove “${t.name}”? Dates already scheduled keep their people and songs, but lose the type.`)) return;

  const { error } = await A.supabase.from('worship_service_types').update({ is_active: false }).eq('id', id);
  if (error) { toast('Could not remove: ' + error.message, true); return; }

  A.loaded.schedule = false;
  await loadSchedule();
  toast('Removed');
  render();
}

async function createService(){
  const date = $('ns-date').value;
  if (!date) { toast('Pick a date', true); return; }

  const { error } = await A.supabase.from('worship_services').insert({
    service_type_id: $('ns-type').value,
    service_date: date,
    title: ($('ns-title').value || '').trim() || null,
    status: 'draft',
    created_by: A.me.id
  });
  if (error) { toast('Could not create: ' + error.message, true); return; }

  A.loaded.schedule = false;
  await loadSchedule();
  toast('Service created as a draft');
  render();
}

async function toggleServiceStatus(id){
  const s = A.services.find(x => x.id === id);
  if (!s) return;
  const status = s.status === 'published' ? 'draft' : 'published';

  const { error } = await A.supabase.from('worship_services').update({ status }).eq('id', id);
  if (error) { toast('Could not save: ' + error.message, true); return; }

  s.status = status;
  toast(status === 'published' ? 'The team can see it now' : 'Back to draft');
  renderTab();
}

function editServiceNotes(id){
  const s = A.services.find(x => x.id === id);
  if (!s) return;
  showModal('Service details', `
    <div class="row">
      <div class="field"><label class="fld" for="sv-date">Date</label>
        <input type="date" id="sv-date" value="${esc(s.service_date)}"></div>
      <div class="field" style="flex:1;min-width:160px"><label class="fld" for="sv-title">Title</label>
        <input type="text" id="sv-title" style="width:100%" value="${esc(s.title || '')}"></div>
    </div>
    <div class="field"><label class="fld" for="sv-notes">Notes for the team</label>
      <textarea id="sv-notes">${esc(s.notes || '')}</textarea></div>
    <button class="btn" onclick="saveServiceDetails('${id}')">Save</button>
    <button class="btn sec" onclick="closeModal()">Cancel</button>
  `);
}

async function saveServiceDetails(id){
  const { error } = await A.supabase.from('worship_services').update({
    service_date: $('sv-date').value,
    title: ($('sv-title').value || '').trim() || null,
    notes: ($('sv-notes').value || '').trim() || null
  }).eq('id', id);
  if (error) { toast('Could not save: ' + error.message, true); return; }

  closeModal();
  A.loaded.schedule = false;
  await loadSchedule();
  toast('Saved');
  render();
}

async function deleteService(id){
  const s = A.services.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Delete ${fmtDate(s.service_date)} and everything scheduled on it?`)) return;

  const { error } = await A.supabase.from('worship_services').delete().eq('id', id);
  if (error) { toast('Could not delete: ' + error.message, true); return; }

  A.openService = null;
  A.loaded.schedule = false;
  await loadSchedule();
  toast('Deleted');
  render();
}

async function addSlot(serviceId){
  const userId = $('slot-user-' + serviceId).value;
  const instrument = $('slot-instr-' + serviceId).value;
  const isLeader = !!$('slot-lead-' + serviceId).checked;

  const { error } = await A.supabase.from('worship_service_slots')
    .insert({ service_id: serviceId, user_id: userId, instrument, is_leader: isLeader });
  if (error) {
    toast(/duplicate key/i.test(error.message)
      ? 'They are already on for that instrument'
      : 'Could not add: ' + error.message, true);
    return;
  }

  await loadServiceChildren();
  renderTab();
}

async function removeSlot(slotId, serviceId){
  const { error } = await A.supabase.from('worship_service_slots').delete().eq('id', slotId);
  if (error) { toast('Could not remove: ' + error.message, true); return; }
  await loadServiceChildren();
  renderTab();
}

async function addServiceSong(serviceId){
  const songId = $('song-pick-' + serviceId).value;
  if (!songId) { toast('Pick a song', true); return; }

  const existing = A.songLinks[serviceId] || [];
  const { error } = await A.supabase.from('worship_service_songs').insert({
    service_id: serviceId,
    song_id: songId,
    song_key: ($('song-key-' + serviceId).value || '').trim() || null,
    note: ($('song-note-' + serviceId).value || '').trim() || null,
    sort_order: existing.length
  });
  if (error) { toast('Could not add: ' + error.message, true); return; }

  await loadServiceChildren();
  renderTab();
}

async function removeServiceSong(linkId, serviceId){
  const { error } = await A.supabase.from('worship_service_songs').delete().eq('id', linkId);
  if (error) { toast('Could not remove: ' + error.message, true); return; }
  await loadServiceChildren();
  renderTab();
}

// =========================================================================
// Modal
// =========================================================================
function showModal(title, bodyHtml){
  $('modal').innerHTML = `<button class="close" onclick="closeModal()">&times;</button><h3>${title}</h3>${bodyHtml}`;
  $('modal-bg').classList.add('open');
}
function closeModal(){
  $('modal-bg').classList.remove('open');
  $('modal').innerHTML = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
