<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in with PIN — River Tech</title>
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta name="robots" content="noindex, follow">
  <!--
    This page used to be a second, complete copy of the Games-PIN sign-in form:
    its own input, its own call to the pin-login function, its own verifyOtp,
    and its own error strings - which had already drifted from the ones on the
    sign-in page ("Check your PIN." here, "Please check your PIN." there).

    Nothing in the repo linked to it. The live route is the 🎮 Games PIN tab at
    rivertech.me, so this was a duplicate implementation that only somebody
    typing the URL could reach, and therefore the copy least likely to be
    noticed when it broke.

    It is not deleted, because staff copy on the student record says "For
    sign-in at pin-login" and the address may be written down somewhere this
    repo cannot see. It forwards instead, so the URL keeps working and there is
    one implementation again.

    The forward runs before anything else loads, and replace() keeps this page
    out of the back button.
  -->
  <script>
    (function () {
      try {
        window.location.replace('/#pin');
      } catch (e) {
        window.location.href = '/#pin';
      }
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1216; color: #e6edf3; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: #151a21; border: 1px solid #2a3140; border-radius: 14px;
      padding: 28px 32px; max-width: 420px; text-align: center; line-height: 1.6;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 16px; color: #97a2b0; font-size: 14px; }
    a { color: #6aa9ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 Sign in with PIN</h1>
    <p>Taking you to the sign-in page, on the Games PIN tab.</p>
    <p>If nothing happens, <a href="/#pin">tap here</a>.</p>
  </div>
</body>
</html>
