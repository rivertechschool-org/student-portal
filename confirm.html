<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirming Email...</title>
    <link rel="icon" href="/favicon.ico?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <script src="shared/supabase.min.js"></script>
    <script src="shared/config.js?v=16"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0f1216;
            color: #e6edf3;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #151a21;
            border-radius: 12px;
            border: 1px solid #2a3140;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>✉️ Confirming your email...</h2>
        <p>Please wait while we verify your account.</p>
    </div>

    <script>
        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Mirror the freshly confirmed auth email onto user_profiles.email.
        // Same job as PortalAuth._syncProfileEmail(), but this page runs its own
        // Supabase client, so it does the write itself. Failure is non-fatal —
        // the next sign-in retries it through PortalAuth.
        async function syncProfileEmail(client, user) {
            try {
                if (!user?.email || !user?.id) return;
                if (/@pin\.rivertech\.me$/i.test(user.email)) return;

                const { error } = await client
                    .from('user_profiles')
                    .update({ email: user.email })
                    .eq('auth_user_id', user.id);

                if (error) {
                    console.warn('Profile email sync failed:', error.message);
                } else {
                    console.log('✉️ Profile email synced to', user.email);
                }
            } catch (err) {
                console.warn('Profile email sync error:', err);
            }
        }

        async function handleEmailConfirmation() {
            // Use exact same values from config.js
            const supabaseUrl = 'https://joxvhzxkrcigknsdrusr.supabase.co';
            const supabaseKey = 'sb_publishable_xgvdFBaHCJKl9p-Lu61aZw_3oLkeTtc';

            // IMPORTANT: Must match config.js options for session persistence to work
            const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey, {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            });
            
            // Get tokens from URL hash (Supabase puts them here)
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            const access_token = hashParams.get('access_token');
            const refresh_token = hashParams.get('refresh_token');
            const type = hashParams.get('type');

            // supabase-js CLEARS window.location.hash the moment it detects an
            // implicit grant — literally `window.location.hash = ""` at the end of
            // _getSessionFromURL(), which runs inside createClient() above. That
            // happens long before the setTimeout redirects below fire, so
            // `'/index.html?setup_password=true' + window.location.hash` handed the
            // next page an EMPTY fragment. Root index.html gates the teacher
            // password-setup modal on `needsPasswordSetup && accessToken`, so the
            // modal never opened and the invited teacher just landed on the normal
            // login screen. Rebuild the fragment from the values captured here,
            // which were read before supabase-js could wipe them.
            const sessionHash = (access_token && refresh_token)
                ? '#access_token=' + encodeURIComponent(access_token) +
                  '&refresh_token=' + encodeURIComponent(refresh_token) +
                  (type ? '&type=' + encodeURIComponent(type) : '')
                : '';

            // Supabase reports a dead link (already clicked, expired, or consumed
            // by an email-security scanner that pre-fetches URLs) as error params
            // in the hash, with no tokens. Name the cause instead of falling
            // through to a generic "invalid link".
            const hashError = hashParams.get('error');
            const hashErrorCode = hashParams.get('error_code');

            console.log('Verification type:', type);
            console.log('Has access token:', !!access_token);

            if (hashError && !access_token) {
                const expired = /expired|invalid/i.test(hashErrorCode || hashError || '');
                document.querySelector('.container').innerHTML = `
                    <h2>⚠️ This link is no longer valid</h2>
                    <p>${expired
                        ? 'Invitation and confirmation links can only be used once, and they expire.'
                        : escapeHtml(hashParams.get('error_description') || 'The link could not be verified.')}</p>
                    <p>Ask an administrator to send a fresh invite, then open it on this device
                       without forwarding it.</p>
                    <a href="/">Return to Portal</a>
                `;
                return;
            }

            if (access_token && refresh_token) {
                try {
                    // Set the session with the tokens
                    const { data, error } = await supabaseClient.auth.setSession({
                        access_token: access_token,
                        refresh_token: refresh_token
                    });

                    if (error) throw error;

                    console.log('Session set successfully:', data?.user?.email);

                    // Verify session was persisted by reading it back
                    const { data: sessionCheck } = await supabaseClient.auth.getSession();
                    console.log('Session verification:', sessionCheck?.session ? 'OK' : 'FAILED');

                    // Check if this is a teacher setup (invited by admin)
                    const urlParams = new URLSearchParams(window.location.search);
                    const isTeacherSetup = urlParams.get('teacher_setup') === 'true';
                    const userMetadata = data?.user?.user_metadata || {};
                    const needsPasswordSetup = userMetadata.needs_password_setup;
                    const isEmailChange = type === 'email_change' || urlParams.get('email_change') === 'true';

                    if (isEmailChange) {
                        // Supabase's "Secure email change" sends a link to BOTH the old
                        // and the new address, and only swaps user.email once both have
                        // been clicked. Until then new_email stays populated.
                        const { data: fresh } = await supabaseClient.auth.getUser();
                        const user = fresh?.user || data?.user;
                        const pending = user?.new_email;

                        if (pending) {
                            document.querySelector('.container').innerHTML = `
                                <h2>✅ One down, one to go</h2>
                                <p>Thanks — this address is confirmed.</p>
                                <p>To finish switching to <strong>${escapeHtml(pending)}</strong>,
                                   open the other confirmation email and click its link too.</p>
                                <p>Until then, keep signing in with your current email.</p>
                                <a href="/">Return to Portal</a>
                            `;
                            return;
                        }

                        // Both links clicked — Auth has swapped the address. Bring the
                        // user_profiles mirror along so notification emails, enrollment
                        // RLS and directory lookups all follow.
                        await syncProfileEmail(supabaseClient, user);

                        document.querySelector('.container').innerHTML = `
                            <h2>✅ Email Updated!</h2>
                            <p>Your account email is now <strong>${escapeHtml(user?.email || '')}</strong>.</p>
                            <p>Use it the next time you sign in. Redirecting to the portal...</p>
                        `;

                        setTimeout(() => {
                            window.location.href = '/' + sessionHash;
                        }, 2500);
                        return;
                    }

                    if (isTeacherSetup || needsPasswordSetup) {
                        // Teacher was invited by admin - redirect to main portal password setup
                        document.querySelector('.container').innerHTML = `
                            <h2>✅ Email Confirmed!</h2>
                            <p>Your account has been verified successfully.</p>
                            <p>Redirecting to set your password...</p>
                        `;

                        // Redirect to main index.html with setup_password flag
                        // The hash tokens are preserved so the session remains valid
                        setTimeout(() => {
                            window.location.href = '/index.html?setup_password=true' + sessionHash;
                        }, 1500);
                    } else {
                        document.querySelector('.container').innerHTML = `
                            <h2>✅ Email Confirmed!</h2>
                            <p>Your account has been verified successfully.</p>
                            <p>Redirecting to portal...</p>
                        `;

                        // Redirect after 2 seconds - preserve hash tokens as backup
                        setTimeout(() => {
                            // Include hash tokens in case session storage didn't persist
                            window.location.href = '/' + sessionHash;
                        }, 2000);
                    }
                    
                } catch (error) {
                    console.error('Verification error:', error);
                    document.querySelector('.container').innerHTML = `
                        <h2>❌ Verification Failed</h2>
                        <p>${error.message}</p>
                        <a href="/">Return to Portal</a>
                    `;
                }
            } else {
                // Check if this is a different type of confirmation
                if (type === 'recovery') {
                    // Redirect to reset.html with the hash parameters preserved
                    document.querySelector('.container').innerHTML = `
                        <h2>🔑 Password Reset</h2>
                        <p>Redirecting to password reset page...</p>
                    `;
                    // Preserve the hash with tokens when redirecting
                    setTimeout(() => {
                        window.location.href = '/reset.html' + window.location.hash;
                    }, 500);
                    return;
                } else if (type === 'email_change' || new URLSearchParams(window.location.search).get('email_change') === 'true') {
                    // Confirmed, but this link didn't carry a session (already-signed-in
                    // browser, or the first half of a secure email change). Nothing to
                    // set up here — say so plainly instead of "invalid link".
                    document.querySelector('.container').innerHTML = `
                        <h2>✅ Email Confirmation Received</h2>
                        <p>If your email change required confirming from both your old and new
                           address, open the other confirmation email and click its link too.</p>
                        <p>Sign in again to see the change take effect.</p>
                        <a href="/">Return to Portal</a>
                    `;
                    return;
                } else {
                    document.querySelector('.container').innerHTML = `
                        <h2>⚠️ Invalid Verification Link</h2>
                        <p>This link may have expired or already been used.</p>
                        <a href="/">Return to Portal</a>
                    `;
                }
            }
        }
        
        // Run when page loads
        handleEmailConfirmation();
    </script>
</body>
</html>
